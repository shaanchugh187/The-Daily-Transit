<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Daily Transit</title>
<meta name="description" content="Read News-On The Go. One finished daily read on India, the world, money, tech and Pune.">
<meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Transit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("dl_theme");if(t)document.documentElement.dataset.theme=t;var f=+localStorage.getItem("dl_fs");if(f)document.documentElement.style.fontSize=[16,18,20][f]+"px";}catch(e){}</script>
<style>
:root{--bg:#FAF8F3;--card:#fff;--ink:#16181d;--mute:#5d6169;--faint:#8a8d93;--line:#e6e1d6;--soft:#f2eee5;--ac:#8a1c1c;--ac2:#9a7a35;--ok:#2f6b3f;--warn:#9a5b00;--sh:0 1px 2px rgba(20,20,20,.04),0 4px 14px rgba(20,20,20,.05);
--cW:#1f5f8b;--cT:#2f6b3f;--cI:#a14d00;--cM:#8f1d4f;--cP:#5b3a9a;--cB:#7a5a00;--cL:#0f6b63;color-scheme:light}
body.wknd{--bg:#F6F3EA;--soft:#ede8da}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1b1d21;--ink:#ececea;--mute:#a7aab1;--faint:#7d8087;--line:#2d3036;--soft:#23262b;--ac:#e98b7c;--ac2:#d6b36c;--ok:#7cc48f;--warn:#e0a85a;--sh:none;--cW:#7fb6e0;--cT:#86c99a;--cI:#f0a868;--cM:#e48bb4;--cP:#b9a2ee;--cB:#dcbd62;--cL:#6fcfc4;color-scheme:dark}:root:not([data-theme="light"]) body.wknd{--bg:#141412;--soft:#25241f}}
:root[data-theme="dark"]{--bg:#121316;--card:#1b1d21;--ink:#ececea;--mute:#a7aab1;--faint:#7d8087;--line:#2d3036;--soft:#23262b;--ac:#e98b7c;--ac2:#d6b36c;--ok:#7cc48f;--warn:#e0a85a;--sh:none;--cW:#7fb6e0;--cT:#86c99a;--cI:#f0a868;--cM:#e48bb4;--cP:#b9a2ee;--cB:#dcbd62;--cL:#6fcfc4;color-scheme:dark}
:root[data-theme="dark"] body.wknd{--bg:#141412;--soft:#25241f}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:var(--ac)}
.serif{font-family:Newsreader,Georgia,serif}
#prg{position:fixed;top:0;left:0;height:2px;background:var(--ac);width:0;z-index:300}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
/* top bar */
#bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;max-width:680px;margin:0 auto;font-size:.75rem}
.bg{display:flex;gap:6px;align-items:center}
.tb{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.72rem;font-weight:600;color:var(--mute);line-height:1.2}
.tb:hover{color:var(--ink);border-color:var(--mute)}
.tb:disabled{opacity:.35;cursor:default}
#isel{font:inherit;font-size:.72rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 8px;border-radius:999px;max-width:150px}
/* masthead */
header{text-align:center;padding:18px 16px 10px;max-width:680px;margin:0 auto}
.kick{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
header h1{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:2.4rem;line-height:1.05;letter-spacing:-.01em;margin:6px 0 4px}
.tagl{font-family:Newsreader,Georgia,serif;font-style:italic;color:var(--mute);font-size:1rem}
.rule{height:1px;background:var(--line);margin:14px auto 0;max-width:680px}
.hrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card)}
.seg button{background:none;border:0;border-radius:999px;padding:6px 13px;font-size:.74rem;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
#lbtn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-size:.74rem;font-weight:600}
/* weekend masthead: teal band with a "Weekend Edition" badge; weekdays stay plain */
.ebadge{display:none}
body.wknd header{background:#123C3C;color:#fff;max-width:none;padding:22px 16px 18px}
body.wknd header .kick{color:rgba(255,255,255,.6)}
body.wknd header .tagl{color:rgba(255,255,255,.72)}
body.wknd .ebadge{display:inline-block;background:#C9A227;color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:4px;margin-bottom:10px}
body.wknd header .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
body.wknd header .seg button{color:rgba(255,255,255,.75)}
body.wknd header .seg button.on{background:#fff;color:#123C3C}
body.wknd header #lbtn{background:#fff;color:#123C3C;border-color:#fff}
body.wknd header .tb{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.3)}
/* mode bar */
#modes{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line)}
#modes .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;padding-bottom:8px}
#modes .seg{background:var(--soft);border-color:transparent}
#modes .seg button{padding:7px 14px;font-size:.8rem}
#modes .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
:root[data-theme="dark"] #modes .seg button.on{background:#33363c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #modes .seg button.on{background:#33363c}}
.mlab{font-size:.68rem;color:var(--faint);font-weight:600}
/* sections */
main{padding-bottom:30px}
.sec{margin:22px 0}
.sh{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh span{color:var(--faint);letter-spacing:.04em;text-transform:none;font-weight:500}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--sh)}
.brief{list-style:none;counter-reset:b}
.brief li{counter-increment:b;padding:12px 0 12px 34px;border-bottom:1px solid var(--line);position:relative;font-size:.93rem}
.brief li:last-child{border-bottom:0}
.brief li:before{content:counter(b);position:absolute;left:0;top:10px;font-family:Newsreader,serif;font-size:1.3rem;color:var(--ac2);font-weight:600}
.brief b{display:block;font-weight:600;line-height:1.4}
.brief .bw,.brief .bn{display:block;font-size:.84rem;color:var(--mute);margin-top:3px}
.brief .bw i,.brief .bn i{font-style:normal;font-weight:600;color:var(--ink)}
.nrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num b{font-family:Newsreader,serif;font-size:2.4rem;line-height:1;display:block;margin:4px 0 6px;font-weight:600}
.num p,.talk p{font-size:.86rem;color:var(--mute)}
.lab{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.talk{border-left:3px solid var(--ac2)}
.xsrc{font-size:.7rem;color:var(--faint);margin-top:8px}
.chg{list-style:none}
.chg li{font-size:.86rem;padding:8px 0;border-bottom:1px dashed var(--line)}
.chg li:last-child{border:0}
.chg b{color:var(--ac)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s;position:relative}
.card:hover{border-color:var(--mute)}
.card:focus-visible,.tb:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card.one{border:1.5px solid var(--ink)}
.card.hl{border-color:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.cat{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.cW{color:var(--cW)}.cT{color:var(--cT)}.cI{color:var(--cI)}.cM{color:var(--cM)}.cP{color:var(--cP)}.cB{color:var(--cB)}.cL{color:var(--cL)}
.chip{font-size:.62rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--mute);background:none;line-height:1.5}
.chip.Confirmed{color:var(--ok);border-color:currentColor}
.chip.Reported{color:var(--cW);border-color:currentColor}
.chip.Claimed{color:var(--warn);border-color:currentColor}
.chip.Developing{color:var(--ac);border-color:currentColor}
.bdg{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ac);color:var(--bg);border-radius:4px;padding:1px 6px}
.bdg.new{background:var(--ink)}
.thc{font-size:.62rem;font-weight:600;color:var(--ac2);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}
.card h3{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:1.22rem;line-height:1.28;letter-spacing:-.005em}
.card h3 .no{color:var(--ac2);margin-right:6px}
.card.one h3{font-size:1.45rem}
.made{font-size:.76rem;color:var(--faint);margin-top:6px;font-style:italic}
.anat{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}
.anat dt{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--faint);padding-top:.25em;white-space:nowrap}
.anat dd{color:var(--ink)}
.anat dd.m{color:var(--mute)}
.since{font-size:.8rem;margin-top:10px;padding:7px 10px;background:var(--soft);border-radius:8px;color:var(--mute)}
.since b{color:var(--ink)}
.cfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:.72rem;color:var(--faint)}
.cfoot .sp{flex:1}
.lk{background:none;border:0;font-size:.72rem;font-weight:600;color:var(--mute);padding:4px 0;margin-right:8px}
.lk:hover{color:var(--ink)}
.lk[aria-expanded="true"]{color:var(--ac)}
.sv.on{color:var(--ac2)}
.drawer{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:8px;font-size:.83rem;cursor:auto}
.drawer ul{list-style:none}
.drawer li{padding:4px 0}
.drawer a{font-weight:600;text-decoration:none}
.drawer a:hover{text-decoration:underline}
.drawer .note{font-size:.72rem;color:var(--faint);margin-top:6px}
.tl{list-style:none;margin-top:8px;border-left:2px solid var(--line);padding-left:12px}
.tl li{padding:4px 0;font-size:.82rem;position:relative}
.tl li:before{content:"";position:absolute;left:-17px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.tl li.me:before{background:var(--ac)}
.tl li.me{font-weight:600}
.tl small{display:block;color:var(--faint);font-size:.68rem;font-weight:500}
.tl [role=button]{cursor:pointer}
.tl [role=button]:hover{color:var(--ac)}
/* dots */
.dots{border:1.5px dashed var(--ac2);border-radius:12px;padding:14px 16px;margin:-2px 0 14px;position:relative;background:var(--card)}
.dots:before{content:"";position:absolute;left:28px;top:-14px;height:12px;border-left:1.5px dashed var(--ac2)}
.dots h4{font-family:Newsreader,serif;font-size:1.05rem;margin:4px 0 6px}
.dots p{font-size:.86rem;color:var(--mute)}
/* explainer etc */
details.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
details.ex summary{padding:14px 16px;cursor:pointer;font-weight:600;font-size:.92rem;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary:after{content:"+";color:var(--faint);font-weight:400}
details.ex[open] summary:after{content:"–"}
details.ex summary .lab{display:block;margin-bottom:2px}
details.ex>div{padding:0 16px 16px;font-size:.9rem;color:var(--mute)}
.watch{list-style:none}
.watch li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:.87rem}
.watch li:last-child{border:0}
.wd{min-width:54px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.15}
.wd b{display:block;font-family:Newsreader,serif;font-size:1.15rem}
.wd small{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.watch .wt{flex:1}
.cal{white-space:nowrap}
/* filters */
#fp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px;margin-top:14px}
#fp::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.74rem;font-weight:600;background:var(--card);color:var(--mute)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .st{color:var(--ac2)}
/* finish */
.fin{text-align:center;padding:30px 16px 10px}
.fin .mk{font-family:Newsreader,serif;font-size:1.6rem;color:var(--ac2);letter-spacing:.4em}
.fin h3{font-family:Newsreader,serif;font-size:1.5rem;font-weight:600;margin:6px 0 4px}
.fin p{color:var(--mute);font-size:.88rem}
.fin .tb{margin-top:12px}
/* quiz */
.qz{margin-top:4px}
.qq{padding:12px 0;border-bottom:1px solid var(--line)}
.qq:last-of-type{border:0}
.qq p{font-weight:600;font-size:.9rem;margin-bottom:8px;color:var(--ink)}
.qo{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:.85rem}
.qo:hover:not(:disabled){border-color:var(--mute)}
.qo.right{border-color:var(--ok);color:var(--ok);font-weight:600}
.qo.wrong{border-color:var(--ac);color:var(--ac)}
.qo:disabled{cursor:default}
.qe{font-size:.8rem;color:var(--mute);margin-top:4px}
.qs{font-weight:600;font-size:.86rem;margin-top:10px}
/* since you last read */
#since .box{border-color:var(--ac2)}
#since ul{list-style:none;margin-top:6px}
#since li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem;cursor:pointer}
#since li:last-child{border:0}
#since li small{display:block;color:var(--faint);font-size:.7rem}
.x{float:right;background:none;border:0;color:var(--faint);font-size:1rem;line-height:1}
/* footer */
footer{border-top:1px solid var(--line);margin-top:20px;padding:22px 16px 110px;text-align:center;font-size:.76rem;color:var(--faint)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-bottom:10px}
footer nav button{background:none;border:0;font-size:.76rem;font-weight:600;color:var(--mute);padding:4px 0}
footer nav button:hover{color:var(--ink)}
/* modal */
#ov{display:none;position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:200;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .35s ease-out}
#ov.open,#ov.closing{display:flex}
#ov.show{opacity:1}
#ov.closing{opacity:0;transition:opacity .25s ease-in;pointer-events:none}
#ov #md{transform:translateY(18px) scale(.95);opacity:0;transition:transform .42s cubic-bezier(.2,.9,.3,1.12),opacity .32s ease-out}
#ov.show #md{transform:none;opacity:1}
#ov.closing #md{transform:translateY(10px) scale(.97);opacity:0;transition:transform .25s ease-in,opacity .22s ease-in}
#mbod.swap{animation:swapin .32s ease-out}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#main.enter{animation:mainin .38s ease-out}
@keyframes mainin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#ov #md,#ov.show #md,#ov.closing #md{transform:none!important}#mbod.swap,#main.enter{animation:fadeonly .2s}}
@keyframes fadeonly{from{opacity:0}to{opacity:1}}
#md{background:var(--bg);border-radius:16px 16px 0 0;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;padding:22px 20px 28px;position:relative;-webkit-overflow-scrolling:touch}
@media(min-width:700px){#ov{align-items:center}#md{border-radius:16px;max-height:86vh;padding:28px}}
#mc{position:sticky;top:0;float:right;background:var(--card);border:1px solid var(--line);border-radius:999px;width:32px;height:32px;font-size:.9rem;color:var(--mute);z-index:2}
#md h2{font-family:Newsreader,serif;font-weight:600;font-size:1.65rem;line-height:1.2;margin:4px 0 8px}
#mbod p.body{font-size:.98rem;line-height:1.7;margin-top:14px;font-family:Newsreader,Georgia,serif;font-size:1.08rem}
.msec{margin-top:18px}
.mx{font-size:.88rem;margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:8px}
.mx b{color:var(--ac)}
.corr{border-left:3px solid var(--ac)}
.mact{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.78rem;font-weight:600}
.pbtn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{list-style:none}
.plist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem;cursor:pointer}
.plist li:hover b{color:var(--ac)}
.plist li small{display:block;color:var(--faint);font-size:.72rem}
#q{width:100%;font:inherit;font-size:1rem;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:6px 0 12px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
mark{background:rgba(214,179,108,.35);color:inherit;border-radius:2px}
.cmp{width:100%;border-collapse:collapse;font-size:.84rem;margin:10px 0}
.cmp th,.cmp td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.wk{display:flex;gap:6px;margin:10px 0 14px}
.wk span{flex:1;text-align:center;font-size:.62rem;color:var(--faint);font-weight:600}
.wk i{display:block;height:28px;border-radius:6px;background:var(--soft);margin-bottom:4px}
.wk i.on{background:var(--ac2)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{font-family:Newsreader,serif;font-size:1.6rem;display:block}
.stat span{font-size:.7rem;color:var(--faint)}
.pt p{margin-bottom:10px;font-size:.9rem}
.pt h4{font-size:.95rem;margin:14px 0 4px}
.chk{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:.9rem;border-bottom:1px solid var(--line)}
.crintro{font-size:.86rem;color:var(--mute);margin-bottom:8px}
.cr{padding:12px 0;border-bottom:1px solid var(--line);font-size:.86rem;cursor:pointer}
.crh{font-size:.72rem;color:var(--faint);margin-bottom:4px}
/* tooltips */
.gl{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:1px dotted var(--faint);cursor:help}
/* jargon card with a soft pop */
#gtip{display:none;position:fixed;z-index:400;width:300px;max-width:calc(100vw - 24px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 18px;font-size:.84rem;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);opacity:0;transform:translateY(6px) scale(.92);transition:opacity .2s ease-out,transform .24s cubic-bezier(.2,.9,.3,1.25)}
#gtip.up{transform:translateY(-6px) scale(.92)}
#gtip.show{opacity:1;transform:none}
#gtip.hiding{transition:opacity .12s ease-in,transform .12s ease-in}
#gtip:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--ac2)}
#gtip .ar{position:absolute;left:calc(var(--ax,28px) - 6px);top:-7px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
#gtip.up .ar{top:auto;bottom:-7px;transform:rotate(225deg)}

/* style: 1900s */

.np-A3.np-1900 .nplead h1{font-size:34pt}
.np-1900 .npsec h2{font-size:10.5pt}
.np-1900 .npart h3{font-size:9.5pt}
.np-1900 .npdek{text-align:center!important;font-size:1em;text-transform:uppercase;font-style:normal;letter-spacing:.03em;padding:1mm 0;margin:1mm 6mm 2mm!important;border-top:.3mm solid var(--rule);border-bottom:.3mm solid var(--rule)}
.np-1900 .nplead>.npdek{font-size:9pt}
.np-1900 .npart .npdek{text-transform:none;font-style:italic;letter-spacing:0;border:0;margin:0 0 1.2mm!important;padding:0}
.np-1900 .npk{text-align:center;font-style:italic;text-transform:none;letter-spacing:.02em;font-weight:400;font-size:7.5pt}
.np-1900 .npk::before,.np-1900 .npk::after{content:" — "}
.np-1900 .npfig img{filter:grayscale(1) contrast(1.15)}
.np-1900 .npfig figcaption{text-align:center;font-style:italic;color:#3a3226}
.np-1900 .nplead{border-bottom:1.6mm double var(--rule)}
.np-1900 .npsh{text-align:center;border-top:1.6mm double var(--rule);letter-spacing:.25em}
.np-1900 .npbox{border:.8mm double var(--rule)}
.np-1900 .npwhy{border-left:0;padding-left:0;font-style:italic}
.np-1900 .npcard{border-style:double;border-width:.8mm}
.np-1900 .npcard .gb{fill:#efe4c8}
.np-1900 .nprh{border-bottom:1.6mm double var(--rule);font-family:"Old Standard TT",serif}
.np-1900 .npend,.np-1900 .npsrc,.np-1900 .npcr{color:#4a4134}

/* style: Daily Transit */
.np-transit{--acc:#8a1c1c;--rule:#16181d;--soft:#cdbf9f;--boxbg:#f6f1e7;font-family:Newsreader,Georgia,serif}
.np-transit .npname{font-family:Newsreader,Georgia,serif;font-weight:700;letter-spacing:-.01em}
.np-transit h1,.np-transit h2,.np-transit h3{font-family:Newsreader,Georgia,serif;font-weight:700}
.np-transit .npear,.np-transit .npdl,.np-transit .npk,.np-transit .nprh,.np-transit .npsh,.np-transit .nprb h3,.np-transit .npbriefs h3,.np-transit .npcont{font-family:Inter,Arial,sans-serif}
.np-transit .npear{border-color:#9a7a35;color:#8a1c1c;text-transform:none;letter-spacing:.02em;font-style:italic;font-family:Newsreader,Georgia,serif;font-size:9pt}
.np-transit .npdl{border-top-color:#8a1c1c;border-bottom-color:#9a7a35}
.np-transit .npsh{color:#8a1c1c;border-top-color:#9a7a35}

@media print{

}
.npleadg:not(:has(.npfig)){display:block}

</style>

/* ===== NAME: leave name empty until it is decided. Fill these in and every page title, the masthead and audio intro update. ===== */
const BRAND={name:"The Daily Transit",tag:"Read News-On The Go"};
const CATS={W:"World",T:"Tech",I:"India",M:"Maharashtra",P:"Pune",B:"Money",L:"Life"};
const DETAIL={"Top Stories":"W","World":"W","Geopolitics":"W","Politics":"W","Politics & Government":"W",
"India":"I","Policy & Regulation":"I","Personal Finance":"B","Economy":"B","Business":"B","Markets":"B","Markets & Investing":"B","Startups":"B","Real Estate":"B","Crypto":"B","Crypto & Digital Assets":"B","Careers & Work":"B",
"Technology":"T","Tech":"T","AI":"T","Science":"T","Innovation":"T","Cybersecurity":"T","Space":"T","Consumer Tech":"T","Social Media & Internet":"T","Creator Economy":"T","Automotive & Mobility":"T",
"Health":"L","Climate":"L","Climate & Environment":"L","Education":"L","Consumer Trends":"L","Sports":"L","Entertainment":"L","Movies & OTT":"L","Music":"L","Culture":"L","Lifestyle":"L","Travel":"L","Food":"L",
"Maharashtra":"M","Pune":"P"};

const ISSUES=[
{num:1,label:"Saturday, September 12, 2026",wknd:true,
sum:["Ukraine requests emergency air defense package as Russia escalates eastern front.","OpenAI releases GPT-5 Turbo with near real-time reasoning; EU AI Act enforcement begins.","India-EU Free Trade Agreement implementation roadmap published by Commerce Ministry.","Heavy weekend rains forecast for Pune and Satara; IMD issues orange alert.","Ganeshotsav 2026 preparations complete — 10,000+ pandals ready across Pune."],
stories:[
{c:"W",lead:1,title:"Ukraine requests emergency air defense as Russia escalates east",dek:"Kyiv formally requested an emergency package from US and European partners as Russia launched its heaviest bombardment of the eastern front in months, targeting Donetsk and Zaporizhzhia simultaneously.",body:"Ukraine submitted an emergency request to US and European partners for additional Patriot batteries and interceptor missiles as Russia launched its heaviest bombardment of the eastern front in months. Defense officials in Kyiv said Russian forces were attempting to advance on multiple axes simultaneously in Donetsk, stretching Ukrainian defensive lines thin. The US State Department said the request was under active review.",src:"Reuters / AP"},
{c:"W",title:"Iran warns of decisive response if US tightens Hormuz restrictions",dek:"Iran's Revolutionary Guard issued a stark warning after reports that the Trump administration is considering additional restrictions on Iranian naval operations in the Strait of Hormuz.",body:"Iran's Islamic Revolutionary Guard Corps warned of a decisive and painful response if the US further restricts Iranian naval operations in the Strait of Hormuz. The warning came as the average US gas price climbed above $4 per gallon on the back of ongoing Middle East tensions. India, which relies heavily on Gulf oil imports, has been quietly expanding its Russian crude purchases to fill the supply gap.",src:"Reuters / CNBC"},
{c:"T",lead:1,title:"OpenAI releases GPT-5 Turbo with near real-time reasoning",dek:"OpenAI's latest model significantly outperforms GPT-5 on complex multi-step reasoning benchmarks and processes inputs in near real-time, intensifying competition with Google and Anthropic.",body:"OpenAI released GPT-5 Turbo, an updated model claiming near-real-time processing with significantly improved multi-step reasoning. The release intensifies the AI model race with Google Gemini Ultra and Anthropic's Claude. The model is available via API and to ChatGPT Plus subscribers immediately. OpenAI CEO Sam Altman called it the most capable model the company has ever shipped.",src:"The Verge / TechCrunch"},
{c:"T",title:"EU AI Act first compliance wave begins for high-risk AI systems",dek:"The EU AI Act began its first enforcement wave, requiring companies deploying high-risk AI in healthcare, credit scoring, and education to meet new transparency mandates or face fines up to 6% of global revenue.",body:"The EU AI Act's first major compliance deadline hit, requiring companies operating high-risk AI systems in healthcare, credit scoring, and educational assessment to meet new transparency, documentation, and audit requirements. Non-compliant companies face fines of up to €30 million or 6% of global annual revenue. Several major US tech firms were granted 90-day extensions.",src:"Politico Europe / BBC"},
{c:"I",lead:1,title:"India-EU Free Trade Agreement implementation roadmap published",dek:"India's Commerce Ministry published the full implementation roadmap for the India-EU FTA signed in January, covering tariff schedules, dispute mechanisms, and sector-specific timelines.",body:"India's Ministry of Commerce and Industry released the implementation roadmap for the India-EU Free Trade Agreement signed in January 2026. The roadmap covers tariff reduction schedules across goods and services, investment protection clauses, and timelines for sector-specific liberalisation. Trade experts said the deal could boost bilateral trade by $150 billion over the next decade.",src:"Ministry of Commerce / The Hindu"},
{c:"M",title:"Heavy weekend rains forecast for Pune, Satara; orange alert issued",dek:"IMD issued an orange alert for Pune, Satara, and ghat sections of Kolhapur ahead of an active weekend trough bringing heavy to very heavy rainfall.",body:"IMD issued an orange alert for Pune, Satara, and ghat sections of Kolhapur and Ratnagiri districts, forecasting heavy to very heavy rainfall over the weekend. Citizens in low-lying areas were advised to remain cautious. The NDRF pre-positioned teams in Satara as a precaution.",src:"IMD / India.com"},
{c:"P",title:"Ganeshotsav 2026: 10,000+ pandals ready; security deployed across Pune",dek:"Over 10,000 Ganesh pandals across Pune are fully set up as the city prepares for Ganeshotsav 2026. PMC and Pune Police have deployed extensive security and traffic management.",body:"Pune is ready for Ganeshotsav 2026, with over 10,000 pandals set up across the city. The Pune Police deployed over 15,000 personnel, while the PMC laid out elaborate traffic diversions. The Kasba Ganpati, Tambdi Jogeshwari, Guruji Talim, Tambat Ali, and Kesariwada Ganapati pandals are expected to draw the largest crowds.",src:"Punekarnews.in / Pune Mirror"}
]},

{num:2,label:"Sunday, September 13, 2026",wknd:true,
sum:["G20 finance ministers agree on global minimum corporate tax enforcement framework.","Russia blocks UN Security Council humanitarian corridors resolution for Ukraine.","India announces 650-strong contingent for Asian Games 2026 in Aichi-Nagoya.","Nashik district under IMD orange alert; heavy rainfall through Monday.","Ganeshotsav Day 1 draws 15 lakh devotees to Pune pandals."],
stories:[
{c:"W",lead:1,title:"G20 finance ministers agree on global minimum tax enforcement",dek:"Finance ministers from G20 nations agreed on a framework to enforce the 15% global minimum corporate tax, closing loopholes that have allowed major multinationals to shelter profits offshore.",body:"Finance ministers from G20 nations reached agreement on an enforcement framework for the 15% global minimum corporate tax. Tax experts say the deal could generate over $200 billion annually in additional government revenues. The US and EU pushed hardest for robust enforcement mechanisms, while several developing nations secured carve-outs for strategic industries.",src:"Bloomberg / Financial Times"},
{c:"W",title:"Russia blocks UNSC resolution on Ukraine humanitarian corridors",dek:"Russia used its Security Council veto to block a resolution establishing protected humanitarian corridors for civilian evacuation in eastern Ukraine's contested zones.",body:"Russia blocked a UN Security Council resolution establishing protected humanitarian corridors for civilian evacuations in eastern Ukraine. The resolution was sponsored by France, the UK, and Japan. Ukraine's UN ambassador called the veto a war crime by proxy. The US said it would pursue the matter through the UN General Assembly.",src:"UN News / AP"},
{c:"T",lead:1,title:"Apple releases AirPods Pro 3 with spatial audio overhaul",dek:"Apple quietly released AirPods Pro 3 with a redesigned spatial audio system and lossless wireless audio, bypassing a formal launch event and updating the product directly on its website.",body:"Apple released AirPods Pro 3 without a formal announcement. The new earbuds feature a redesigned spatial audio system, lossless wireless audio via a proprietary Apple connection, and a claimed 40-hour battery life with the case. Reviewers noted it addresses the main audio compression complaints of the previous generation.",src:"9to5Mac / The Verge"},
{c:"T",title:"Samsung confirms Galaxy XR headset reveal at IFA 2026 Berlin",dek:"Samsung confirmed a major Galaxy XR mixed-reality headset announcement at IFA 2026 in Berlin, directly positioning itself against Apple's Vision Pro at a significantly lower price point.",body:"Samsung confirmed a major Galaxy XR announcement at IFA 2026 in Berlin, teasing a mixed-reality headset that will compete directly with Apple Vision Pro. Industry analysts expect the device to run Google's Android XR platform and retail at under $1,500.",src:"The Verge / Android Authority"},
{c:"I",lead:1,title:"India announces 650-strong contingent for Asian Games 2026",dek:"India's Olympic Association confirmed a 650-strong contingent for the Asian Games 2026 in Aichi-Nagoya, with high medal hopes in shooting, badminton, kabaddi, and athletics.",body:"India's Olympic Association confirmed a 650-strong contingent for the 2026 Asian Games in Aichi-Nagoya, Japan, competing across 40 sports. India will target 25+ medals, with strong prospects in shooting, badminton, kabaddi, boxing, and wrestling. Lakshya Sen leads the badminton team, Elavenil Valarivan leads the shooting squad.",src:"PTI / Olympics.com"},
{c:"M",title:"Nashik under IMD orange alert; Nandurbar and Dhule on yellow",dek:"Heavy rainfall is expected across north Maharashtra, with Nashik receiving the most intense showers. IMD has issued an orange alert through Monday.",body:"IMD issued an orange alert for Nashik district and yellow alerts for Nandurbar and Dhule as an active monsoon trough pushes north. Nashik city received 45mm of rainfall in the previous 24 hours. The Godavari river at Panchavati is at 70% of its warning level.",src:"IMD / Maharashtra Times"},
{c:"P",title:"Ganeshotsav Day 1: 15 lakh devotees, record footfall at Kasba Ganpati",dek:"Day 1 of Ganeshotsav 2026 drew an estimated 15 lakh devotees across Pune's major pandals, with Kasba Ganpati reporting queues stretching over 2 kilometres.",body:"The first day of Ganeshotsav 2026 drew an estimated 15 lakh devotees to Pune's pandals. Kasba Ganpati — the city's presiding deity — reported record footfall, with queues stretching over 2 kilometres by evening. The PMC's waste management crews collected over 80 tonnes of floral offerings.",src:"Pune Mirror / Punekarnews.in"}
]},

{num:3,label:"Monday, September 14, 2026",wknd:false,
sum:["Trump and NATO chief agree on accelerated Ukraine weapons delivery package.","Iran-backed militia strikes US base in eastern Syria; no casualties, Washington warns of response.","Google DeepMind claims protein structure breakthrough for treating over 200 rare diseases.","India and Russia sign expanded energy cooperation deal in New Delhi.","Pune Metro crosses 5 lakh daily ridership milestone for first time."],
stories:[
{c:"W",lead:1,title:"Trump, NATO chief agree on accelerated Ukraine weapons delivery",dek:"Trump met with the NATO Secretary General and agreed to fast-track a weapons package for Ukraine including additional Patriot batteries and long-range ATACMS variants funded through frozen Russian sovereign assets.",body:"President Trump met with the NATO Secretary General at the White House and agreed to accelerate a major weapons package for Ukraine. The package includes two additional Patriot air defense batteries, long-range ATACMS missiles, and a new funding mechanism drawing on frozen Russian sovereign assets. Trump said he remains committed to ending the war quickly but would not let Ukraine be steamrolled.",src:"Reuters / Politico"},
{c:"W",title:"Iran-backed militia strikes US base in Syria; no casualties reported",dek:"An Iran-backed militia fired rockets at a US military base in eastern Syria overnight, causing structural damage but no casualties. The US State Department issued a sharp warning of consequences.",body:"An Iran-backed militia group fired a salvo of rockets at a US military forward operating base in eastern Syria, causing structural damage but no casualties. US Central Command attributed the attack to a militia with ties to Iran's IRGC. Secretary of State Rubio warned of disproportionate consequences for any further attacks on US forces in the region.",src:"AP / Axios"},
{c:"T",lead:1,title:"Google DeepMind claims protein structure breakthrough for rare diseases",dek:"DeepMind's updated AlphaFold has successfully predicted the 3D structures of proteins linked to over 200 rare genetic diseases, potentially shaving years off drug development timelines.",body:"Google DeepMind released an updated AlphaFold model that has successfully predicted the 3D structures of proteins linked to over 200 rare genetic diseases. Researchers at the Wellcome Sanger Institute said the breakthrough could shave years off drug development timelines for conditions with no approved treatments. The models are being made freely available to academic researchers.",src:"Nature / DeepMind Blog"},
{c:"T",title:"Microsoft Azure suffers 3-hour global outage; Teams and Outlook affected",dek:"A misconfigured update at a Microsoft Azure data center triggered a cascading failure that took down Teams, Outlook, and several enterprise services globally for nearly three hours.",body:"A misconfigured update at a Microsoft Azure data center triggered a global cascading failure that took down Teams, Outlook, OneDrive, and several enterprise Azure services for nearly three hours. Microsoft said a rollback corrected the issue and pledged a full post-incident review. The outage affected an estimated 600 million users worldwide.",src:"The Verge / Microsoft Status"},
{c:"I",lead:1,title:"India and Russia sign expanded energy cooperation deal in New Delhi",dek:"India and Russia signed an expanded deal covering nuclear power, crude oil supply at preferential rates, and a new green hydrogen partnership targeting 1 million tonnes of annual production by 2030.",body:"India and Russia signed an expanded energy cooperation agreement in New Delhi, covering long-term crude oil supply at preferential rates, joint development of two additional nuclear power units at Kudankulam, and a new green hydrogen partnership targeting 1 million tonnes of annual production by 2030. The deal comes as India fills the energy void created by Middle East tensions.",src:"The Hindu / Business Standard"},
{c:"M",title:"IMD issues heavy rain warning for 12 Maharashtra districts through Tuesday",dek:"An active low-pressure system is bringing sustained heavy rainfall to large parts of Maharashtra, with 12 districts under warning through Tuesday.",body:"IMD issued heavy rain warnings for 12 Maharashtra districts including Pune, Satara, Kolhapur, Raigad, Ratnagiri, Sindhudurg, Nashik, and Ahmednagar through Tuesday. The low-pressure system was expected to linger, raising concerns about landslides in ghat areas and flooding in low-lying urban zones.",src:"IMD / India.com"},
{c:"P",title:"Pune Metro crosses 5 lakh daily ridership milestone for first time",dek:"Pune Metro's combined ridership crossed 5 lakh passengers in a single day for the first time, driven by Ganeshotsav footfall on the Purple and Aqua lines.",body:"Pune Metro recorded 5.02 lakh passengers in a single day, its highest ridership since inauguration. The milestone coincides with Ganeshotsav season, with devotees using the metro to access pandals along the Purple Line corridor. MAHA-METRO announced additional services during peak festival hours.",src:"Punekarnews.in / MAHA-METRO"}
]},

{num:4,label:"Tuesday, September 15, 2026",wknd:false,
sum:["UN General Assembly opens; Zelenskyy addresses member states by live video.","80 nations sign UNGA climate emergency declaration pledging net-zero by 2040.","Meta launches Ray-Ban smart glasses with integrated AI assistant at $499.","PM Modi at UNGA: India calls for permanent UN Security Council seat.","Ganesh Chaturthi 2026 officially begins across Maharashtra."],
stories:[
{c:"W",lead:1,title:"UN General Assembly opens; Zelenskyy delivers powerful video address",dek:"The 81st UN General Assembly session opened in New York with Ukrainian President Zelenskyy calling on member states to never legitimise Russia's territorial aggression and reject any imposed peace.",body:"The 81st session of the UN General Assembly opened in New York. Ukrainian President Zelenskyy delivered a live video address calling on UN member states to never legitimise Russia's territorial aggression and resist pressure for a peace deal that freezes Russian territorial gains. A parallel climate summit produced a declaration signed by 80 nations pledging net-zero by 2040.",src:"UN News / Reuters"},
{c:"W",title:"80 nations sign UNGA climate declaration pledging net-zero by 2040",dek:"An unprecedented climate emergency declaration at UNGA sideline talks was signed by 80 nations, committing to net-zero by 2040 and a phase-out of new coal power within five years.",body:"80 nations signed a climate emergency declaration at UNGA sideline talks, committing to net-zero emissions by 2040 — ten years ahead of the Paris Agreement's primary target. Signatories include the EU, Canada, Japan, and India, though notably not the US, Russia, or China. Critics noted the declaration is non-binding.",src:"The Guardian / AP"},
{c:"T",lead:1,title:"Meta launches Ray-Ban smart glasses with built-in AI assistant",dek:"Meta's new Ray-Ban smart glasses feature a built-in multimodal AI assistant that can identify objects, translate signs in real time, and answer spoken questions about what the wearer sees — all processed locally.",body:"Meta released a new generation of its Ray-Ban smart glasses featuring a built-in multimodal AI assistant. The glasses can identify objects, translate foreign-language signs in real time, and respond to spoken queries about the wearer's surroundings. Meta said the AI processes queries locally rather than in the cloud, addressing privacy concerns. The glasses retail at $499.",src:"The Verge / CNBC"},
{c:"T",title:"Qualcomm announces Snapdragon X2 Elite for next-gen AI PCs",dek:"Qualcomm unveiled the Snapdragon X2 Elite with a 50% AI performance improvement over its predecessor, designed for on-device AI workloads in the next generation of thin-and-light laptops.",body:"Qualcomm announced the Snapdragon X2 Elite processor, promising 50% improvement in AI performance and 30% better CPU throughput over the X1 Elite. The chip is designed for next-generation Copilot+ PCs and is expected to appear in devices from Lenovo, HP, Samsung, and Microsoft in early 2027.",src:"Qualcomm / The Verge"},
{c:"I",lead:1,title:"PM Modi at UNGA: India calls for permanent Security Council reform",dek:"Prime Minister Modi addressed the UN General Assembly, calling for urgent reform to give the Global South permanent representation in the Security Council and calling India's claim a matter of historic justice.",body:"Prime Minister Narendra Modi addressed the 81st UN General Assembly session, calling for an urgent reform of the UN Security Council to include permanent representation for Africa, Latin America, and Asia. Modi argued that a 79-year-old architecture designed for a post-WW2 world cannot address today's challenges and called India's permanent membership claim a matter of historic justice.",src:"PIB / NDTV"},
{c:"M",title:"Ganesh Chaturthi 2026 officially begins across Maharashtra",dek:"Ganesh Chaturthi 2026 officially began with the installation of idols across Maharashtra. Mumbai's Lalbaugcha Raja and Pune's Kasba Ganpati draw the largest crowds.",body:"Ganesh Chaturthi 2026 celebrations officially began across Maharashtra, with idols installed in homes and pandals across the state. In Mumbai, the Lalbaugcha Raja pandal drew over a lakh devotees on the first day. In Pune, the Kasba Ganpati — the city's Manacha Ganpati — reported record-breaking footfall.",src:"Maharashtra Times / Hindustan Times"},
{c:"P",title:"PMC issues Anant Chaturdashi immersion route advisory",dek:"The Pune Municipal Corporation published its immersion route advisory for Anant Chaturdashi, with 42 designated immersion points and artificial ponds to encourage eco-friendly immersion.",body:"The PMC published its detailed immersion route advisory for Anant Chaturdashi — the 10th day when idols are immersed. The PMC designated 42 immersion points on the Mutha and Pavana rivers and asked procession organisers to register their routes. Artificial ponds were set up citywide to encourage eco-friendly immersion.",src:"PMC / Punekarnews.in"}
]},

{num:5,label:"Wednesday, September 16, 2026",wknd:false,
sum:["Trump-Modi bilateral at UNGA finalises landmark Indo-US defence technology transfer deal.","Chinese coast guard shadows Philippine research vessel near the Spratly Islands.","Nvidia unveils H300 GPU architecture for next-gen AI data centres.","India signs defence technology transfer agreement with US; covers jet engines and missiles.","Marathwada faces deepening drought; 150 villages on government water tankers."],
stories:[
{c:"W",lead:1,title:"Trump-Modi bilateral at UNGA finalises Indo-US defence deal",dek:"President Trump and PM Modi met on the UNGA sidelines, finalising a landmark defence technology transfer agreement and expanding cooperation on semiconductor supply chains.",body:"President Trump and Prime Minister Modi held a bilateral meeting on the UNGA sidelines, finalising a landmark agreement on defence technology transfers including jet engine manufacturing and missile guidance systems. The two leaders also agreed to expand semiconductor supply chain cooperation and signed a letter of intent to co-develop a new generation of surveillance satellites.",src:"White House / PIB"},
{c:"W",title:"Chinese coast guard shadows Philippine research vessel near Spratlys",dek:"The Philippine coast guard reported a Chinese coast guard vessel spending 12 hours shadowing and obstructing a Philippine scientific ship legally operating in international waters.",body:"The Philippine coast guard reported that a Chinese coast guard vessel spent 12 hours shadowing and obstructing a Philippine scientific research vessel legally operating in international waters near the Spratly Islands. Manila lodged a formal diplomatic protest. The incident will feature in both the Trump-Xi summit discussions and upcoming ASEAN security talks.",src:"Al Jazeera / Reuters"},
{c:"T",lead:1,title:"Nvidia unveils H300 GPU architecture for next-gen AI data centres",dek:"Nvidia announced the H300 GPU at Hot Chips 2026, promising a 3x improvement in AI training throughput over the H200 and a new memory architecture that eliminates inter-chip bandwidth bottlenecks.",body:"Nvidia unveiled the H300 GPU at Hot Chips 2026, successor to the H200. The company claimed a 3x improvement in large-scale AI training throughput and introduced a new unified memory architecture that drastically reduces inter-chip communication overhead in multi-GPU clusters. The H300 is expected to ship to cloud providers in Q1 2027.",src:"Nvidia / Anandtech"},
{c:"T",title:"Tesla releases Full Self-Driving v14 to North American fleet",dek:"Tesla began rolling out FSD v14 to its entire North American fleet, claiming a 40% reduction in required interventions and unsupervised urban capability in 45 US cities.",body:"Tesla began rolling out FSD v14 to its entire North American fleet — the first version supporting unsupervised urban driving in 45 US cities. The company claims a 40% reduction in driver interventions compared to v13. NHTSA said it is monitoring the rollout closely.",src:"Tesla / Reuters"},
{c:"I",lead:1,title:"India signs landmark defence technology deal with US after Trump-Modi meeting",dek:"India and the US formalised a Defence Technology Transfer Agreement covering GE jet engine co-production, missile guidance systems, and counter-drone technology development.",body:"India and the United States signed a landmark Defence Technology Transfer Agreement following the Trump-Modi bilateral in New York. The deal covers co-production of GE Aerospace jet engines for India's Tejas Mk2 fighter, transfer of missile guidance system technology, and joint development of counter-drone systems. Defence analysts called it the deepest US-India defence cooperation agreement to date.",src:"Ministry of Defence / The Hindu"},
{c:"M",title:"Marathwada drought deepens; 150 villages rely on tanker water supply",dek:"Chhatrapati Sambhajinagar and Beed districts face their worst water crisis in three years, with over 150 villages dependent on government tanker supply.",body:"The Marathwada region of Maharashtra is facing deepening drought conditions. Over 150 villages in Chhatrapati Sambhajinagar and Beed districts are receiving water via government tankers. The state government released Rs 800 crore in emergency drought relief funds and fast-tracked a new inter-district water pipeline project.",src:"Maharashtra Times / Indian Express"},
{c:"P",title:"Ganeshotsav Day 3: 20 lakh devotees; PMC reroutes traffic on 18 roads",dek:"Ganeshotsav Day 3 brought an estimated 20 lakh devotees to Pune's pandals. PMC rerouted traffic on 18 major roads and Pune Metro ran extended midnight services.",body:"Ganeshotsav Day 3 drew an estimated 20 lakh devotees. The Pune Traffic Police rerouted traffic on 18 major roads, implemented vehicle-free zones around the Peth area, and coordinated with Pune Metro for extended midnight services. The Crime Branch arrested two chain-snatching suspects near Kasba Ganpati using CCTV tracking.",src:"Pune Mirror / Punekarnews.in"}
]},

{num:6,label:"Thursday, September 17, 2026",wknd:false,
sum:["Kremlin warns Russia sanctions bill will destroy any remaining ceasefire possibility.","Ukrainian drones strike Kursk oil facility; Russia retaliates with Kharkiv missile salvo.","IFA 2026 Berlin opens with Samsung, Sony, and Xiaomi set for major hardware reveals.","Indian contingent departs for Asian Games 2026 in Aichi-Nagoya, Japan.","IMD upgrades Pune and Satara to orange alert; schools closed in flood-prone areas."],
stories:[
{c:"W",lead:1,title:"Kremlin warns Russia sanctions bill will derail Trump ceasefire push",dek:"The Kremlin warned that the Russia-Iran sanctions bill advancing through US Congress would destroy any remaining possibility of a ceasefire in Ukraine, as Trump faces bipartisan pressure to sign it.",body:"The Kremlin warned that the Russia-Iran sanctions bill advancing through Congress would undermine any ceasefire possibility. Kremlin spokesperson Dmitry Peskov called the bill deeply hostile and said Russia would respond with comprehensive countermeasures. Trump faced bipartisan pressure to sign the bill, which is named for the late Senator Lindsey Graham who died in July.",src:"Reuters / BBC"},
{c:"W",title:"Ukrainian drones strike Kursk oil facility; Russia retaliates on Kharkiv",dek:"Ukrainian long-range drones struck a major oil storage and logistics facility in Kursk Oblast. Russia retaliated hours later with a missile salvo targeting Kharkiv's industrial district.",body:"Ukrainian drones struck a major oil storage and rail logistics facility in Russia's Kursk Oblast, triggering fires that took emergency services over six hours to contain. Russia retaliated hours later with Iskander ballistic missiles targeting Kharkiv's industrial district. Ukraine's air defences intercepted 11 of 14 inbound missiles.",src:"Reuters / Kyiv Independent"},
{c:"T",lead:1,title:"IFA 2026 Berlin opens; Samsung, Sony, Xiaomi confirm major reveals",dek:"IFA 2026 kicked off in Berlin with record exhibitor participation. Samsung's Galaxy XR headset and Xiaomi's mystery passport-shaped foldable are the most anticipated reveals of the show.",body:"IFA 2026 opened in Berlin with record exhibitor participation. Samsung teased its Galaxy XR mixed-reality headset, Sony announced new flagship audio hardware, and Xiaomi showed a glimpse of an unusual passport-shaped foldable device it declined to formally discuss. IKEA also confirmed it would present 21 new smart home gadgets during the show.",src:"The Verge / TechRadar"},
{c:"T",title:"Anthropic releases updated Claude Sonnet with improved code reasoning",dek:"Anthropic released an updated Claude Sonnet with substantially improved code generation, debugging, and complex multi-file codebase reasoning, outperforming rivals on the SWE-bench benchmark.",body:"Anthropic released an updated version of Claude Sonnet featuring substantial improvements in code generation, debugging, and multi-file codebase reasoning. The company cited benchmark scores showing Claude Sonnet outperforming competitors on the SWE-bench software engineering benchmark. The update is available immediately via the Anthropic API and Claude.ai.",src:"Anthropic / The Verge"},
{c:"I",lead:1,title:"Indian contingent departs for Asian Games 2026 in Aichi-Nagoya",dek:"India's 650-strong contingent departed for the 2026 Asian Games, targeting a record medal haul. Medal prospects are strongest in shooting, kabaddi, badminton, boxing, and wrestling.",body:"India's 650-strong contingent for the 2026 Asian Games departed for Aichi-Nagoya, Japan. Chef-de-Mission Radhica Sreeman said India was aiming for a podium finish in the overall medal tally for the first time. Medal prospects are strongest in shooting, kabaddi, badminton, boxing, and wrestling.",src:"PTI / Times of India"},
{c:"M",title:"IMD upgrades Pune, Satara to orange alert; schools shut in low-lying areas",dek:"IMD upgraded Pune and Satara to orange alert as heavy rain continued to lash western Maharashtra. Several low-lying schools were shut as a precaution.",body:"IMD upgraded Pune and Satara to orange alert as rainfall continued to intensify across western Maharashtra. The PMC ordered schools in 11 low-lying areas to remain closed as a precaution. The Mutha and Nira rivers are flowing above their normal seasonal levels.",src:"IMD / Pune Mirror"},
{c:"P",title:"Taljai Hill tunnel proposal formally submitted to PMC for public consultation",dek:"A detailed technical proposal for a tunnel beneath Taljai Hill was submitted to the PMC, targeting a cut in Sinhagad Road-Sahakarnagar commute from 25 minutes to under 5.",body:"A consortium of urban planners and engineers formally submitted a tunnel proposal beneath Taljai Hill to the PMC. The tunnel, estimated to cost Rs 450 crore, would reduce the Sinhagad Road-Sahakarnagar commute from 25 minutes to under 5 minutes. The PMC initiated a 60-day public consultation process.",src:"Punekarnews.in / Pune Pulse"}
]},

{num:7,label:"Friday, September 18, 2026",wknd:false,
sum:["Trump signs Lindsey O. Graham Sanctioning Russia and Iran Act of 2026 into law.","Chinese coast guard vessel deliberately rams Philippines government ship in South China Sea.","IFA 2026: Samsung Galaxy XR headset officially unveiled at $1,499; targets Apple Vision Pro.","Congress confirms F-35 parts were diverted to Hong Kong; formal investigation launched.","India summons Chinese ambassador over South China Sea vessel ramming."],
stories:[
{c:"W",lead:1,title:"Trump signs sweeping Russia-Iran sanctions into law",dek:"Trump signed the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026, the most expansive US sanctions package targeting Russia and Iran since the start of the Ukraine war.",body:"President Trump signed the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026 into law, the most expansive US sanctions targeting Russia and Iran since the start of the Ukraine conflict. The package was named in honour of the late South Carolina senator who died in July 2026. The Kremlin called the sanctions an act of economic warfare that would complicate Trump's peace efforts.",src:"Reuters / WSJ"},
{c:"W",title:"Chinese coast guard vessel deliberately rams Philippines government ship",dek:"A Chinese coast guard vessel deliberately rammed a Philippine government ship in the South China Sea, injuring four crew members in what Manila called an unprecedented act of aggression.",body:"A Chinese coast guard vessel deliberately rammed a Philippine government research and patrol vessel in contested waters of the South China Sea, injuring four Filipino crew members. The Philippines called it an unprecedented act of aggression and filed an emergency diplomatic protest in Beijing. India summoned the Chinese ambassador to register its concern.",src:"Al Jazeera / AP"},
{c:"T",lead:1,title:"IFA 2026: Samsung Galaxy XR headset unveiled at $1,499",dek:"Samsung officially unveiled the Galaxy XR mixed-reality headset at IFA Berlin, priced at $1,499 — directly targeting Apple Vision Pro at less than half the price.",body:"Samsung officially unveiled the Galaxy XR mixed-reality headset at IFA 2026 in Berlin. Priced at $1,499, the device runs Google's Android XR platform, supports full passthrough video, and includes dedicated eye-tracking. Samsung positioned it explicitly as a lower-cost alternative to Apple's Vision Pro, which starts at $3,499.",src:"The Verge / Samsung Newsroom"},
{c:"T",title:"Congress opens investigation into F-35 parts diverted to Hong Kong",dek:"US Congressional investigators confirmed F-35 stealth fighter components were routed through Hong Kong, potentially exposing sensitive defence manufacturing technology to Chinese intelligence services.",body:"US Congressional investigators opened a formal inquiry after it was confirmed that F-35 fifth-generation stealth fighter components had been routed through Hong Kong, potentially exposing sensitive manufacturing specifications to Chinese intelligence. The Pentagon acknowledged the breach and initiated its own internal review.",src:"Politico / Reuters"},
{c:"I",lead:1,title:"India summons Chinese ambassador over South China Sea vessel ramming",dek:"India summoned the Chinese ambassador to formally register concern over the deliberate ramming of a Philippine government vessel by a Chinese coast guard ship.",body:"India summoned the Chinese ambassador to the Ministry of External Affairs to formally register India's concern about the ramming of a Philippine government vessel in the South China Sea. India stated it strongly believes in freedom of navigation and overflight in international waters, signalling India's increasingly assertive posture on South China Sea security.",src:"MEA / The Hindu"},
{c:"M",title:"Rail block on Hadapsar-Ghorpadi line September 19-21 for new third track",dek:"Indian Railways has issued a service disruption notice for the Hadapsar-Ghorpadi section from September 19-21 to install components for the new third railway line.",body:"Indian Railways issued a service advisory warning of disrupted train services on the Hadapsar-Ghorpadi section from September 19 to 21. The block is required to install components for a new third line that will increase capacity on one of Pune's busiest suburban rail corridors.",src:"Pune Pulse / Indian Railways"},
{c:"P",title:"PMC issues 200 encroachment notices around major Ganeshotsav pandals",dek:"The Pune Municipal Corporation issued 200 notices to businesses and vendors encroaching on footpaths and roads around major Ganeshotsav pandals, following complaints about blocked emergency access.",body:"The PMC's encroachment department issued 200 notices to commercial establishments, food stalls, and vendors around major Ganeshotsav pandals. The action followed complaints about blocked emergency access routes and sewage overflow from unlicensed food stalls. PMC seized 68 tonnes of encroaching material in enforcement drives.",src:"Punekarnews.in / PMC"}
]},

{num:8,label:"Saturday, September 19, 2026",wknd:true,
sum:["Trump bans CNN, MS-NOW, and Politico from White House press briefings.","Asian Games 2026 officially opens in Aichi-Nagoya; India's flagbearer is Lakshya Sen.","IFA 2026 wraps: Xiaomi's undiscussed foldable and Samsung Galaxy XR lead headlines.","Houthis claim Red Sea drone strike; Saudi Arabia tension escalates along Jizan border.","Pune Metro Ganeshotsav special services begin — trains every 5 minutes on Purple Line."],
stories:[
{c:"W",lead:1,title:"Trump bans CNN, MS-NOW, and Politico from White House press briefings",dek:"President Trump announced that CNN, MS-NOW, and Politico would be permanently barred from White House press briefings, citing irredeemable bias. The White House Correspondents' Association condemned it as unconstitutional.",body:"President Trump announced that CNN, MS-NOW (formerly MSNBC), and Politico would be permanently barred from White House press briefings, citing irredeemable bias and deliberate misinformation. The White House Correspondents' Association immediately condemned the move as unconstitutional. Legal experts said the ban would likely face court challenges.",src:"Axios / AP"},
{c:"W",title:"Asian Games 2026 opens in Aichi-Nagoya with spectacular ceremony",dek:"The 2026 Asian Games officially opened in Aichi-Nagoya, Japan, with 45 nations participating across 40 sports. India's flagbearer was badminton champion Lakshya Sen.",body:"The 2026 Asian Games officially opened in Aichi-Nagoya with a spectacular opening ceremony. Forty-five nations are competing across 40 sports. India's flagbearer was badminton star Lakshya Sen. The Games run from September 19 to October 4, with India targeting a record medal haul.",src:"Olympics.com / PTI"},
{c:"T",lead:1,title:"IFA 2026 wraps: Xiaomi's mystery foldable outshines everything officially announced",dek:"As IFA 2026 closed, tech buzz centred not on Samsung's Galaxy XR but on the one product Xiaomi refused to officially announce — a passport-shaped foldable left on display without a single word.",body:"As IFA 2026 concluded in Berlin, industry buzz centred not on Samsung's formally announced Galaxy XR but on Xiaomi's mysterious passport-shaped foldable phone placed on display without a single official word. Xiaomi's VP called it a concept exploration when pressed. IKEA debuted 21 smart home gadgets. BGR gave Samsung the Best of IFA award.",src:"BGR / TechRadar"},
{c:"T",title:"Houthis claim Red Sea drone strike; push to expand Saudi border territory",dek:"Yemen's Houthis claimed a drone strike on a Red Sea oil tanker and pushed to consolidate gains in Saudi Arabia's southern Jizan province, drawing a military response from Riyadh.",body:"Yemen's Houthi movement claimed responsibility for a drone strike on an oil tanker in the Red Sea shipping lane. Separately, Houthi forces pushed to consolidate gains in Saudi Arabia's southern Jizan province, with Riyadh deploying additional military units to the border region.",src:"Reuters / Al Jazeera"},
{c:"I",lead:1,title:"Asian Games Day 1: India wins bronze in weightlifting; kabaddi teams arrive",dek:"India opened its 2026 Asian Games campaign with a bronze medal in weightlifting courtesy of Mirabai Chanu. The kabaddi teams completed their first training session in Aichi.",body:"India opened its 2026 Asian Games campaign with Mirabai Chanu winning bronze in the 49kg weightlifting event. The shooting team competed in the 10m air pistol mixed team event. The kabaddi teams arrived in Aichi-Nagoya and held their first full training session.",src:"PTI / Olympics.com"},
{c:"M",title:"Ganeshotsav draws to close; PMC launches pre-emptive citywide cleanup",dek:"As Ganeshotsav 2026 approached its final days, the PMC deployed 4,000 sanitation workers to pandal sites, immersion routes, and temporary food stall zones for pre-emptive cleanup.",body:"As Ganeshotsav 2026 approached its final days, the PMC launched a pre-emptive citywide cleanup operation deploying 4,000 sanitation workers to pandal sites, temporary food stalls, and along immersion routes. The civic body also began testing water quality at Mutha River immersion sites.",src:"PMC / Pune Mirror"},
{c:"P",title:"Pune Metro Ganeshotsav special services: trains every 5 minutes",dek:"Pune Metro launched Ganeshotsav special services with trains running every 5 minutes during peak hours on the Purple Line. The first day of special services set a new single-day ridership record of 6.3 lakh.",body:"Pune Metro launched Ganeshotsav special services with trains running every 5 minutes during peak hours on the Purple Line corridor. The enhanced service will run until the festival concludes. On the first day of special services, the metro carried 6.3 lakh passengers — a new single-day record.",src:"Punekarnews.in / MAHA-METRO"}
]},

{num:9,label:"Sunday, September 20, 2026",wknd:true,
sum:["Ukraine launches largest-ever combined drone and missile strike on Moscow; 3 killed.","AfD crushes CDU in Mecklenburg-West Pomerania; Merz calls state election result a disaster.","Trump announces AI Force branch and AI czar; says whoever wins AI wins.","Macron and Canada's Carney pledge closer ties at Saint Pierre summit amid US tensions.","IMD issues yellow alert across western Maharashtra as Bay of Bengal system intensifies."],
stories:[
{c:"W",lead:1,title:"Ukraine launches largest-ever drone and missile strike on Moscow",dek:"Ukraine struck Moscow with its biggest-ever combined drone and missile barrage on the final day of Russia's parliamentary elections, killing 3 people and targeting key oil infrastructure.",body:"Ukraine launched its largest-ever drone and missile attack on Moscow on Sunday, killing at least three people. The attack coincided with the final day of Russia's parliamentary election. Zelenskyy said key oil industry facilities and logistics infrastructure were targeted, calling the strikes billions of dollars taken from the war machine. The attack came two days after Trump signed the Lindsey Graham Russia-Iran sanctions act.",src:"Reuters / AP"},
{c:"W",title:"AfD wins Mecklenburg-West Pomerania; Merz vows to stay despite 'disaster'",dek:"The far-right AfD won its second major state election in a month. Chancellor Merz's CDU suffered its worst state result since World War II. Merz called the result 'a disaster' but pledged to remain Chancellor.",body:"The far-right Alternative for Germany party won the Mecklenburg-West Pomerania state election in northern Germany, its second major state victory in a month. Chancellor Merz's CDU suffered its worst state result since World War II. In Berlin, his party also lost to the far-left Die Linke. Merz said it is a disaster but pledged to remain Chancellor.",src:"BBC / Reuters"},
{c:"T",lead:1,title:"Trump announces AI Force branch; says 'Whoever wins AI, wins'",dek:"Trump announced a new AI Force and an AI czar appointment, doubling down on American AI dominance despite warnings from Jensen Huang and other industry leaders about existential risk.",body:"Trump announced he would form an AI Force and appoint a czar to lead the technology's rapid development. Amid warnings from industry leaders including Nvidia's Jensen Huang that the continued pace of AI development could result in human extinction, Trump said Whoever wins AI, wins. The announcement escalates the US-China AI race ahead of the Trump-Xi summit this week.",src:"WSJ / CBS News"},
{c:"T",title:"Nvidia CEO Jensen Huang addresses AI extinction risk fears in CBS interview",dek:"In a wide-ranging CBS interview, Nvidia's Jensen Huang acknowledged the existential risk debate but argued humanity should steer the technology, not stop it, and called for international governance frameworks.",body:"Nvidia CEO Jensen Huang sat down with CBS News to address mounting public fears about AI and existential risk. Huang acknowledged that the speed of AI development is genuinely unprecedented but argued that stopping development would cede ground to authoritarian states that would use AI as a tool of control. He called for international governance frameworks rather than a development moratorium.",src:"CBS News / Reuters"},
{c:"I",lead:1,title:"Asian Games Day 2: Elavenil Valarivan wins silver in 10m air rifle",dek:"India's shooters delivered on Day 2 at the Asian Games 2026. Elavenil Valarivan claimed silver in the women's 10m air rifle, opening India's shooting medal account.",body:"India's Elavenil Valarivan won a silver medal in the women's 10m air rifle event at the 2026 Asian Games in Aichi-Nagoya, opening India's shooting medal account. Parth Mane finished fourth in the men's event. India's women's hockey team hammered Uzbekistan 19-0 in their first group match.",src:"PTI / Olympics.com"},
{c:"M",title:"IMD issues yellow alert for Pune, western Maharashtra; Bay system intensifies",dek:"IMD issued yellow alerts across western Maharashtra as a Bay of Bengal low-pressure system intensifies into a deep depression, forecasting heavy to extremely heavy rainfall from Monday.",body:"IMD issued yellow alerts for Pune, Satara, Kolhapur, Sangli, and Solapur districts as a low-pressure system in the Bay of Bengal intensifies into a deep depression. Heavy to extremely heavy rainfall is forecast for Monday and Tuesday. Fishermen were advised not to venture into sea on September 21 and 22.",src:"IMD / India.com"},
{c:"P",title:"Pune-Beed Express announced; first direct overnight service launches September 22",dek:"Indian Railways announced the first direct daily Pune-Beed Express, covering 326 km overnight and connecting Pune with Beed in Marathwada — a route historically underserved by direct rail.",body:"Indian Railways announced the first direct daily Pune-Beed Express, launching September 22. The overnight service covers 326 km between Pune and Beed, serving the Marathwada region that has historically lacked direct rail links to western Maharashtra. The train departs Pune at 10:30 PM and arrives Beed at 6:00 AM.",src:"Pune Pulse / Indian Railways"}
]},

{num:10,label:"Monday, September 21, 2026",wknd:false,
sum:["Ukraine's largest-ever drone/missile strike hits Moscow on Russia's election day.","Trump meets Xi Jinping in Washington Wednesday; Iran vows retaliation as UNGA opens.","Germany's AfD wins again; Merz calls it a disaster but vows to stay as Chancellor.","Trump creates AI Force and appoints an AI czar, saying whoever wins AI wins.","IFA 2026 wraps — Samsung Galaxy XR and Xiaomi mystery foldable led the week.","F-35 parts diverted to Hong Kong; Congress launches national security investigation.","Asian Games Day 3: kabaddi title defence begins; India chases more shooting medals.","Biometric Aadhaar authentication mandatory for LPG subsidies from October 1.","IMD heavy rain alert for Pune, Kolhapur, Satara, Sangli today — carry an umbrella.","Pune Metro every 5 minutes during Ganeshotsav; Pune-Beed Express launches tomorrow."],
stories:[
{c:"W",lead:1,title:"Ukraine launches largest-ever drone strike on Moscow",dek:"Ukraine hit Moscow with its biggest-ever combined drone and missile barrage on Sunday, killing at least 3 people on the final day of Russia's parliamentary elections.",body:"Ukraine launched its largest-ever drone and missile attack on Moscow on Sunday, killing at least three people. The attacks coincided with the final day of Russia's parliamentary election. Zelenskyy said key oil industry facilities and logistics infrastructure were hit. The strikes come two days after Trump signed the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026. The Kremlin said the law would hamper Trump's efforts to end the four-year-long war.",src:"Reuters / ABC News"},
{c:"W",title:"Trump meets Xi Jinping Wednesday; Iran vows retaliation as UNGA opens",dek:"Xi Jinping arrives in Washington Wednesday for two days of talks. Iran vowed painful retaliation as Trump escalates pressure ahead of his UNGA address Tuesday.",body:"Trump will welcome Chinese President Xi Jinping in Washington on Wednesday for two days of high-stakes talks. Treasury Secretary Bessent has already met with his Chinese counterpart. Iran vowed painful retaliation ahead of Trump's UNGA address Tuesday. US embassies across the Middle East issued security alerts. Average US gas price hit $4.47.",src:"CBS News / CNBC"},
{c:"W",title:"ICE officer shoots Venezuelan food-delivery worker in Austin",dek:"An ICE officer shot and wounded a Venezuelan man making a DoorDash delivery in North Austin. His lawyer says he had no criminal record. Trump's approval sits at 41%.",body:"An ICE officer shot and wounded a Venezuelan man in North Austin, Texas. His attorney said he was making a DoorDash delivery and had no criminal record. The incident sparked protests. Trump's approval sits at 41% per NBC News polling, with Democrats holding a five-point lead on the generic congressional ballot.",src:"AP / NBC News"},
{c:"T",lead:1,title:"Trump creates 'AI Force', says 'Whoever wins AI, wins'",dek:"Trump announced a new AI Force and will appoint an AI czar, doubling down on American AI dominance despite industry warnings of existential risk from unchecked development.",body:"Trump announced he would form an AI Force and appoint a czar to lead its rapid development. Amid warnings from industry leaders that AI development could result in human extinction, Trump said Whoever wins AI, wins. Nvidia CEO Jensen Huang sat for a CBS interview to address fears. The announcement escalates the US-China AI race ahead of the Trump-Xi summit this week.",src:"WSJ / CBS News"},
{c:"T",title:"F-35 parts diverted to Hong Kong — Congress launches investigation",dek:"Congressional investigators launched a national security inquiry after F-35 components were routed through Hong Kong, potentially exposing sensitive US defence technology to Chinese intelligence.",body:"The US Congress launched an investigation after F-35 aircraft components were discovered diverted to Hong Kong, raising serious national security concerns about Chinese access to sensitive American defence technology. The investigation comes as Trump prepares to host Xi Jinping this week for bilateral talks.",src:"Politico"},
{c:"I",lead:1,title:"Asian Games Day 3: kabaddi title defence begins; shooters chase more medals",dek:"India's men's and women's kabaddi teams open their title defence against Japan and Bangladesh today. Parth Mane, Himanshu Dhillon, and Rudranksh Patil compete in men's 10m air rifle.",body:"India's men's kabaddi team faces Japan and the women face Bangladesh in opening Asian Games 2026 group matches today. Parth Mane, Himanshu Dhillon, and Rudranksh Patil compete in men's 10m air rifle. India's women's hockey team faces Indonesia. Suchika Tariyal is through to the MMA semi-final.",src:"Olympics.com / PTI"},
{c:"I",title:"Biometric Aadhaar authentication mandatory for LPG subsidies from Oct 1",dek:"The Ministry of Petroleum mandates biometric Aadhaar auth for domestic LPG consumers who want subsidised refills. The requirement takes effect October 1, 2026.",body:"The Ministry of Petroleum and Natural Gas mandated biometric Aadhaar authentication for domestic LPG consumers wanting subsidised cylinder refills. The requirement comes into effect October 1, 2026. Consumers without completed biometric authentication will not be eligible for the subsidised rate.",src:"Ministry of Petroleum"},
{c:"M",lead:1,title:"Heavy to extremely heavy rain forecast for Pune, Satara, Kolhapur today",dek:"IMD has issued a yellow alert for western Maharashtra. Pune, Kolhapur, Satara, Sangli and Solapur expect heavy to extremely heavy rainfall today.",body:"IMD forecast heavy to extremely heavy rainfall in Pune, Kolhapur, Satara, Sangli and Solapur in western Maharashtra today. A Bay of Bengal weather system intensifying into a deep depression is driving wider rainfall across the state. Mumbai expects light rain. Fishermen advised not to venture to sea September 21-22.",src:"India.com / IMD"},
{c:"P",lead:1,title:"Pune Metro every 5 minutes during Ganeshotsav peak hours",dek:"Pune Metro announced trains every 5 minutes during peak hours for Ganeshotsav, managing the massive festival footfall across the city.",body:"Pune Metro announced enhanced Ganeshotsav 2026 services with trains running every 5 minutes during peak hours on the Purple Line. The system carried a record 6.3 lakh passengers on Saturday — its highest single-day ridership since inauguration.",src:"Punekarnews.in / MAHA-METRO"},
{c:"P",title:"Pune-Beed Express launches tomorrow — 326 km overnight route",dek:"The first direct daily Pune-Beed Express starts September 22, covering 326 km overnight and linking Marathwada with western Maharashtra for the first time by direct rail.",body:"The first direct daily Pune-Beed Express launches tomorrow, September 22. The overnight journey covers 326 km connecting Pune with Beed in Marathwada. Departs Pune 10:30 PM, arrives Beed 6:00 AM. The PMC also continues its crackdown on unauthorized vendors — 519 illegal gas cylinders seized in seven months.",src:"Pune Pulse / Indian Railways"}
]},

{num:11,label:"Tuesday, September 22, 2026",wknd:false,
sum:["India's women cricketers win the country's first gold of the Asian Games, crushing Sri Lanka by 147 runs.","Saudi airstrikes on Yemen's Mokha port kill at least 6 as Houthis push to cut off the Red Sea coast.","Bessent says Iranian airlines will shut down worldwide by tomorrow under secondary sanctions.","Russian strikes kill at least 9 in Ukraine; Guterres alarmed at record civilian casualties in Kyiv.","Xi Jinping's state visit to Washington begins this week — trade, Taiwan and AI top the agenda.","Google fined 403 million euros over location data privacy violations.","British Columbia sues OpenAI over a shooter's use of ChatGPT.","Fadnavis promises record MPSC recruitment — more posts than ever before.","Ganesh Visarjan traffic diversions across Pune from 3 PM to 2 AM; 799 extra buses running.","Heavy pre-dawn rain hits north Pune and PCMC; light showers expected for two to three days."],
stories:[
{c:"W",lead:1,title:"Saudi airstrikes on Yemen's Mokha port kill at least 6 as Houthis advance",dek:"Saudi strikes hit the Red Sea port of Mokha as Houthi forces moved to cut off coastal areas. The UK announced limited RAF refuelling support for Saudi operations.",body:"Saudi airstrikes on Yemen's Mokha port killed at least six people and injured eight, according to the Houthi-affiliated Saba news agency. Houthi forces have advanced militarily to cut off Red Sea coastal areas, and the Saudi-backed government sought US support without receiving direct pledges. UK Prime Minister Burnham announced limited RAF air-to-air refuelling for Saudi operations against the Houthis. A G7 statement called on Iran to cease supporting the group.",src:"Anadolu / Just Security"},
{c:"W",title:"Bessent: Iranian airlines to shut down worldwide by tomorrow",dek:"US Treasury Secretary Scott Bessent said secondary sanctions will ground Iranian carriers globally by September 23. Iran's Revolutionary Guard warned it would change the geography of the war.",body:"US Treasury Secretary Scott Bessent announced that Iranian airlines will shut down around the world by September 23 through secondary sanctions. Iran's Islamic Revolutionary Guard Corps responded with a warning of an escalatory response, with a spokesman saying Iran would change the geography of the war if the US escalated further. The Trump administration separately proposed a 5 billion dollar fund for rebuilding Middle Eastern energy infrastructure, seeking matching contributions.",src:"Anadolu / Just Security"},
{c:"W",title:"Russian strikes kill at least 9 in Ukraine; UN alarmed at Kyiv casualties",dek:"Multiple Russian strikes hit Ukraine's industrial and northern regions. UN Secretary-General Guterres said daily attacks on Kyiv are causing record civilian casualties.",body:"Multiple Russian strikes killed at least nine people across Ukraine's industrial regions and northern areas. UN Secretary-General Guterres expressed alarm over escalating daily attacks on Kyiv causing record civilian casualties. Zelenskyy indicated he is ready to halt strikes if Russia stops targeting energy and food exports. Macron discussed an energy-sector attack moratorium with Trump. CIA chief Ratcliffe and Zelenskyy met informally in Ireland, with details undisclosed. Latvia opposed selective EU sanctions relief on Russian billionaires.",src:"Just Security / Anadolu"},
{c:"W",title:"Xi Jinping's Washington state visit begins this week",dek:"Xi arrives in Washington for a state visit focused on trade, Taiwan and AI. Beijing is expected to press Trump hard on Taiwan arms sales.",body:"Chinese President Xi Jinping confirmed his state visit to the United States this week, with analysts expecting trade, Taiwan and artificial intelligence to dominate the agenda. Xi is expected to pressure Trump on Taiwan arms sales. Separately, the US is opening two military bases in Greenland under an agreement signed today, and Poland may host up to 15,000 US troops at a permanent base. The US and Italy signed a critical minerals agreement in New York.",src:"Atlantic Council / Anadolu"},
{c:"W",title:"Gaza children return to school for the first time in nearly three years",dek:"Hundreds of thousands of Gazan children returned to in-person classes, though 98% of the territory's schools remain damaged or destroyed.",body:"Hundreds of thousands of children in Gaza returned to in-person school for the first time in nearly three years. An estimated 98% of Gaza's schools remain damaged or destroyed, meaning most classes are being held in partially repaired buildings, tents and improvised spaces.",src:"Just Security"},
