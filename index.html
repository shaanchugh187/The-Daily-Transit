stories:[
{c:"W",k:"Geopolitics",lead:1,big:1,title:"US completes full military withdrawal from Iraq",dek:"The pullout, agreed between Washington and Baghdad, closes a chapter that began with the 2003 invasion. Iran and its allies welcomed it; Italy has also finished withdrawing.",body:"The US military has completed the withdrawal of all its forces from Iraq under an agreement between the two governments. American troops invaded in 2003, left in 2011, and returned in 2014 to fight ISIS. Iran and allied groups celebrated the exit, and Italy's Defence Ministry said Italian troops have also completed their withdrawal. The move comes as the wider US-Israeli conflict with Iran continues.",why:"The US no longer has troops on Iran's western border in the middle of a war. Iran's allies will present the exit as a victory.",next:"Qatar's shuttle diplomacy between Iran and the US, which has stalled.",src:"Democracy Now / Just Security"},
{c:"W",k:"Geopolitics",title:"Iran's rial hits record low as Qatar-brokered talks stall",dek:"The currency fell to 2.5 million per dollar. Qatari mediators met both sides in New York but neither is moving.",body:"Iran's rial dropped to a record 2.5 million to the US dollar as the war batters the economy. Qatari mediator Ali al-Thawadi held separate meetings in New York with Iranian Foreign Minister Abbas Araghchi and US envoy Jared Kushner; Axios reports Qatari officials are frustrated that neither side will budge. Washington also sanctioned 10 entities in China, Hong Kong and Pakistan over alleged weapons transfers to Iran, and Pakistan said it would defend Saudi Arabia against the Houthis by whatever means are available.",src:"Just Security / Democracy Now"},
{c:"W",k:"World",title:"Settlers attack West Bank village of Jalud; Hamas commander killed in Gaza",dek:"More than 100 settlers blocked a family's court-ordered return home. Netanyahu condemned the violence and called for prosecutions.",body:"Over 100 Israeli settlers attacked the Palestinian village of Jalud, setting homes on fire and preventing the Tubasi family from returning after Israel's High Court ordered their reinstatement. Netanyahu condemned the attack. In Washington, the Senate voted 47-51 against a measure requiring reports on West Bank violence affecting US citizens. In Gaza, an Israeli airstrike killed senior Hamas commander Izz al-Din al-Beik in Gaza City.",src:"Just Security / Democracy Now"},
{c:"W",k:"World",title:"Russian strikes kill five in Ukraine; Belgium to send three F-16s",dek:"Attacks again targeted Kyiv's energy infrastructure, with a child among the dead. Belgium will hand over the jets by year-end.",body:"President Zelenskyy said Russian strikes on energy infrastructure, including in Kyiv, killed five people across Ukraine, one of them a child. Russian glide bombs killed two more in Sumy. Zelenskyy also announced that Belgium will transfer three F-16 fighter jets to Ukraine before the end of the year.",src:"Just Security / Reuters"},
{c:"W",k:"Politics",title:"Morocco names its first woman prime minister",dek:"King Mohammed VI appointed Fatima Ezzahra El Mansouri, who called the choice historic. In the UK, PM Burnham opened the door to rejoining the EU someday.",body:"King Mohammed VI appointed Fatima Ezzahra El Mansouri as Morocco's prime minister, the first woman to hold the post. Separately, UK Prime Minister Andy Burnham told Politico that rejoining the EU could be considered and that Brexit did more harm than good, though he ruled out seeking single market or customs union membership before the next election.",src:"Just Security / New York Times"},
{c:"B",k:"Markets",lead:1,big:3,one:1,title:"Oil back above $100 as the Hormuz stalemate drags on",dek:"Brent was at $102.56 yesterday, after topping $107 when Trump rejected Iran's reopening plan. Indian stocks opened flat.",body:"Brent crude traded at $102.56 a barrel on Wednesday morning (US time), up 2.4% on the day and about 54% higher than a year ago. It jumped past $107 on Monday after Trump rejected Iran's proposal to reopen the Strait of Hormuz. In Mumbai, the Sensex opened 88 points lower at 72,441 and the Nifty near 22,665, with TCS leading gainers and smaller stocks outperforming.",why:"India buys most of its oil abroad. Sustained $100 oil means higher fuel prices, a bigger import bill and more pressure on the rupee and inflation.",next:"The RBI's rate decision on October 7, and any movement in US-Iran talks.",src:"Fortune / Al Jazeera / India TV News"},
{c:"B",k:"Business",title:"Leaked Anthropic prospectus shows fast growth and heavy losses",dek:"The filing reportedly shows $4.6 billion in 2025 revenue, an operating loss above $8 billion, and $11.5 billion in revenue in Q2 2026 alone.",body:"A leaked draft of Anthropic's IPO prospectus, reported by Reuters and Fortune, shows 2025 revenue of $4.6 billion against an operating loss of more than $8 billion. Revenue reached $11.5 billion in Q2 2026, and the company says it was operationally profitable for two straight quarters. It plans $518 billion in cloud and data centre spending, and about a quarter of revenue comes from two customers. OpenAI is reportedly raising at least $30 billion at a valuation near $1.4 trillion.",why:"It is the first detailed look at the finances of a frontier AI lab heading for a public listing, and how much the AI buildout costs.",src:"Fortune / The Neuron"},
{c:"T",k:"AI",lead:1,big:2,title:"Trump and AI chiefs sign voluntary super intelligence safety accord",dek:"Leaders from OpenAI, Anthropic, Google, Meta, Nvidia, Microsoft and others agreed to layered audits. Trump called it morally binding, not legally binding.",body:"At the White House, President Trump and executives including Elon Musk, Mark Zuckerberg, Dario Amodei, Jensen Huang, Greg Brockman and Sundar Pichai signed a voluntary accord on what Trump now calls super intelligence. The companies committed to four layers of controls and audits, including internal evaluations, outside audits and board reviews, and to meet regularly to set safety standards. Trump likened it to a constitution and signed an order telling agencies to use the term super intelligence instead of artificial intelligence. Senator Mark Warner said voluntary standards are not enough.",why:"Almost every major AI lab is now on record with the same safety commitments, but nothing in the accord can be enforced.",next:"Whether the controls are written into law, and an FTC probe into AI companies' safety claims.",src:"CBS News / Axios"},
{c:"T",k:"Space",title:"SpaceX Crew-13 set to launch to the ISS tonight",dek:"Liftoff is planned for 8:40 PM IST from Cape Canaveral. Forecasters give 60% odds of good weather; Friday is the backup.",body:"NASA's Jessica Watkins and Luke Delaney, Canada's Joshua Kutryk and Russia's Sergey Teteryatnikov are scheduled to launch aboard a Falcon 9 and the Crew Dragon Grace at 11:10 AM EDT (8:40 PM IST) for a six-month stay on the International Space Station. Docking is expected about eight hours after liftoff. Weather is 60% favourable; if the launch is scrubbed, the next attempt is Friday.",src:"Space.com"},
{c:"T",k:"Consumer Tech",title:"Apple's next launch is October 13: a smart home hub and new Apple TV",dek:"Bloomberg reports a square-screen home hub running homeOS, a HomePod mini 2 and a fourth-generation Apple TV 4K, all built around Siri AI.",body:"Apple will launch new products on October 13, according to Bloomberg's Mark Gurman. Expected are an all-new smart home hub with a 6 to 7 inch square display running a new homeOS, available as a tabletop or wall-mounted unit; a HomePod mini 2 with Wi-Fi 7 and new colours; and an Apple TV 4K with an A19-class chip and more memory for Apple Intelligence. It is unclear whether Apple will hold a full event or use press releases.",src:"MacRumors / Bloomberg"},
{c:"I",k:"Personal Finance",lead:1,big:5,title:"New rules from today: LPG biometric check, child Aadhaar fee, bulk FD limit",dek:"Unverified LPG customers lose the subsidy. Updating a child's Aadhaar biometrics now costs Rs 125.",body:"Biometric Aadhaar authentication is now mandatory to get subsidised LPG; about 89.9% of active customers had completed it by mid-September. Free biometric updates for children ended yesterday, and a Rs 125 fee applies from today. Fixed deposits of Rs 3 crore or more now count as bulk deposits, up from Rs 2 crore. Registering births or deaths late now needs magistrate approval, and buyers of property from NRIs no longer need a separate TAN for TDS.",why:"If your LPG connection isn't biometrically verified, your next refill is at market price.",next:"UPI merchant charge changes on October 15.",src:"India TV News"},
{c:"I",k:"Climate",title:"Monsoon ends at 87% of normal, fourth-weakest since 2001",dek:"June was the weakest month at 65%. IMD expects below-normal rain across most of India in October.",body:"India received 759.4 mm of rain in the June-September monsoon, 87% of the long-period average and the fourth-lowest since 2001. Seventeen of 36 subdivisions were deficient and only Odisha saw excess rain. June came in at 65% of normal, July 101%, August 84% and September 92%. IMD forecasts below-normal rainfall and above-normal temperatures for most of the country in October.",src:"The Bridge Chronicle"},
{c:"L",k:"Health",lead:1,big:4,title:"Congo's Ebola outbreak passes 8,000 cases",dek:"Nearly 3,900 people have died. The Bundibugyo strain has no approved vaccine or treatment, and WHO says the outbreak is far from over.",body:"The Democratic Republic of Congo has recorded 8,067 confirmed Ebola cases and 3,901 deaths, its worst outbreak ever. The hotspot is Butembo in North Kivu, with cases also in Ituri and Tshopo. The Bundibugyo strain has no approved vaccine or treatment; experimental options are being trialled, but Tshopo has run out of experimental vaccine. Community mistrust is hampering the response. The US has committed $267 million toward a $2 billion global target.",why:"WHO warns it could surpass the 2014-16 West Africa epidemic, which killed more than 11,000 people.",next:"Whether the $2 billion funding target is met and experimental vaccine supplies reach Tshopo.",src:"Al Jazeera"},
{c:"M",k:"Maharashtra",lead:1,title:"Aadhaar verification now mandatory for property registration in Maharashtra",dek:"Revenue Minister Bawankule said 63 categories of documents, including sales and mortgages, will not be registered without it.",body:"From today, parties to 63 categories of property documents in Maharashtra, including sale deeds, mortgages and partition deeds, must complete Aadhaar-based identity verification before registration. Revenue Minister Chandrashekhar Bawankule said the aim is to curb impersonation, fake identities and fictitious witnesses. People without Aadhaar can submit their enrolment receipt plus another government ID.",why:"Anyone buying, selling or mortgaging property needs every party's Aadhaar verification done before visiting the registrar.",src:"Punekar News"},
{c:"M",k:"Maharashtra",title:"Fadnavis: drought aid even where talukas miss the technical criteria",dek:"265 of the state's 358 talukas are already drought-declared. Inspections will now be done at the revenue-circle level.",body:"Chief Minister Devendra Fadnavis said farmers who suffered real crop losses will not be denied relief because of technicalities. About 20 talukas failed to qualify under the Trigger-1 criteria because heavy rain in some revenue circles skewed taluka averages, so the cabinet moved inspections down to the revenue-circle level. The state also has a Rs 496 crore fodder development policy for livestock.",src:"Deccan Chronicle"},
{c:"P",k:"Pune",lead:1,title:"Pune's monsoon ends at 736.2 mm; 10% phased water cut ordered",dek:"More than half the season's rain fell in a single July week. Dams are nearly 95% full, but Khadakwasla trails last year.",body:"Pune's Shivajinagar observatory recorded 736.2 mm of rain between June 1 and September 30, with about 53% falling between July 3 and 9. The four main dams hold 29.62 TMC, or 94.76% of capacity, though Khadakwasla is notably lower than last year. The state has directed a phased 10% water cut across urban and rural areas so supplies last until August 2027. Expect clear skies with brief drizzle today and a high near 28°C.",why:"The dams look full, but the state wants water to last 10 more months through a dry October, so the cut is coming anyway.",src:"The Bridge Chronicle / LatestLY"},
{c:"P",k:"Pune",title:"HCMT elevated road work to begin on two stretches in November",dek:"Sinhagad Road–Lullanagar and Viman Nagar–Bombay Sappers go first on the 43-km, Rs 3,722 crore corridor.",body:"PMC will start construction in November on two stretches of the long-delayed High Capacity Mass Transit route: about 10 km from Sinhagad Road to Lullanagar via Sarasbaug and Satara Road, and about 12 km from Viman Nagar to Bombay Sappers via New Airport Road, with a flyover at Vishrantwadi Chowk. Commissioner Naval Kishore Ram said work will begin where municipal roads already exist. The detailed project report is due in December.",src:"The Bridge Chronicle"}
]},

explainer:{title:"Why Indian stocks keep falling",body:"The Nifty has dropped for eight weeks straight, its longest run since 2001. Analysts mostly blame outside forces. Brent crude is near $100, which raises India's import bill. Bond yields are at multi-year highs, which makes safer assets more attractive than shares. Foreign investors keep selling. And most economists now expect the RBI to raise interest rates on October 7, which would make borrowing costlier for companies and households. Auto stocks fell hardest yesterday (about 3.5%), while IT stocks rose 2.1%, partly because IT companies earn in dollars and benefit when the rupee is weak.",src:"Business Standard"},
dots:{title:"Strong tax collections, falling stock prices",body:"September GST collections rose 14.7% to Rs 2.04 lakh crore, and domestic collections grew 9.3%, a sign that spending inside India is holding up. On the same day, the Sensex fell for a fourth session. The two are consistent: analysts say the market sell-off is driven mainly by global factors (oil, bond yields, foreign selling), not by a collapse in domestic demand. Part of the GST jump also came from imports, where collections rose 29%."},

stories:[
{c:"W",k:"Geopolitics",lead:1,big:1,title:"US sends a third aircraft carrier and about 9,000 troops toward Iran",dek:"The USS Theodore Roosevelt left San Diego on Thursday. Trump said Iran will be hit very hard if it is tied to the Flydubai cockpit attack.",body:"The USS Theodore Roosevelt carrier group and the USS Makin Island amphibious group are heading to the Middle East with more than 7,000 sailors and 2,000 Marines. They will join two carriers already there, the largest US naval concentration in the region since the 2003 Iraq invasion. Trump told Time magazine that heavier bombing of Iran after the November midterms is possible, and said Iran will be hit very hard if it is linked to the attack on a Flydubai flight.",why:"Three carriers give Washington the option of a much bigger strike campaign, just as ceasefire talks have stalled.",next:"Whether investigators link Iran to the Flydubai attack.",src:"AP / Fortune / Euronews"},
{c:"W",k:"Geopolitics",title:"Rubio orders Iran's UN delegates out as ceasefire talks stall",dek:"Iran says it has received a US reply. Both sides agree on what needs to happen but not on the order.",body:"Secretary of State Marco Rubio demanded that Iranian delegates to the UN General Assembly leave the United States after ceasefire negotiations stalled, Axios reported. Iran said it received a US response to its proposal, and that both sides agree on the steps needed but disagree on their sequencing. Reuters reports Iranian commanders are reviewing plans to widen their list of targets if large-scale US attacks resume.",src:"Axios / Reuters"},
{c:"W",k:"World",title:"Indian captain fought off his co-pilot on a Flydubai flight to Israel",dek:"Captain Smit Machchhar was wounded but the plane landed safely in Saudi Arabia. Netanyahu said the co-pilot had been radicalised.",body:"On a Flydubai flight from Dubai to Tel Aviv on Wednesday, the co-pilot attacked Indian captain Smit Machchhar in the cockpit. Passengers and crew subdued the attacker, and the plane, carrying 174 passengers, diverted to Tabuk in Saudi Arabia. Saudi authorities arrested the co-pilot and handed him to the UAE. Netanyahu said early findings point to religious radicalisation.",src:"Al Jazeera / CNN / AP"},
{c:"W",k:"World",title:"Russia issues nuclear warning to NATO over Kaliningrad",dek:"NATO chief Mark Rutte rejected the threat. Ukraine says it will push Washington to sanction makers of Starlink-like components used by Russia.",body:"Russia issued nuclear warnings to NATO over what it called threats to its Kaliningrad exclave, and NATO Secretary General Mark Rutte rejected them, Reuters reported. Zelenskyy visited command posts near Lyman and praised Ukraine's counteroffensive gains.",src:"Reuters"},
{c:"W",k:"World",title:"Pakistan strikes militant hideouts in Afghanistan; Kabul says civilians died",dek:"Pakistan says it killed about 22 militants. Afghanistan says nine women and children were killed.",body:"Pakistan carried out airstrikes on what it called militant hideouts in Afghanistan, saying it killed about 22 fighters. Afghanistan said nine women and children were killed and 11 civilians wounded.",src:"AP"},
{c:"B",k:"Markets",lead:1,big:2,one:1,title:"Sensex falls for a fourth day; Nifty's losing streak hits eight weeks",dek:"The Sensex lost 571 points to 71,910. Auto stocks fell about 3.5% while IT rose 2.1%.",body:"The Sensex fell 570.59 points (0.79%) to 71,909.70 and the Nifty 198.50 points (0.88%) to 22,421.95 on Thursday, the fourth straight losing session. The Nifty is now down for eight consecutive weeks, its longest losing streak since 2001. Analysts blamed bond yields at multi-year highs, oil near $100, steady foreign selling and worries about an RBI rate hike. Markets were shut today for Gandhi Jayanti.",why:"If you hold equity mutual funds or SIPs, this is the longest weekly slide in 25 years.",next:"The RBI rate decision on October 7.",src:"Business Standard"},
{c:"B",k:"Economy",title:"GST collections rise 14.7% to Rs 2.04 lakh crore in September",dek:"It is the third straight month above Rs 2 lakh crore. Import-related GST jumped 29%.",body:"Gross GST collections rose 14.7% from a year earlier to about Rs 2.04 lakh crore in September, the third month in a row above Rs 2 lakh crore. Domestic collections grew 9.3% and import-related collections 29%. Net revenue after refunds was Rs 1.77 lakh crore, up 18.1%. Collections for April to September total Rs 12.46 lakh crore, up 11.6%.",src:"PTI / The Hans India"},
{c:"B",k:"Automotive & Mobility",title:"Car sales slip from August; Maruti still up 27% on the year",dek:"Four of the top five carmakers sold fewer cars than in August. Kia was the only one up on both measures.",body:"Passenger vehicle wholesales held at about 4 lakh units in September. Maruti Suzuki sold 1,68,744 units, down 4.7% from August but up 27% from a year earlier. Tata Motors (56,972) edged Mahindra (56,745) for second place by 227 units. Kia was the only top-five maker to grow both month on month and year on year, with 32,017 units.",src:"Autocar India"},
{c:"T",k:"AI",lead:1,big:4,title:"OpenAI fires three safety researchers over alleged leak",dek:"The company says they shared confidential information with an outside AI-safety group.",body:"OpenAI fired three members of its safety team for allegedly sharing confidential information with an outside AI-safety organisation, the Wall Street Journal reported. A spokesperson said they had violated company policies and broken the trust essential to its work. The firings follow OpenAI's decision to hold back its GPT-6.1 Astra model over safety concerns, and a warning to more than 100 organisations about unauthorised activity by its AI agents.",why:"It shows the strain inside OpenAI between safety staff and the company as regulators step up scrutiny.",src:"WSJ / Forbes"},
{c:"T",k:"Space",title:"Crew-13 reaches the ISS in a record 7 hours 50 minutes",dek:"It was the fastest trip to the station by an American crew. Typical Crew Dragon flights take 15 to 24 hours.",body:"SpaceX launched Crew-13 from Cape Canaveral at 11:10 AM EDT on Thursday. Jessica Watkins, Luke Delaney, Canada's Joshua Kutryk and Russia's Sergey Teteryatnikov docked with the ISS about 7 hours 50 minutes later, a record for an American crewed spacecraft. NASA said the station's position made the short trip possible. The crew will stay about six months.",src:"Space.com / NASA"},
{c:"T",k:"Cybersecurity",title:"Suspected Chinese hackers posed as Anthropic staff to target AI experts",dek:"Proofpoint says the campaign also impersonated former US officials and went after export control specialists.",body:"Cybersecurity firm Proofpoint said suspected Chinese hackers impersonated Anthropic employees and former US officials in an espionage campaign aimed at experts on AI export controls and military uses of AI. Separately, a California man was charged with smuggling about $300 million worth of servers with US-made GPUs to China.",src:"CNN / Reuters"},
{c:"I",k:"Sports",lead:1,big:5,title:"Hockey beats Pakistan 4-3 with 49 seconds left; cricket thrashes Sri Lanka",dek:"Both teams are in Asian Games finals. India has 64 medals.",body:"India's men's hockey team beat Pakistan 4-3 in the semifinal, scoring the winner with 49 seconds left. The men's cricket team beat Sri Lanka by 124 runs. Nitesh Kumar won Greco-Roman 97kg silver and Prince Kurisinkal Noble and Manu Francis took sailing silver; Ganesh Mani Ratnam Thirumuru and both squash teams won bronze. India's tally reached 64 medals.",why:"Hockey gold would also secure a place at the LA 2028 Olympics.",next:"Women's hockey final against China today; men's cricket and hockey finals on Saturday.",src:"Business Standard"},
{c:"I",k:"Careers & Work",title:"Second US judge blocks the $100,000 H-1B fee",dek:"A California court said the government skipped required rulemaking. A Massachusetts court blocked the fee in June.",body:"Judge Haywood Gilliam of the Northern District of California blocked the $100,000 fee on new H-1B petitions for workers outside the US, ruling that the administration overstepped its authority and skipped required rulemaking. The block stays until DHS completes proper notice-and-comment procedures. A Massachusetts court halted the original fee in June.",why:"Indian nationals receive the largest share of H-1B visas, so the fee would fall hardest on Indian tech workers and the companies that hire them.",src:"JURIST / Bloomberg"},
{c:"M",k:"Climate",lead:1,title:"Maharashtra's monsoon ends 19% short; Marathwada 40% below normal",dek:"Solapur (58%) and Beed (51%) had the biggest shortfalls. IMD blames El Niño.",body:"Maharashtra received 19% less rain than normal this monsoon. Marathwada was driest at 40% below normal, followed by Vidarbha (23%), Konkan (14%) and Madhya Maharashtra (11%). Solapur was 58% short, Beed 51%, Hingoli 49% and Ahilyanagar 46%. IMD is expected to announce the monsoon's withdrawal from the state between October 3 and 8.",why:"These shortfalls are behind the drought declared in 265 talukas and the coming 10% water cut.",src:"Free Press Journal / IMD"},
{c:"P",k:"Pune",lead:1,big:3,title:"Eight Alandi teenagers drown at Diveagar beach on a coaching-class trip",dek:"All were 16 and studied at Winners Academy. Police say the group misjudged the sea.",body:"Eight 16-year-old students from Alandi drowned at Diveagar beach in Raigad district on Thursday during an outing organised by Winners Academy, a private coaching class. The group of 48 included 25 boys, 17 girls and six teachers. Deputy SP Raju Sonawane said they failed to judge the water conditions. Dighi Marine police are investigating, and Pimpri-Chinchwad police say legal action is being taken.",why:"It is a stark reminder about supervision on school and coaching-class trips to Konkan beaches.",src:"Deccan Herald / ANI"},
{c:"P",k:"Pune",title:"Pune-Beed Express cancelled on Saturday for railway work",dek:"Third-line work between Hadapsar and Ghorpadi cancels both directions on October 3.",body:"Central Railway cancelled trains 11433 and 11434, the Pune-Beed Express in both directions, on October 3 for work on a third line between Hadapsar and Ghorpadi. Passengers should check the NTES app before travelling.",src:"Free Press Journal / Central Railway"}
]},

explainer:{title:"What an RBI rate hike would mean for your EMI",body:"The repo rate is the rate at which the RBI lends to banks. It has been 5.25% for four meetings. Eight of ten economists polled by Business Standard expect a rise to 5.50% on October 7, mainly because retail inflation was 4.82% in August, above the RBI's 4% target for three months running, and the rupee has fallen about 6% this year. Most new floating-rate home loans are linked directly to the repo rate, so they rise by the same amount. As an illustration, a Rs 50 lakh, 20-year loan at 8.5% would go to 8.75%, raising the EMI from about Rs 43,391 to Rs 44,186, roughly Rs 795 a month. Fixed deposit rates usually rise too, but more slowly.",src:"Business Standard; EMI figures are an illustrative calculation"},
dots:{title:"The weather and the RBI",body:"The monsoon's early exit and Maharashtra's 19% shortfall are linked to El Niño, according to IMD. Weak rain means weaker crops and higher food prices. Food and energy costs are exactly what is pushing inflation above target and pushing the RBI toward a hike. So a dry season in Marathwada and a rate decision in Mumbai are part of the same story."},

stories:[
{c:"W",k:"Geopolitics",lead:1,big:3,title:"Ethiopia and Eritrea cut diplomatic ties",dek:"Ethiopia closed its embassy and expelled 10 Eritrean diplomats, accusing Asmara of arming Tigrayan rebels. Eritrea cut all ties in response.",body:"Ethiopia closed its embassy in Eritrea and ordered 10 Eritrean diplomats to leave, accusing Eritrea of backing rebel forces. Eritrea responded by severing all diplomatic ties, accusing Ethiopia of incessant hostility. Fighting is the heaviest since the 2020-22 civil war, across Tigray, Amhara and Afar, and drones struck military headquarters in Addis Ababa; Tigrayan forces claimed responsibility. Ethiopia has also expelled Egyptian diplomats over the Nile dam dispute.",why:"Analysts warn the conflicts in Ethiopia, Eritrea and Sudan are becoming linked and could turn into a regional war in the Horn of Africa.",src:"Al Jazeera / WSJ"},
{c:"W",k:"World",title:"UAE calls the Flydubai cockpit attack an attempted terrorist act",dek:"The co-pilot attacked the Indian captain with a crash axe. A British-Iranian man was separately arrested over the RAF Fairford case.",body:"The UAE's prosecutor general said the co-pilot on Flydubai's Dubai-Tel Aviv flight attempted a terrorist act when he attacked captain Smit Machchhar with a crash axe. The plane, carrying 174 passengers, diverted to Tabuk in Saudi Arabia. In the UK, counter-terror police arrested a 25-year-old British-Iranian man over the security breach at RAF Fairford, the base used for US strikes on Iran.",why:"Trump has said Iran will be hit hard if it is linked to the attack, and US forces in the region are growing.",src:"Al Jazeera / BBC"},
{c:"W",k:"Politics",title:"Brazil votes on Sunday: Lula vs Flavio Bolsonaro",dek:"Polls show a near tie in a likely runoff. Datafolha has Lula at 47% and Bolsonaro at 45%.",body:"Brazilians vote for president on Sunday. President Lula, seeking a fourth term, faces Flavio Bolsonaro, son of the jailed former president. Datafolha's latest poll put Lula ahead 40% to 36% in the first round and 47% to 45% in a runoff, within the margin of error. If no one wins more than half the vote, a runoff will be held on October 25.",src:"Al Jazeera"},
{c:"W",k:"World",title:"Saudi Arabia says Houthis targeted power for Medina's mosque",dek:"The Houthis deny it. Yemen's government says it carried out 20 airstrikes in Taiz.",body:"Saudi Arabia said the Houthis attacked a power station supplying the Prophet's Mosque in Medina, which the Houthis denied. Yemen's internationally recognised government said it carried out 20 airstrikes on Houthi positions in Taiz province. The IOM says more than 145,000 people have been displaced since June.",src:"Reuters / Democracy Now"},
{c:"W",k:"Politics",title:"Spain's parliament rejects eviction ban",dek:"Junts, the PP and Vox voted down two housing decrees. Sanchez warned history would judge them.",body:"Spain's Congress rejected two government decrees that would have banned evictions of vulnerable families until 2030, extended rental contracts and limited purchases by vulture funds. Junts, the People's Party and Vox voted against. The measures followed public anger over the eviction of an 87-year-old wheelchair user in Madrid.",src:"Catalan News Agency"},
{c:"B",k:"Economy",lead:1,big:4,title:"RBI expected to raise rates on Wednesday, the first hike since 2023",dek:"Eight of ten economists polled expect the repo rate to rise to 5.50%. Inflation has been above target for three months.",body:"The RBI's Monetary Policy Committee meets October 5 to 7. Eight of ten economists polled by Business Standard, and nearly 60% in a Reuters poll, expect a 25 basis point increase to 5.50%. Retail inflation was 4.82% in August, the third month above the 4% target; wholesale inflation was 9.92%. The rupee is down about 6% against the dollar this year, and the US Fed and Bank of Japan have both raised rates.",why:"A hike would raise EMIs on floating-rate loans; see The Explainer below.",next:"The decision on Wednesday, October 7.",src:"Business Standard / Reuters"},
{c:"B",k:"Markets",title:"Brent holds around $103 a barrel",dek:"Oil is up about 57% from a year ago as the Strait of Hormuz stays mostly closed.",body:"Brent crude traded at $103.37 a barrel on Friday morning (US time), down slightly on the day but 6% higher than a month ago and about 57% higher than a year ago.",src:"Fortune"},
{c:"T",k:"Space",lead:1,title:"Three Indian startups put payloads in orbit on SpaceX's Transporter-18",dek:"SatLeo's TAPAS-1 is India's first commercial thermal-imaging payload. TakeMe2Space flew a satellite that analyses images in orbit.",body:"SpaceX's Transporter-18 rideshare mission on Friday carried payloads from three Indian startups. Ahmedabad's SatLeo Labs flew TAPAS-1, which measures land-surface temperature for urban heat mapping, crop stress and disaster monitoring. Hyderabad's TakeMe2Space launched MOI-1A, a 14-kg satellite that analyses Earth images in orbit to cut the data it sends down. EON Space Labs supplied a 502-gram multispectral camera on board.",why:"Indian private companies are now building and flying their own Earth-observation satellites.",src:"Inc42 / Indian Express"},
{c:"T",k:"AI",title:"Tokyo court gives a voice actor rights over his AI-cloned voice",dek:"Kenjiro Tsuda won the first ruling in Japan recognising voice as a personality right, after TikTok used an AI clone.",body:"A Tokyo court ruled in favour of voice actor Kenjiro Tsuda, recognising for the first time in Japan that a person's voice is protected as a personality right. The case involved unauthorised use of an AI clone of his voice on TikTok.",src:"AP"},
{c:"T",k:"Cybersecurity",title:"Californian charged with smuggling $300 million in AI servers to China",dek:"Greg Lui faces conspiracy, smuggling and money laundering charges over export-controlled GPUs.",body:"A California man, Greg Lui, was arrested on federal charges of smuggling about $300 million worth of export-controlled servers containing US-made GPUs to China. Separately, the Commerce Department has slowed licences for aircraft parts bound for China to gain leverage in trade talks.",src:"Reuters"},
{c:"I",k:"Sports",lead:1,big:1,one:1,title:"Golden 48 hours: women end 44-year wait, men retain hockey gold, cricket beats Pakistan",dek:"The women beat China 1-0; the men thrashed Malaysia 5-1. Both teams have qualified for LA 2028.",body:"Lalremsiami's first-quarter goal and a penalty-stroke save by Savita Punia gave India's women a 1-0 win over China on Friday, their first Asian Games hockey gold in 44 years. On Saturday the men beat Malaysia 5-1, with two goals from Harmanpreet Singh and others from Jugraj Singh, Hardik Singh and Shilanand Lakra. It is the first time India's men have defended the title. Both wins secure places at the LA 2028 Olympics; the women missed Paris 2024. The men's cricket team also beat Pakistan by 19 runs for gold.",why:"Both hockey teams are now through to the 2028 Olympics without needing to qualify another way.",src:"Outlook India / ETV Bharat / ESPNcricinfo"},
{c:"I",k:"Sports",title:"Six golds in one day: Lovlina, Parveen, Ankush and archers win",dek:"India rose to fifth on the table with 16 golds after Friday, then added more on Saturday.",body:"On Friday India won six golds: the women's recurve archery team (Ankita Bhakat, Kumkum Mohod, Kirti Sharma), boxers Lovlina Borgohain (75kg), Parveen Hooda (65kg) and Ankush Panghal (80kg), wrestler Sujeet Kalkal (65kg) and the women's hockey team. On Saturday Kumkum Mohod won individual recurve gold, Aman Sehrawat won 57kg wrestling gold and Pranavi Urs won women's golf gold. The men's hockey win was India's 21st gold of the Games.",src:"Khel Now / Business Standard / ETV Bharat"},
{c:"M",k:"Climate",lead:1,big:5,title:"Monsoon leaves Mumbai five days early",dek:"It is the city's second-earliest exit in 25 years. IMD warns of October heat.",body:"IMD declared the monsoon's withdrawal from Mumbai and parts of Maharashtra on Saturday, five days ahead of the normal October 8 date. It is Mumbai's second-earliest exit in 25 years, after 2002. Mumbai city ended 7% below normal while the suburbs were 9% above; the state as a whole was 19% short. IMD linked the early withdrawal to El Niño and said temperatures will now rise.",why:"An early exit after a weak season means no late rain to refill dams in drought-hit areas.",src:"Free Press Journal / IMD"},
{c:"M",k:"Maharashtra",title:"Minister Dhananjay Munde joins MPSC protesters against his own government",dek:"He backed demands for the MPSC chairman and secretary to resign.",body:"Maharashtra minister Dhananjay Munde joined MPSC aspirants protesting at Ahilya Library in Pune on Friday and backed their demand for the resignation of the MPSC chairman and secretary. Students resumed protests because the CM's September 30 assurances, including about 70,000 posts and offline exams, had not been issued as a written order.",src:"Free Press Journal"},
{c:"P",k:"Pune",lead:1,big:2,title:"MPSC protests split three ways across Pune",dek:"One group wants the descriptive exam pattern kept, another wants the old objective pattern back. All want the MPSC chairman out.",body:"Three MPSC protests ran at once on Saturday. At Alka Chowk, students led by Ajinath Kedar want the descriptive exam pattern to continue. At Ahilya Library, Nitin Andhale's group wants the objective pattern restored. At SM Joshi Bridge, MLA Rohit Pawar's protest is in its third day, demanding offline exams. All three want the MPSC chairman removed. The commission's secretary has already been removed, and police have served notices on protesters.",why:"The split makes it harder for the government to satisfy everyone, which could mean a longer stand-off over exams and recruitment.",src:"Free Press Journal"},
{c:"P",k:"Pune",title:"Police: viral claim of 123 kidnappings in 22 hours is fake",dek:"DCP Gauhar Hasan said the investigation found no evidence. Police are tracing who spread it.",body:"Pune police said a viral reel and audio clip claiming 123 girls were kidnapped in 22 hours is completely fake. DCP (Crime) Gauhar Hasan said investigators spoke to the person who recorded the audio and to local residents and found nothing to support it. Police are investigating how it spread and may take legal action.",src:"Free Press Journal"}
]},

explainer:{title:"How Brazil's two-round election works",body:"Brazil elects its president in up to two rounds. To win today, a candidate needs more than half of the valid votes, which excludes blank and spoiled ballots. If no one does, the top two meet in a runoff on October 25. Voting is compulsory for literate citizens aged 18 to 70 and is done on electronic machines, so results usually come within hours of polls closing. In the latest Quaest poll Lula had 39% and Flavio Bolsonaro 34% in the first round, so a runoff is the likeliest outcome. Head-to-head, Quaest has them tied at 42% and BTG/Nexus has Lula ahead 46% to 44%, within the margin of error.",src:"Reuters (Quaest and BTG/Nexus polls); Brazil's electoral rules"},
dots:{title:"From Camp David to your EMI",chain:["Iran war keeps oil expensive","G7 releases 100 million barrels","Oil feeds inflation","RBI decides on rates","Your EMI"],body:"The Iran war is why oil is expensive. The G7's release of 100 million barrels is meant to bring prices down. Oil is a big part of what India imports, so its price feeds straight into fuel costs and inflation, and inflation above target is the main reason economists expect the RBI to raise rates on Wednesday. If the release works, it eases the pressure on the RBI; if it does not, a hike becomes more likely.",link:["G7 agrees to release 100 million barrels of oil and diesel","RBI decides on Wednesday: most expect the first hike since 2023"]},

stories:[
{c:"Sports",lead:1,big:1,one:1,status:"Confirmed",st:"upd",since:"Competition has ended; yesterday we had India's hockey and cricket golds.",made:"The last word on two weeks of India's biggest multi-sport event before LA 2028.",title:"India ends the Asian Games fourth with 85 medals",dek:"21 gold, 27 silver and 37 bronze: India's second-best Games ever, behind only 2022. Nine medals came on the final day, five of them gold.",why:"It confirms India as Asia's fourth sporting power, and hockey's golds already qualify both teams for the LA 2028 Olympics.",who:"Athletes and federations, whose funding is often tied to medals; fans; anyone following India's Olympic bid.",ctx:"India won a record 107 medals at Hangzhou in 2022. The Asian Games are held every four years; the next are in Doha in 2030.",body:"India finished the 2026 Asian Games in Aichi-Nagoya fourth on the table with 85 medals: 21 gold, 27 silver and 37 bronze. It matched Uzbekistan's 21 golds but finished ahead on silvers, 27 to 25. China topped the table with 341 medals, ahead of Japan (269) and South Korea (150). It is India's second-best Games after 2022's 107 medals. The final day of competition brought nine medals, five of them gold, including golfer Pranavi Urs, the first Indian woman to win an individual Asian Games golf gold. India won gold in men's and women's cricket, kabaddi and hockey, nine medals in archery and 24 in athletics, and its first Asian Games medals in soft tennis, MMA and rowing. Trap shooter Neeru Dhanda carries India's flag at tonight's closing ceremony in Nagoya, where the Games are handed to Doha for 2030.",next:"The closing ceremony is tonight. The sports ministry's medal review and the run-up to LA 2028 come next.",src:"Outlook India / India.com",links:[{o:"Outlook India",u:"https://www.outlookindia.com/sports/others/india-final-medal-tally-asian-games-2026-fourth-place-standings-gold-silver-bronze-count-aichi-nagoya"},{o:"India.com",u:"https://www.india.com/sports/others/asian-games-2026-neeru-dhanda-leads-indias-contingent-as-flag-bearer-at-closing-ceremony-with-aichi-nagoya-edition-closed-8532719/"}],th:"asiad"},
{c:"Politics",lead:1,big:2,status:"Developing",st:"dev",since:"Voting is under way; the last polls showed Lula ahead in round one but tied in a runoff.",made:"The largest democracy in Latin America chooses its president today, and Brazil is a key partner for India in BRICS.",title:"Brazil votes today: Lula vs Flavio Bolsonaro",dek:"Lula leads the first round in polls, 39% to 34% in one and 42% to 37% in another. A runoff looks almost tied.",why:"The result decides Brazil's direction on the economy, the Amazon and its ties with the US and China, and it is a test of the Bolsonaro family's comeback.",who:"Brazil's 150 million-plus voters; investors in Brazil; India, a fellow BRICS member and a big buyer of Brazilian soybean oil.",ctx:"Lula, 80, is seeking a fourth term. Flavio Bolsonaro is a senator and the son of former president Jair Bolsonaro, who is barred from running.",body:"Brazilians vote today in the first round of the presidential election. Two final-week polls, reported by Reuters, show President Luiz Inácio Lula da Silva ahead: Quaest has him at 39% against 34% for senator Flavio Bolsonaro, and BTG Pactual/Nexus at 42% to 37%. Neither is near the 50% of valid votes needed to win outright, so a runoff on October 25 is likely. In a head-to-head, Quaest has the two tied at 42% and BTG/Nexus puts Lula ahead 46% to 44%, within the margin of error. Polls close at 5 PM in Brasília, 1:30 AM on Monday in India; results usually follow within hours because voting is electronic.",next:"Results by Monday morning in India; a runoff on October 25 if needed.",src:"Reuters",links:[{o:"Reuters (via The Star)",u:"https://www.thestar.com.my/news/world/2026/09/28/brazil039s-lula-widens-first-round-lead-runoff-with-bolsonaro-stays-tight-btgnexus-poll-shows"}],th:"brazil"},
{c:"Geopolitics",lead:1,big:3,status:"Reported",st:"dev",made:"The Iran war is behind high oil prices, which reach every Indian household through fuel and inflation.",title:"Trump's top officials meet at Camp David on the Iran war",dek:"Vance, Rubio, Hegseth and others met on Friday. US forces in the region could reach about 20,000 as another carrier group heads out.",why:"Washington is deciding whether to step up or step back in a seven-month war that has kept oil above $100 a barrel.",who:"Gulf states and shipping through the Strait of Hormuz; about 9 million Indians who live and work in the Gulf; anyone paying for fuel.",ctx:"The war began on February 28, 2026. In recent days Iran said it is reviewing targets beyond US assets, and the US sent a third aircraft carrier.",body:"Senior Trump administration officials, including Vice President JD Vance, Secretary of State Marco Rubio, Defense Secretary Pete Hegseth, envoy Steve Witkoff, CIA Director John Ratcliffe and General Dan Caine, met at Camp David on Friday to discuss the seven-month-old Iran war and the escalating Saudi-Houthi conflict in Yemen, CBS News reported. The USS Theodore Roosevelt carrier group and the USS Makin Island amphibious group are heading to the region, which could bring US forces there to about 20,000. Several vessels were struck in the Strait of Hormuz this week. Trump said: \"We could leave tomorrow, and it would take them years to rebuild.\"",next:"Whether the meeting leads to a decision on escalating, a pause, or new talks.",src:"CBS News / AP",links:[{o:"CBS News",u:"https://cbsnews.com/live-updates/trump-iran-war-us-midterm-elections-troops-deployment"},{o:"Just Security roundup (AP, Reuters)",u:"https://www.justsecurity.org/159499/early-edition-october-2-2026/"}],th:"iran"},
{c:"Economy",big:4,status:"Reported",st:"new",made:"The most direct lever on the oil price that shapes India's inflation, and Wednesday's RBI decision.",title:"G7 agrees to release 100 million barrels of oil and diesel",dek:"The release is spread over four months, with a large share in the first 20 days.",why:"Cheaper oil would ease India's import bill and inflation, and could take pressure off the RBI.",who:"Drivers and transporters; airlines; companies that run on diesel; the government's fuel subsidy bill.",ctx:"Emergency oil stocks are reserves rich countries hold for supply shocks. India imports about 85% of its crude oil.",body:"G7 countries agreed to release 100 million barrels of crude oil and diesel from emergency reserves over four months, with a substantial share released within the first 20 days, CBS News reported. The move aims to calm prices driven up by the Iran war and attacks on shipping in the Strait of Hormuz. Brent crude has held around $103 a barrel. India, which imports most of its oil, gains from any fall in global prices, though pump prices are set by state-run companies and do not move one for one.",next:"Watch Brent this week and whether the release shows up in prices before Wednesday.",src:"CBS News",links:[{o:"CBS News",u:"https://cbsnews.com/live-updates/trump-iran-war-us-midterm-elections-troops-deployment"}],th:"iran"},
{c:"Personal Finance",big:5,status:"Developing",st:"dev",since:"No change since yesterday: the decision is on Wednesday.",made:"Affects every floating-rate home loan in India.",title:"RBI decides on Wednesday: most expect the first hike since 2023",dek:"Eight of ten economists polled expect the repo rate to rise from 5.25% to 5.50% on October 7.",why:"A hike would raise EMIs on most floating-rate home loans within one or two billing cycles.",who:"Home, car and personal loan borrowers on floating rates; savers, as deposit rates tend to follow more slowly.",ctx:"Retail inflation was 4.82% in August, above the RBI's 4% target for three months running, and the rupee is down about 6% this year.",body:"The RBI's Monetary Policy Committee announces its decision on Wednesday, October 7. Eight of ten economists polled by Business Standard expect a 25 basis point rise in the repo rate to 5.50%, the first increase since February 2023. The main reasons are retail inflation above target and a weaker rupee. As an illustration, on a Rs 50 lakh, 20-year home loan at 8.5%, a 0.25 point rise adds about Rs 795 to the monthly EMI. See Issue 22's explainer for the full calculation.",next:"The announcement on Wednesday at 10 AM.",src:"Business Standard",links:[{o:"Business Standard"}],th:"rbi"},
{c:"Maharashtra",status:"Reported",st:"upd",since:"The CM's promise on the objective format, relayed by Dhananjay Munde, is new; a meeting is set.",made:"Lakhs of Maharashtra's job aspirants depend on how this ends.",title:"MPSC protest: CM promises objective exams; students meet him this week",dek:"Students remain on S M Joshi Bridge, now closed to traffic, demanding chairman Vivek Bhimanwar's resignation.",why:"The protest has drawn leaders from every opposition party, and students say verbal promises have been broken before.",who:"MPSC aspirants, who spend about Rs 10,000 a month on preparation according to Supriya Sule; commuters using S M Joshi Bridge.",ctx:"The MPSC runs Maharashtra's state government recruitment exams. Students are split: some want the descriptive Mains kept, others want the objective format, but all want the chairman removed.",body:"NCP leader Dhananjay Munde told students on Shastri Road that the Chief Minister has assured them upcoming exams will stay in the objective format. A student delegation is due to meet the CM in Mumbai on Monday or Tuesday. A sit-in led by MLA Rohit Pawar continues on S M Joshi Bridge in Navi Peth, which is closed to traffic, with students demanding the resignation of MPSC chairman Vivek Bhimanwar. MP Supriya Sule, Congress leader Vishwajeet Kadam and farmer leader Ravikant Tupkar have visited, and Aaditya Thackeray, Sanjay Raut and Sharad Pawar are expected.",next:"The meeting with the CM, and whether the promise is put in writing.",src:"The Bridge Chronicle / Free Press Journal",links:[{o:"The Bridge Chronicle",u:"https://www.thebridgechronicle.com/pune/pune-mpsc-students-protest-chairman-resignation-demand-agn97"},{o:"Free Press Journal",u:"https://www.freepressjournal.in/pune/three-mpsc-protests-erupt-across-pune-as-aspirants-split-over-exam-pattern"}],th:"mpsc"},
{c:"Pune",status:"Confirmed",st:"new",made:"Practical: heat plus mosquito-borne illness is this month's health risk in Pune.",title:"Pune runs 1-2°C hotter than normal as October begins",dek:"Highs of 33-34°C after a September with the least rain since 2018. Dengue and chikungunya cases are rising.",why:"Heat and stagnant water after a patchy monsoon are pushing up mosquito-borne illness.",who:"Outdoor workers, children and older people; anyone commuting in the afternoon.",ctx:"Pune got 736.2 mm of rain from June to September, but 523.6 mm of it fell in July. September had just 64.1 mm.",body:"Pune's maximum temperatures have reached 33-34°C, 1-2°C above the usual 30-32°C for early October, The Bridge Chronicle reported. IMD scientist S.D. Sanap said clear skies until afternoon let the sun heat the ground quickly. The monsoon delivered 736.2 mm from June to September, very unevenly: 64 mm in June, 523.6 mm in July, 84.5 mm in August and 64.1 mm in September, the lowest September since 2018. Doctors report more dengue, chikungunya and viral fever and advise drinking enough water and avoiding standing water at home.",next:"IMD expects above-normal temperatures through October.",src:"The Bridge Chronicle / IMD",links:[{o:"The Bridge Chronicle",u:"https://www.thebridgechronicle.com/pune/pune-rising-temperatures-early-october-2026-agn97"}],th:"monsoon"},
{c:"World",status:"Developing",st:"new",made:"Instability next door matters to India's security.",title:"Imran Khan's party marches today after talks with the government stall",dek:"PTI's long march goes ahead as talks chaired by the National Assembly speaker ended a second round without agreement.",why:"Past PTI marches on Islamabad have led to clashes, lockdowns and deaths.",who:"Pakistan's government and opposition; residents of Islamabad and Rawalpindi.",ctx:"Here PTI means Pakistan Tehreek-e-Insaf, Imran Khan's party, not the Press Trust of India. Khan has been in jail since 2023.",body:"Pakistan Tehreek-e-Insaf's long march, first called for September 27, was moved to today. The government, the PPP and PTI held a second round of talks on Saturday, chaired by National Assembly Speaker Ayaz Sadiq. He described Friday's first round as cordial, and all sides agreed not to criticise each other in public during talks, but no agreement was announced and a standoff between the federal and provincial governments remains, The Express Tribune reported.",next:"Whether the march is allowed to reach Islamabad, and whether talks continue.",src:"The Express Tribune",links:[{o:"The Express Tribune",u:"https://tribune.com.pk/story/2632785/govt-pti-kick-off-second-round-of-talks-ahead-of-oct-4-long-march"}]},
{c:"Technology",status:"Confirmed",st:"new",made:"A practical deadline for millions of Windows PCs.",title:"Windows 11 24H2 stops getting security updates on October 13",dek:"Microsoft began rolling out version 26H2 on September 29. Home and Pro PCs on 24H2 need to update.",why:"A PC without security updates is easier to hack.",who:"Anyone with a Windows 11 PC at home or school on version 24H2.",ctx:"Windows 11 gets one big update a year. Home and Pro editions get 24 months of security fixes per version.",body:"Microsoft started rolling out Windows 11 version 26H2 on September 29 as a small enablement package, Thurrott reported. Support for version 24H2 on Home and Pro ends on October 13, 2026, the next Patch Tuesday. To update, open Settings, then Windows Update, and turn on \"Get the latest updates as soon as they're available\". New features include settings backup, more taskbar positions, better File Explorer support for archive formats and a Point-in-Time restore option. Separately, OpenAI began rolling out \"Dots\", always-on ChatGPT agents with their own cloud computers, to Pro and Business Premium subscribers on September 29.",next:"Update before October 13. Check your version in Settings, System, About.",src:"Thurrott / SiliconANGLE",links:[{o:"Thurrott",u:"https://www.thurrott.com/?p=342194"},{o:"SiliconANGLE",u:"https://siliconangle.com/2026/09/29/openai-launches-dots-always-on-ai-agents-in-chatgpt-with-their-own-cloud-computers/"}]},
{c:"Climate",status:"Confirmed",st:"new",made:"Hard data on how fast summers are changing, from the EU's climate agency.",title:"A record 52% of Europe faced \"very strong\" heat stress this summer",dek:"Western Europe had its hottest summer since records began, according to Copernicus.",why:"Heat stress is a direct health risk, and Europe is warming about twice as fast as the global average.",who:"Older people, outdoor workers and cities without cooling; Indian students and tourists in Europe.",ctx:"Heat stress measures how hot it feels to the body, combining temperature, humidity, wind and sun.",body:"The EU's Copernicus Climate Change Service said 52% of Europe experienced \"very strong\" heat stress this summer, a record, and that Western Europe had its hottest summer since records began, Reuters reported. Separately, 21 US states and four cities sued the Environmental Protection Agency over the removal of emissions limits on gas and coal power plants.",next:"Copernicus publishes its full European climate report next year.",src:"Reuters / New York Times",links:[{o:"Just Security roundup (Reuters, NYT)",u:"https://www.justsecurity.org/159499/early-edition-october-2-2026/"}]},
{c:"Technology",k:"Defence",status:"Claimed",st:"new",made:"A new weapon that could change the war in Europe.",title:"Ukraine says it fired its own FP-7 ballistic missile in combat",dek:"President Zelenskyy said it was the missile's first combat use, against a Russian target.",why:"A home-built ballistic missile would let Ukraine strike deeper into Russia without waiting for Western supplies.",who:"Ukraine and Russia; NATO countries that set limits on how their weapons are used.",ctx:"Until now Ukraine has relied mostly on drones and Western missiles for long-range strikes.",body:"President Volodymyr Zelenskyy announced that Ukraine launched its domestically built FP-7 ballistic missile at a Russian target for the first time in combat, The Wall Street Journal reported. The claim has not been independently confirmed. Russian strikes on Kyiv the same day killed one person and forced two Dnipro River bridges to close, according to Reuters and AP.",next:"Whether independent evidence confirms the strike and how Russia responds.",src:"Wall Street Journal / Reuters / AP",links:[{o:"Just Security roundup (WSJ, Reuters, AP)",u:"https://www.justsecurity.org/159499/early-edition-october-2-2026/"}],th:"ukraine"}
]},

explainer:{title:"What happens at an RBI policy meeting",body:"The Monetary Policy Committee has six members: three from the RBI, including the Governor, and three outside experts appointed by the government. It meets at least four times a year, usually over three days. Members look at inflation, growth, the rupee and global rates, then vote on the repo rate; if the vote is tied, the Governor decides. The decision is announced in a short statement, this time on Wednesday at 10 AM, followed by a press conference. Its job by law is to keep retail inflation at 4%, within a band of 2% to 6%. Inflation was 4.82% in August, above 4% for three months running, which is why a rise is expected. Banks usually pass a change to repo-linked loans within one or two billing cycles.",src:"Reserve Bank of India; Business Standard"},
dots:{title:"Why a strait in the Gulf moves your Sensex",chain:["Hormuz stays closed","Oil above $100","Weaker rupee, higher inflation","RBI may raise rates","Pressure on shares"],body:"Iran's closure of Hormuz keeps oil above $100. India imports most of its oil, so expensive crude widens the import bill and weakens the rupee, and foreign investors sell Indian shares when the rupee falls. Higher fuel costs also feed inflation, which is why the RBI may raise rates on Wednesday, and higher rates weigh on shares too. That is why markets reopening today will watch the Gulf as closely as Mumbai.",link:["Iran says Hormuz stays shut until the US meets its conditions","Markets reopen after a three-day break, with the RBI ahead"]},

stories:[
{c:"Politics",lead:1,big:1,one:1,status:"Developing",st:"upd",since:"Yesterday's polls had Lula ahead in round one; the count put Flavio Bolsonaro first.",made:"The biggest upset of the year so far in a major democracy, and a fellow BRICS member.",title:"Brazil heads to a runoff after Flavio Bolsonaro outpolls Lula",dek:"With about two-thirds counted, Flavio Bolsonaro had 49.6% and Lula 42.3%. Neither passed 50%, so they meet again on October 25.",why:"Every final poll had Lula ahead. A Bolsonaro win would swing Latin America's largest economy to the right, with knock-on effects for BRICS, trade and climate policy.",who:"Brazilians; investors in Brazil, whose market reopens today; India, which works with Brazil in BRICS and buys its soybean oil.",ctx:"Flavio, 45, is the eldest son of former president Jair Bolsonaro, who is barred from running. Lula, 80, is seeking a fourth term.",body:"Senator Flavio Bolsonaro led President Luiz Inácio Lula da Silva in the first round of Brazil's presidential election, Reuters reported. With about 65% of polling stations counted, Flavio had 49.58% of valid votes and Lula 42.25%, and pollster Datafolha projected that neither would pass 50%, sending the race to a runoff on October 25. Final polls had shown Lula ahead by five points. Flavio said he was counting on a protest vote from people opposed to Lula. The campaign was dominated by corruption scandals and economic worries, including public debt above 82% of GDP. The electoral court said voting went normally.",next:"The final count today; then four weeks of campaigning before the October 25 runoff.",src:"Reuters / The Rio Times",links:[{o:"Reuters (via Daily Sun)",u:"https://www.daily-sun.com/index.php/world/901655/brazil-election-headed-to-runoff-projection-shows-as-bolsonaro-lead-narrows"},{o:"The Rio Times",u:"https://www.riotimesonline.com/brazil-election-first-round-results-lula-flavio-2026/"}],th:"brazil"},
{c:"Personal Finance",lead:1,big:2,status:"Developing",st:"dev",since:"The meeting has now started; the decision is still due Wednesday.",made:"Affects every floating-rate home loan in India within weeks.",title:"RBI's rate meeting begins; most expect a hike on Wednesday",dek:"The Monetary Policy Committee meets from today to Wednesday. Eight of ten economists polled by Business Standard expect a rise from 5.25% to 5.50%.",why:"It would be the first hike since 2023 and would raise EMIs on most floating-rate loans.",who:"Home, car and personal loan borrowers on floating rates; savers, as deposit rates follow more slowly.",ctx:"Retail inflation was 4.82% in August, above the 4% target for three months. The US Federal Reserve raised rates in September, and the rupee is down about 6% this year.",body:"The RBI's six-member Monetary Policy Committee meets from October 5 to 7 and announces its decision on Wednesday. In a Business Standard poll, eight of ten economists expect a 25 basis point rise in the repo rate to 5.50%; a Reuters survey found nearly 60% expecting the same. Retail inflation was 4.82% in August and wholesale inflation 9.92%. The US Federal Reserve raised rates in September for the first time in three years, and the rupee has fallen about 6% against the dollar this year. Yes Bank's chief economist Indranil Pan said the RBI may be slightly behind the curve.",next:"Decision and press conference on Wednesday from 10 AM.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/finance/news/rbi-mpc-meeting-october-2026-monetary-policy-repo-rate-hike-retail-inflation-126100200188_1.html"}],th:"rbi"},
{c:"Geopolitics",lead:1,big:3,status:"Reported",st:"dev",made:"The Hormuz closure is the single biggest reason fuel is expensive.",title:"Iran says Hormuz stays shut until the US meets its conditions",dek:"Tehran wants Washington to accept its seven-day plan based on the Islamabad memorandum. In Yemen, the government launched an offensive against the Houthis.",why:"About a fifth of the world's oil and gas normally passes through the strait; its closure keeps prices high and talks stuck.",who:"Shipping and oil importers, including India; Gulf states; the 9 million Indians who live and work in the Gulf.",ctx:"The war began with US-Israeli strikes on February 28. Trump rejected an Iranian reopening plan in September.",body:"Iran said the Strait of Hormuz will stay closed unless the United States accepts its seven-day plan based on the Islamabad memorandum, Al Jazeera reported. Parliament speaker Mohammad Bagher Ghalibaf said the era of wasting time and dictating unilateral demands is over, while Foreign Minister Abbas Araghchi said Iran is serious about a diplomatic solution. Spokesman Esmaeil Baghaei said reopening the strait is Iran's main goal, while Washington wants to focus on nuclear talks. In Yemen, the Saudi-backed government launched operations to retake Houthi-held territory; its army claimed 700 Houthis were killed in 24 hours, which could not be verified.",next:"Whether Washington answers after Friday's Camp David meeting.",src:"Al Jazeera",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/4/iran-says-strait-of-hormuz-to-remain-closed-until-us-meets-conditions"},{o:"Al Jazeera live",u:"https://www.aljazeera.com/news/liveblog/2026/10/4/iran-war-live-yemeni-forces-strike-sanaa-as-trump-warns-tehran-of-hard-way"}],th:"iran"},
{c:"Maharashtra",big:4,status:"Reported",st:"upd",since:"Sanjay Raut visited and threatened statewide protests; Fadnavis says all demands were accepted.",made:"Lakhs of job aspirants, and now a political fight across the state.",title:"MPSC protests continue; Raut warns they could spread statewide",dek:"Sanjay Raut called the Pune sit-in Maharashtra's Jantar Mantar. CM Fadnavis says the government has accepted all demands; protesters dispute that.",why:"The dispute has moved from exams to politics, and the opposition is threatening to take it statewide.",who:"MPSC aspirants; commuters around S M Joshi Bridge, Alka Chowk and Shastri Road.",ctx:"On September 30, Fadnavis promised a judicial inquiry into MPSC chairman Vivek Bhimanwar, offline exams and faster recruitment. Some students resumed protests, saying nothing was in writing.",body:"Shiv Sena (UBT) MP Sanjay Raut visited the MPSC aspirants' protest in Pune led by NCP (SP) MLA Rohit Pawar, demanded the removal of the MPSC chairman and said the agitation would continue until demands are met, PTI reported. He warned that if it spread across Maharashtra, the CM would find it hard to leave Varsha, his official residence. Fadnavis has said the government accepted all demands. Sharad Pawar called the CM to urge dialogue, ANI reported, and Union Minister Murlidhar Mohol appealed to students to end the protest, saying the government had responded positively. Minister Nitesh Rane visited a separate protest group in Navi Peth.",next:"Whether the government puts its promises in writing, or talks resume.",src:"PTI / ANI / UNI",links:[{o:"PTI (via ThePrint)",u:"https://theprint.in/india/raut-demands-removal-of-mpsc-chairman-warns-of-statewide-protests/3061857/"},{o:"ANI",u:"https://aninews.in/news/national/politics/mpsc-agitation-sharad-pawar-urges-maharashtra-govt-to-hold-dialogue-with-students-find-solution20261004135837/"},{o:"UNI",u:"https://www.uniindia.com/west-india/politics-mpsc-row-maha/202746"}],th:"mpsc"},
{c:"Pune",big:5,status:"Confirmed",st:"upd",since:"The monsoon had left Mumbai; it has now left Pune too.",made:"Practical: heat, low dam stocks and what it means for water this winter.",title:"The monsoon leaves Pune early; the city hits 34.8°C",dek:"The withdrawal reached Pune on October 3, the earliest in years. Khadakwasla's dams ended September at their lowest in six years.",why:"An early exit means no more refills for Pune's dams until next June, and hotter October days.",who:"Every Pune household on PMC water; outdoor workers; farmers in the district.",ctx:"Normally the monsoon leaves Pune around mid-October. Maharashtra ended the season about 17% short, according to Pune Pulse.",body:"The southwest monsoon withdrew from Pune on October 3, the city's earliest withdrawal in years, Pune Pulse reported. Pune recorded a maximum of 34.8°C on Saturday, 3.5°C above normal, and Lohegaon 35.4°C, about 4.1°C above. IMD said dry northerly winds, less rain and humidity and fewer clouds supported the withdrawal, and expects hot and humid conditions for the next three to four days. Storage in the Khadakwasla dams was at its lowest September level in six years.",next:"Watch for any PMC decision on water supply as storage is reviewed.",src:"Pune Pulse / IMD",links:[{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-monsoon-withdrawal-begins-early-on-october-3-city-swelters-at-34-8c-as-heat-and-humidity-rise/"}],th:"monsoon"},
{c:"Markets",status:"Reported",st:"new",made:"The first trading day after a long weekend full of news.",title:"Markets reopen after a three-day break, with the RBI ahead",dek:"Trading resumes today after Gandhi Jayanti. On Thursday the Nifty fell 1.45% to 22,292 and the Sensex 1.33%.",why:"Investors have the Brazil result, Hormuz and Wednesday's RBI decision to price in at once.",who:"Anyone with mutual funds, SIPs or shares.",ctx:"Markets were shut on Friday for Gandhi Jayanti. The next market holiday is October 20, for Dussehra.",body:"BSE and NSE reopen on Monday after being closed on Friday for Gandhi Jayanti. On Thursday, the Nifty 50 fell 1.45% to 22,292.45 and the Sensex 1.33%, with Bajaj Auto, Maruti Suzuki and Shriram Finance among the biggest losers and Infosys, HDFC Bank and SBI Life among the gainers. The Nifty has fallen for eight straight weeks. The next trading holiday is October 20 for Dussehra.",next:"How banks and rate-sensitive stocks trade ahead of Wednesday.",src:"TradingView / Upstox",links:[{o:"TradingView",u:"https://www.tradingview.com/news/moodys:25de8ff613558:0-stock-market-closed-for-next-3-days-here-is-why-check-nse-calendar-dates-october-2026/"},{o:"Upstox weekly wrap",u:"https://upstox.com/news/market-news/stocks/weekly-market-wrap-nifty-50-sensex-falls-up-to-3-marking-8th-week-of-loss-bajaj-auto-max-health-among-top-losers/article-201225/"}],th:"markets"},
{c:"World",status:"Developing",st:"upd",since:"Talks ended in deadlock; the march has now started.",made:"Unrest in Pakistan matters for India's security.",title:"Imran Khan's party starts its march on Islamabad",dek:"Khyber Pakhtunkhwa's chief minister launched the march from Lakki Marwat on Sunday, after talks with the government ended in deadlock.",why:"Past PTI marches on Islamabad have ended in clashes and lockdowns.",who:"Residents of Khyber Pakhtunkhwa and Islamabad; Pakistan's government.",ctx:"PTI here is Pakistan Tehreek-e-Insaf, Imran Khan's party. Khan has been in jail since 2023.",body:"Khyber Pakhtunkhwa Chief Minister Sohail Afridi launched PTI's long march from Gandi Chowk in Lakki Marwat on Sunday to demand Imran Khan's release, Dawn reported. The plan is to move through Karak, Kohat and Peshawar and reach Khairabad by October 8. Afridi said: \"We are not yes-men; we are soldiers of Imran Khan.\" Section 144, which bans gatherings, has been imposed in several districts. The government criticised his use of a state helicopter.",next:"The march is due at Khairabad, near Islamabad, by October 8.",src:"Dawn",links:[{o:"Dawn",u:"https://www.dawn.com/news/2034698"}],th:""},
{c:"Sports",status:"Confirmed",st:"upd",since:"The closing ceremony was held on Sunday night.",made:"The formal end of India's best Games outside 2022.",title:"The Asian Games close in Nagoya; Doha takes over for 2030",dek:"Trap shooter Neeru Dhanda carried India's flag. India finished fourth with 85 medals.",why:"Attention now turns to the LA 2028 Olympics, where both hockey teams have already qualified.",who:"Athletes and federations planning for LA 2028.",ctx:"India won 21 gold, 27 silver and 37 bronze, its second-best Asian Games after 2022.",body:"The 20th Asian Games closed on Sunday at Mizuho Park Athletic Stadium in Nagoya, with the Games flag handed to Doha for 2030. Trap shooter Neeru Dhanda, who won two golds and a silver, led India's contingent. India finished fourth with 85 medals, behind China, Japan and South Korea.",src:"India.com",links:[{o:"India.com",u:"https://www.india.com/sports/others/asian-games-2026-neeru-dhanda-leads-indias-contingent-as-flag-bearer-at-closing-ceremony-with-aichi-nagoya-edition-closed-8532719/"}],th:"asiad"},
{c:"Science",status:"Confirmed",st:"new",made:"The week's biggest science moment starts today.",title:"Nobel week begins with medicine this afternoon",dek:"The physiology or medicine prize is announced in Stockholm around 3 PM IST, followed by physics, chemistry, literature and peace.",why:"The prizes often spotlight discoveries that already shape everyday medicine and technology.",who:"Students, scientists and anyone curious about what counts as a breakthrough.",ctx:"The economics prize follows next Monday. Laureates receive their awards on December 10.",body:"The Nobel Assembly at the Karolinska Institute announces the 2026 Nobel Prize in Physiology or Medicine today at about 11:30 AM in Stockholm, 3 PM in India. Physics follows on Tuesday, chemistry on Wednesday, literature on Thursday and the Peace Prize on Friday.",next:"We'll cover the winners in tomorrow's issue.",src:"Nobel Prize",links:[{o:"NobelPrize.org",u:"https://www.nobelprize.org/"}]},
{c:"Technology",status:"Reported",st:"new",made:"A sign of how AI-made junk is overloading real work.",title:"Google stops some bug reports after a flood of AI-generated fakes",dek:"Google suspended product vulnerability submissions to part of its open-source bug bounty from October 1.",why:"Reviewers were swamped by AI-written reports describing bugs that do not exist, which slows down fixing real ones.",who:"Security researchers who earn rewards for finding bugs; open-source maintainers.",ctx:"A bug bounty pays outsiders for finding security flaws. Open-source software underpins most apps and websites.",body:"Google suspended part of its Open Source Software Vulnerability Reward Program, ending product vulnerability submissions on October 1, after an influx of invalid AI-generated reports, Tom's Hardware reported. Separately, Bloomberg reported that France's Schneider Electric is nearing a deal to buy US industrial software firm PTC for more than $20 billion, which would be its largest ever.",next:"Whether other bug bounty programmes add limits on AI-written reports.",src:"Tom's Hardware / Bloomberg",links:[{o:"Tom's Hardware",u:"https://www.tomshardware.com/tech-industry/artificial-intelligence/google-suspends-part-of-the-oss-vrp-bug-bounty-program-due-to-an-influx-of-invalid-ai-submissions-product-vulnerability-submissions-ended-october-1"},{o:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-10-04/schneider-said-to-near-deal-to-buy-ptc-for-more-than-20-billion"}]},
{c:"Technology",k:"Robotics",status:"Reported",st:"new",made:"Robots moving from lab demos into food delivery and real chores.",title:"This week in robots: DoorDash's own drone, a laundry robot and a fiery send-off",dek:"DoorDash unveiled a six-rotor delivery drone; Dyna showed a robot doing an hour of laundry unaided; Figure melted its retired humanoids in a Finnish furnace.",why:"Delivery drones and chore robots are getting close to everyday use, though most are still pilots, not products you can buy or order from.",who:"Delivery workers and restaurants; hotels and laundries; anyone wondering when robots reach home.",ctx:"Drone delivery in India is still limited to trials; most commercial flights need special clearance from the DGCA.",body:"DoorDash unveiled its own six-propeller delivery drone, which lowers orders on a winch, TechCrunch reported. Pilot deliveries begin in Northern California with Chipotle, Popeyes and Momo N Curry, and the company already holds FAA Part 135 certification for commercial drone delivery. Dyna Robotics showed Taku, a wheeled robot with two arms, running an hour-long laundry cycle on its own: loading machines, folding and shelving towels, and handling dropped items. Dyna calls the demo uncut and autonomous, but one demo does not show it works reliably every shift, Humanoids Daily noted. Figure retired its first-generation F.02 humanoids by lowering them into a 75-ton electric arc furnace in Imatra, Finland, in a film narrated by Arnold Schwarzenegger; the recovered steel is being sold as model heads for $500 and $1,900.",next:"DoorDash's first customer drone deliveries in California; Dyna's first deployments at customer sites.",src:"TechCrunch / Humanoids Daily / TechEBlog, via The Rundown",links:[{o:"TechCrunch",u:"https://techcrunch.com/2026/09/30/doordashs-drone-strategy-started-on-the-ground/"},{o:"Humanoids Daily",u:"https://www.humanoidsdaily.com/news/dyna-taku-dyna-2-1-autonomous-laundry"},{o:"TechEBlog",u:"https://www.techeblog.com/figure-f02-robot-decommission-arnold-scwarzenegger-finland/"},{o:"The Rundown Robotics",u:"https://robotnews.therundown.ai/p/doordash-puts-its-own-drone-on-the-menu"}]}
]},

explainer:{title:"Why Maharashtra is cutting water in October",body:"Cities plan water from one monsoon to the next. This year Maharashtra's monsoon ended about 17-19% short, and it withdrew early, from Mumbai last week and from Pune on October 3. That means no more natural refills of the dams until next June. So the state has told every local body to cut supply by 10% from October 16 and to plan until August 31, 2027, which leaves a buffer in case next year's rain also starts late. The cut can be increased if needed. Pune went to alternate-day supply in June this year and withdrew it after July's heavy rain. Officials say Pune's dams are about one TMC below last year but can last the city until July with planning. How the 10% is applied, for example one day a week without water, is up to each civic body.",src:"The Bridge Chronicle; Punekar News; Pune Pulse; IMD"},
dots:{title:"Oil, the rupee and tomorrow's RBI decision",chain:["Brent eases to about $102.5","Rupee firms","Less pressure on inflation","A little more room for the RBI"],body:"Monday's market rise came as Brent eased to about $102.5 a barrel and the rupee firmed. Both matter to the RBI: cheaper oil lowers inflation, and a stronger rupee eases the pressure to raise rates to stop money leaving India. Neither changes the picture much on its own. Most economists still expect a hike tomorrow, but a calmer oil price makes a smaller or later move more likely if it lasts.",link:["Sensex ends a four-day fall as oil eases and the rupee firms","RBI decides tomorrow: most still expect a rise to 5.50%"]},
