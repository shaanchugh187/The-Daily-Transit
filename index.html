{c:"India",lead:1,big:1,one:1,status:"Reported",st:"upd",since:"Friday's warnings became a full lockdown on Saturday.",made:"The largest show of force yet in the row over the Election Commission.",title:"Delhi locked down for youth protest against the Chief Election Commissioner; about 2,000 detained",dek:"Those detained included Cockroach Janta Party founder Abhijeet Dipke, YouTuber Dhruv Rathee, lawyer Prashant Bhushan, Arvind Kejriwal and Mamata Banerjee. In Pune, 88 were detained near Shaniwar Wada.",why:"The protest is about trust in voter lists; the scale of the crackdown has drawn criticism from the UN human rights office.",who:"Voters; students and young people, who make up most of the protesters; Delhi commuters.",ctx:"The protesters say the revision of voter lists has removed eligible voters; the Election Commission and the BJP deny it.",body:"Police sealed central New Delhi before the Cockroach Janta Party's protest at Jantar Mantar, suspended mobile internet and closed dozens of Metro stations and markets, Al Jazeera and Reuters reported. A Home Ministry official told Reuters about 2,000 people were detained; other counts vary widely. Dipke and two colleagues were held as their plane landed, and were released on condition of keeping the peace for a year. Congress president Mallikarjun Kharge said India had become a 'muzzled democracy'; BJP spokesman Sambit Patra called the protesters 'anarchic elements'. The UN human rights office urged respect for peaceful assembly; India's mission in Geneva called the concern 'misplaced'. In Pune, police refused permission for a rally from Shaniwar Wada and detained 88 people, Punekar News reported. Rahul Gandhi announced a fresh INDIA bloc protest for Monday.",next:"The INDIA bloc's march on Monday.",src:"Al Jazeera (Reuters) / Outlook India / Punekar News / ANI",links:[{o:"Al Jazeera (Reuters)",u:"https://www.aljazeera.com/news/2026/10/10/indias-cockroach-leaders-detained-new-delhi-in-lockdown"},{o:"Outlook India",u:"https://www.outlookindia.com/national/delhi-fortified-ahead-of-cjp-protest-45-metro-stations-shut-245-trains-cancelled-internet-suspended"},{o:"Punekar News",u:"https://www.punekarnews.in/pune-sir-protest-88-detained-near-shaniwar-wada-some-youths-to-be-released-to-parents/"},{o:"ANI",u:"https://www.aninews.in/news/national/politics/rahul-gandhi-announces-india-bloc-protest-against-cec-on-oct-12-alleges-violence-by-goons-in-delhi20261011010906/"}],loc:[28.627,77.216,"Jantar Mantar, New Delhi"]},
{c:"Geopolitics",big:2,status:"Reported",st:"upd",since:"Thursday's strike on the same airport killed three; Saturday's killed 12.",made:"The deadliest attack on Saudi Arabia in more than a decade.",title:"Missile strike on Riyadh airport kills 12; Trump says the US 'may' act",dek:"Saudi Arabia's aviation authority said 309 people were wounded. Secretary of State Marco Rubio confirmed an American was killed.",why:"US action against the Houthis would widen the war around the Gulf, where millions of Indians work and most of India's oil comes from.",who:"Indians in Saudi Arabia and the Gulf; travellers; fuel buyers.",ctx:"The Houthis have attacked Saudi airports repeatedly since Yemen's government launched an offensive on October 4.",body:"A missile struck Riyadh's King Khalid International Airport on Saturday, killing 12 people and wounding 309, Saudi Arabia's General Authority of Civil Aviation said, according to Al Jazeera, which called it the deadliest attack on the kingdom in more than a decade. Those killed included four Saudis, two Bangladeshis and an American. The Saudi-led coalition called it a 'full-fledged war crime'. Asked whether the US would act, Trump said: 'We may. We're going to look at it.' Separately, a US fighter jet disabled a cargo ship that US Central Command said was trying to run the blockade of Iran in the Gulf of Oman.",next:"Whether the US joins strikes on the Houthis.",src:"Al Jazeera",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/11/yemen-fighting-expands-as-houthis-attack-saudi-airport-what-to-know"},{o:"Al Jazeera (blockade)",u:"https://www.aljazeera.com/news/2026/10/11/us-forces-disable-ship-attempting-to-run-iran-blockade-in-gulf-of-oman"}],th:"iran",loc:[24.96,46.70,"King Khalid Airport, Riyadh"]},
{c:"Personal Finance",big:3,status:"Confirmed",st:"new",made:"The RBI's boldest step yet to stop the rupee's slide.",title:"RBI opens a special dollar window for oil companies to defend the rupee",dek:"From Monday the RBI will meet the daily dollar needs of Indian Oil, HPCL and BPCL. It also cut the limit on currency bets without proof of need from $100 million to $5 million.",why:"A falling rupee makes fuel, gadgets and foreign education costlier; this aims to slow the slide.",who:"Anyone paying for imports, foreign travel or studies abroad; importers and exporters.",ctx:"The rupee has fallen more than 7% this year as the oil shock from the Iran war raises India's import bill.",body:"The RBI said it would meet 'the entire daily US dollar requirements' of Indian Oil, HPCL and BPCL through designated banks from Monday, until further notice, Business Today reported. It also cut the limit on currency derivative positions that need no proof of underlying exposure from $100 million to $5 million, barred rebooking of cancelled rupee contracts and introduced a 20% foreign exchange risk reserve on some large contracts, Outlook Business reported, citing Reuters. The rupee firmed about 0.6% in offshore trade after the announcement.",next:"How the rupee trades on Monday.",src:"Business Today / Outlook Business (Reuters)",links:[{o:"Business Today",u:"https://www.businesstoday.in/latest/corporate/story/rbi-opens-special-dollar-window-for-three-state-run-oil-companies-from-october-12-560786-2026-10-10"},{o:"Outlook Business",u:"https://www.outlookbusiness.com/amp/story/economy-and-policy/rbi-dollar-window-indian-oil-hpcl-bpcl-rupee-support-measures-forex-reserves"}],th:"rbi",loc:[18.93,72.83,"Mumbai"]},
{c:"World",big:4,status:"Reported",st:"dev",made:"The war hits cities hardest as winter nears.",title:"Russian glide bombs kill 17 in Zaporizhzhia; Zelenskyy calls the diesel deal 'a weak decision'",dek:"Three children were among the dead. Overnight Russia launched 160 drones, disrupting Kyiv's metro and water supply.",why:"Pressure from Washington on Kyiv is rising at the same time as Russian attacks.",who:"Ukrainian civilians; Indian students and workers in Ukraine.",ctx:"Trump agreed on Friday to let Russia supply diesel to world markets.",body:"Russian guided bombs killed 17 people, including three children, and injured 18 in Zaporizhzhia on Saturday, Ukraine's emergency service said, according to Interfax-Ukraine. Overnight Russia launched 160 drones; metro, tram and trolleybus services were halted in parts of Kyiv, the Institute for the Study of War said. Zelenskyy called the US-Russia diesel deal 'a weak decision by strong partners' that 'plays into Russia's hands'. A US official told Axios Trump made the deal after Zelenskyy ignored US requests to stop hitting Russian refineries.",next:"Whether a pause in strikes on energy sites can be agreed.",src:"Interfax-Ukraine / ISW / Al Jazeera / Axios",links:[{o:"Interfax-Ukraine",u:"https://en.interfax.com.ua/news/general/1217651.html"},{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/10/why-is-us-turning-to-russia-for-diesel-despite-sanctions"},{o:"Axios",u:"https://www.axios.com/2026/10/10/trump-zelensky-putin-diesel-deal-war"}],th:"ukraine",loc:[47.84,35.14,"Zaporizhzhia, Ukraine"]},
{c:"Pune",big:5,status:"Reported",st:"dev",since:"Three hunger strikers have ended their fast.",made:"Ten days in, the protest is still going.",title:"MPSC protest day 10: three hunger strikers end their fast; four continue",dek:"MLA Vishwajeet Kadam offered them milk after appeals. The students still want the MPSC chairman to resign.",why:"The students' health is now a concern, and there are still no direct talks with the government.",who:"MPSC aspirants; commuters around S M Joshi Bridge and LBS Road.",ctx:"Police have registered a case against 15 protest representatives.",body:"Three students who had been on hunger strike for five days ended their fast after appeals, with Congress MLA Vishwajeet Kadam offering them milk, The Bridge Chronicle reported; four others continued. The protest near S M Joshi Bridge, which began on October 1, demands the resignation of MPSC chairman Vivek Bhimanwar over alleged paper leaks and irregularities.",next:"Whether the government offers talks.",src:"The Bridge Chronicle",links:[{o:"The Bridge Chronicle",u:"https://www.thebridgechronicle.com/pune/pune-mpsc-protest-tenth-day-chairman-resignation-demand-agn97"}],th:"mpsc",loc:[18.513,73.846,"S M Joshi Bridge, Pune"]},
{c:"AI",status:"Reported",st:"new",made:"A study every student using AI should read.",title:"Ten minutes of AI help makes people give up sooner, study finds",dek:"In trials with 1,222 people, those who had ChatGPT's help did better at first, then skipped more problems and got more wrong once it was removed.",why:"If AI does the hard part for you, you may lose the habit of sticking with difficult problems.",who:"Students; teachers; anyone learning a new skill.",ctx:"The paper, 'AI Assistance Reduces Persistence and Hurts Independent Performance', was presented at a conference this month.",body:"A UC Berkeley-led team ran randomised trials with 1,222 participants on fractions and SAT reading problems, Berkeley News reported. Those helped by ChatGPT started out more accurate, but when the AI was removed their accuracy fell almost immediately and they skipped more problems; the group without AI persisted and did better by the end. 'We've built these systems to be helpful, but are they being helpful to us in a way that's actually helping us?' said researcher Brian Christian, who suggests AI should default to tutor-like replies.",next:"Whether AI companies change how their tools help students.",src:"Berkeley News",links:[{o:"Berkeley News",u:"https://news.berkeley.edu/2026/10/09/using-ai-for-just-10-minutes-erodes-your-ability-to-persist-at-hard-things/"}],loc:[37.87,-122.26,"Berkeley, California"]},
{c:"Pune",status:"Confirmed",st:"new",made:"Weekend plans: Navratri and Durga Puja in Pune.",title:"Navratri begins today: Pune traffic diversions and Durga Puja pandals",dek:"Police have announced diversions near Bhavani Mata, Tambdi Jogeshwari and Chatushrungi temples until October 20. Mahalaya fell on Saturday.",why:"Practical: the roads around major temples will be busy, and the city's Durga Puja pandals open this week.",who:"Anyone travelling in central Pune or Senapati Bapat Road this week.",ctx:"Durga Puja's main days run up to Vijaya Dashami on October 21.",body:"Pune police announced traffic diversions from October 11 to 20 around the Bhavani Mata temple, where Mahatma Phule Road is closed between Ramoshi Gate Chowk and Juna Motor Stand, and around the Tambdi Jogeshwari and Ashtabhuja temples, with conditional diversions on Senapati Bapat Road near Chatushrungi, Punekar News reported; parking is directed to the riverbed road between Tilak and Bhide bridges. Durga Puja pandals in Balewadi, Pashan, Hadapsar, Koregaon Park and Shivajinagar open this week.",next:"Vijaya Dashami on October 21.",src:"Punekar News",links:[{o:"Punekar News (traffic)",u:"https://www.punekarnews.in/pune-police-announce-traffic-diversions-for-navratri-from-october-11-to-20/"},{o:"Punekar News (Durga Puja)",u:"https://www.punekarnews.in/pune-durga-puja-2026-guide-dates-pandals-bengali-food-and-cultural-events/"}],loc:[18.50,73.87,"Bhavani Peth, Pune"]},
{c:"Maharashtra",status:"Reported",st:"new",made:"Pune's council seats are now two-way contests.",title:"Council polls: Mahayuti rebels withdraw from Pune seats",dek:"Shiv Sena's Mangesh Chivte and NCP's Pratap Mane pulled out. Voting for five seats is on October 23.",why:"Fewer rebels make it easier for the ruling alliance to hold the Pune graduates and teachers seats.",who:"Registered graduate and teacher voters in Pune division.",ctx:"Only voters on the special graduates' and teachers' rolls can vote; a regular voter ID is not enough.",body:"Shiv Sena's Mangesh Chivte withdrew from the Pune Teachers seat, saying it was 'not a retreat', and the NCP's Pratap Mane withdrew from Pune Graduates, the Free Press Journal reported. In Nagpur Graduates, former BJP MLC Anil Sole stays in the race as an independent. Voting is on October 23 and counting on October 27.",next:"Polling on October 23.",src:"Free Press Journal",links:[{o:"Free Press Journal",u:"https://www.freepressjournal.in/mumbai/maharashtra-mlc-elections-2026-mahayuti-rebels-withdraw-in-pune-bjps-anil-sole-stays-in-nagpur-graduates-race"}],loc:[18.52,73.86,"Pune"]}

explainer:{title:"What 5.54% inflation means for you",body:"Inflation measures how much prices rose over a year. At 5.54%, something that cost ₹100 last September costs about ₹105.54 now on average, but your own basket may be very different: onions more than doubled, while tomatoes and potatoes got cheaper. The RBI aims for 4%, with a tolerance band of 2% to 6%. September's figure is inside the band but well above target, and it has risen for six months in a row. That matters because the RBI raises interest rates to cool prices: it already raised the repo rate to 5.5% on October 7, and economists quoted by Reuters now expect further hikes in December and February. If your loan is linked to the repo rate, each hike adds to your EMI; fixed deposit rates tend to rise too, more slowly.",src:"National Statistics Office via Free Press Journal / Business Standard; Reuters"},

stories:[
{c:"Personal Finance",lead:1,big:1,one:1,status:"Confirmed",st:"new",made:"The number that decides whether your EMI keeps rising.",title:"Retail inflation jumps to 5.54%, a 23-month high, as food prices surge",dek:"Food inflation rose to 7.74%, with onions up 108%. Rural inflation, at 6.08%, crossed the top of the RBI's tolerance band.",why:"Rising inflation makes more RBI rate hikes likely, which pushes up EMIs on floating-rate loans.",who:"Every household, especially in rural India; borrowers; savers.",ctx:"The RBI raised its repo rate to 5.5% on October 7 and changed its stance to 'calibrated tightening'.",body:"Consumer price inflation rose to 5.54% in September from 4.83% in August, the sixth straight monthly rise and the first time it has crossed 5% under the new CPI series, the Free Press Journal reported, citing official data released on Monday. Food inflation jumped to 7.74% from 5.97%: onions rose 108%, garlic 55% and ginger 63%, while tomatoes and potatoes got cheaper. Rural inflation reached 6.08% and urban 4.88%. Tamil Nadu had the highest rate, 6.81%. A Reuters poll had expected 5.4%. 'Today's print reinforces the case for more interest rate hikes,' said Alexandra Hermann Prasad of Oxford Economics, who expects increases in December and February. Bank of Baroda's Madan Sabnavis said higher inflation was mainly due to depleted stocks ahead of the new harvest season.",next:"The RBI's December policy meeting; October inflation data in November.",src:"Free Press Journal / Business Standard / Reuters",links:[{o:"Free Press Journal",u:"https://www.freepressjournal.in/business/india-retail-inflation-rises-to-554-in-september-as-food-prices-surge"},{o:"Business Standard",u:"https://business-standard.com/economy/news/food-fuel-push-retail-inflation-to-23-month-high-of-5-54-in-september-126101200829_1.html"},{o:"Reuters (via Investing.com)",u:"https://www.investing.com/news/economy-news/india-inflation-jumps-to-554-in-september-strengthening-case-for-further-rate-hikes-4943948"}],th:"rbi",loc:[28.61,77.21,"New Delhi"]},
{c:"India",lead:1,big:2,status:"Reported",st:"upd",since:"The protest has moved from the streets to the Supreme Court.",made:"The voter-list row is now a case before the Supreme Court.",title:"Police stop INDIA bloc march near the Supreme Court; Rahul Gandhi files petition against the Election Commission",dek:"Leaders including Rahul Gandhi, Mallikarjun Kharge, Akhilesh Yadav and Tejashwi Yadav were halted at a barricade. PTI says more than 7,000 were detained in Delhi over the weekend.",why:"The case could decide how voter lists are revised before upcoming elections.",who:"Voters; opposition parties; the Election Commission.",ctx:"Chief Justice Surya Kant declined to meet opposition leaders on Sunday and told them to file a petition.",body:"Opposition leaders marched from Connaught Place towards the Supreme Court on Monday and were stopped at a barricade on Bhagwan Dass Marg, The Week and the Tribune reported. In the evening they filed a writ petition, 'Rahul Gandhi v. Election Commission of India', over alleged mass deletions in the revision of voter lists; its prayers have not yet been published. 'Delhi has been turned into a fortress,' Gandhi said. Delhi Chief Minister Rekha Gupta said 'the credibility of India's democracy cannot be made hostage to the opposition's political convenience', citing a letter from 124 former civil servants backing the Election Commission. PTI reported that more than 7,000 people were detained in Delhi over the weekend; ANI's figure was about 1,000. In Pune, about 100 protesters were detained at Goodluck Chowk on Sunday, the Free Press Journal reported.",next:"Whether the Supreme Court lists the petition for hearing.",src:"The Week / Tribune / Business Standard (PTI) / Free Press Journal",links:[{o:"The Week",u:"https://www.theweek.in/news/india/2026/10/12/anti-cec-protest-india-bloc-march-halted-rahul-gandhi-files-writ-petition-against-ec-in-supreme-court.html"},{o:"Tribune",u:"https://www.tribuneindia.com/liveblog/delhi/delhi-anti-cec-protest-live-rahul-gandhi-files-petition-in-sc-alleging-irregularities-in-sir/"},{o:"Business Standard (PTI)",u:"https://www.business-standard.com/amp/india-news/delhi-protests-cjp-abhijeet-dipke-ranka-detained-police-traffic-diversions-126101100117_1.html"},{o:"Free Press Journal",u:"https://www.freepressjournal.in/pune/pune-over-100-cjp-protesters-detained-allege-police-excesses-ground-report"}],loc:[28.62,77.24,"Supreme Court, New Delhi"]},
{c:"Pune",big:3,status:"Confirmed",st:"upd",since:"The protest ended on Sunday night after 11 days.",made:"Pune's 11-day student protest ends with a compromise.",title:"MPSC protest ends: judicial inquiry set up, chairman goes on leave",dek:"Former judge Dilip Bhosale will lead the inquiry, with IAS officer Tukaram Mundhe as secretary. MPSC chairman Vivek Bhimanwar goes on leave until it ends.",why:"Students won an inquiry and a timeline, but not the resignation they demanded.",who:"MPSC aspirants; commuters around S M Joshi Bridge, which can reopen.",ctx:"The protest began on October 1 over alleged paper leaks; the Bombay High Court had asked the state to answer the students' grievances.",body:"MPSC aspirants called off their sit-in near S M Joshi Bridge on Sunday night after the state set up an inquiry panel chaired by former judge Dilip Bhosale, with Tukaram Mundhe as secretary, The Week and PTI reported. The Free Press Journal said the panel has 60 days and can recommend removal under Article 317. Bhimanwar said he would go on leave during the inquiry 'instead of continuing to serve in the post'. The state also committed to withdrawing cases against some protesters and filling about 70,000 posts over three years, FPJ reported. Minister Shivendrasinhraje Bhosale said the government would reform the MPSC's functioning. Aspirants' representative Vivekanand Patil said the protest was called off 'for now'.",next:"The inquiry's report, due within 60 days.",src:"The Week / PTI / Free Press Journal",links:[{o:"The Week",u:"https://www.theweek.in/news/india/2026/10/12/maharashtra-mpsc-protest-called-off-pune-tukaram-mundhe.html"},{o:"Daily Jagran (PTI)",u:"https://www.thedailyjagran.com/india/news/mpsc-aspirants-call-off-10day-agitation-as-ias-tukaram-mundhe-inducted-into-probe-panel-10332361"},{o:"Free Press Journal",u:"https://www.freepressjournal.in/education/mpsc-protest-in-pune-continues-as-govt-proposes-60-day-probe-into-exam-irregularities-rohit-pawar-insists-on-chairmans-resignation"}],th:"mpsc",loc:[18.513,73.846,"S M Joshi Bridge, Pune"]},
{c:"Economy",big:4,status:"Confirmed",st:"new",made:"A Nobel for the ideas behind every central bank's playbook.",title:"Economics Nobel goes to Robert Hall and Michael Woodford",dek:"The two US economists were honoured for work on how monetary and fiscal policy can steady swings in the economy.",why:"Their models underpin how central banks, including the RBI, decide interest rates when inflation or recession threatens.",who:"Economics students; anyone affected by interest rates.",ctx:"Older models built on statistical links between economic numbers broke down during the 1970s oil shocks.",body:"The Royal Swedish Academy of Sciences awarded the 2026 economics prize to Robert Hall and Michael Woodford, Al Jazeera reported. Their models are grounded in how households and businesses behave, rather than in statistical links between big economic numbers. Committee chair John Hassler said their work provides 'a stable theoretical foundation for the models that are now used by central banks and governments around the world'. The prize, formally the Sveriges Riksbank Prize in Economic Sciences in Memory of Alfred Nobel, was created by Sweden's central bank in 1969.",next:"The Nobel ceremonies on December 10.",src:"Al Jazeera",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/12/nobel-economics-prize-awarded-to-robert-hall-and-michael-%E2%81%A0woodford"}],loc:[59.33,18.07,"Stockholm, Sweden"]},
{c:"Geopolitics",big:5,status:"Reported",st:"dev",since:"Iran has rejected the US reply, and Riyadh's airport was hit a second time.",made:"Diplomacy stalls as the war spreads to Saudi Arabia.",title:"Iran calls US reply on Hormuz 'insufficient'; Riyadh airport hit again",dek:"Another strike on Riyadh's airport killed one person on Sunday. Trump says the US may join Saudi strikes on the Houthis.",why:"Stalled talks keep the Strait of Hormuz, India's main oil route, effectively closed.",who:"Indians in the Gulf; Indian refiners; fuel buyers.",ctx:"Saturday's strike on the same airport killed 12 and wounded 309.",body:"Mohsen Rezaei, a senior Iranian security official, said the US response to Iran's conditions for reopening the Strait of Hormuz was 'insufficient' and that Iran was 'no longer in the process of responding to the Americans', CBS News reported, citing Reuters. On Sunday another projectile hit a passenger terminal at Riyadh's airport, killing one person and injuring 11; Dammam's airport was also attacked. Saudi Arabia, Turkey, Pakistan and Egypt called the Houthi attacks a 'dangerous escalation'. Iran's foreign minister urged Saudi Arabia to seek a political solution. The Pentagon revised the US war toll to 21 dead and 865 wounded, The New York Times reported.",next:"Whether the US joins strikes on the Houthis.",src:"CBS News / Al Jazeera / Just Security (Reuters, AP, NYT)",links:[{o:"CBS News",u:"https://www.cbsnews.com/live-updates/iran-war-trump-us-elections-saudi-arabia-yemen-houthis/"},{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/12/irans-fm-urges-diplomacy-in-call-with-saudi-counterpart"},{o:"Just Security roundup",u:"https://www.justsecurity.org/160381/early-edition-october-12-2026/"}],th:"iran",loc:[26.57,56.25,"Strait of Hormuz"]},
{c:"Markets",status:"Confirmed",st:"upd",since:"The RBI's dollar window for oil companies took effect on Monday.",made:"A good day for the rupee, a weak one for shares.",title:"Rupee posts biggest gain in six months as RBI measures kick in; Sensex falls",dek:"The rupee rose 96 paise to 95.77 to the dollar. The Sensex fell 547.65 points to 71,924.68 and the Nifty closed at 22,363.35.",why:"A stronger rupee makes imports, foreign travel and study abroad slightly cheaper.",who:"Anyone paying in dollars; investors.",ctx:"The rupee had fallen more than 7% this year before the RBI stepped in.",body:"The rupee closed at 95.77 to the dollar on Monday, up 96 paise, its biggest one-day gain in six months, as the RBI's measures took effect, the Free Press Journal reported. The Sensex fell 547.65 points, or 0.76%, and the Nifty 50 fell 157.10 points to 22,363.35, Business Standard reported, on higher government bond yields, foreign selling and Middle East tensions. Small-cap shares rose 1.42%. Brent fell about 1.5% to around $103. After the market closed, HCLTech reported a 21% rise in quarterly profit and announced a partnership with Anthropic.",next:"The September quarter results season.",src:"Free Press Journal / Business Standard / HDFC Sky / Business Today",links:[{o:"Free Press Journal",u:"https://www.freepressjournal.in/business/rupee-surges-96-paise-against-us-dollar-heres-what-triggered-its-biggest-one-day-rally-in-six-months"},{o:"Business Standard",u:"https://www.business-standard.com/markets/news/stock-market-live-october-12-bse-sensex-today-nifty50-gift-nifty-crude-oil-prices-q2-results-today-126101200057_1.html"},{o:"Business Today",u:"https://www.businesstoday.in/markets/stocks/story/hcltech-q2-results-profit-up-21-at-rs-5132-crore-announces-rs-12-per-share-dividend-561080-2026-10-12"}],th:"markets",loc:[18.93,72.835,"Dalal Street, Mumbai"]},
{c:"World",status:"Reported",st:"dev",made:"A ceasefire announced by one side's ally, and not yet confirmed by either side.",title:"Trump announces an 'energy ceasefire' in Ukraine; Kremlin says it has nothing to say",dek:"Russian attacks killed at least 10 people across Ukraine as Kharkiv's power plant was hit. Trump said Ukraine should 'get a new leader'.",why:"A halt to strikes on power plants would matter enormously to Ukrainians before winter, but neither side has confirmed it.",who:"Ukrainians; Indian students in Ukraine.",ctx:"Ukraine has been striking Russian refineries, and Russia Ukraine's power grid.",body:"Trump posted that there was an 'ENERGY CEASEFIRE' in the war and that 'both parties have agreed', the Kyiv Independent reported; Kyiv said it had no information, and Kremlin spokesman Dmitry Peskov said Russia would comment 'as soon as we have anything to say'. Russian attacks killed at least 10 and injured 73 across Ukraine, including in Kharkiv, where a power plant was hit after the announcement. Trump said Ukrainians should 'get a new leader who can make a deal'; Britain, Germany and Poland reaffirmed their support for Zelenskyy. The EU adopted its largest-ever Russia sanctions list.",next:"EU accession talks for Ukraine open in Luxembourg on Tuesday.",src:"Kyiv Independent / Just Security",links:[{o:"Kyiv Independent",u:"https://kyivindependent.com/kremlin-has-nothing-to-say-on-trumps-energy-ceasefire-rejects-zelenskys-truce-proposal-2/"},{o:"Kyiv Independent (attacks)",u:"https://kyivindependent.com/russian-attacks-kill-at-least-10-injure-73-across-ukraine-as-moscow-targets-energy-infrastructure-in-several-oblasts/"}],th:"ukraine",loc:[49.99,36.23,"Kharkiv, Ukraine"]},
{c:"Pune",status:"Reported",st:"upd",since:"Four days to go and still no schedule.",made:"Practical: the decision could come any day.",title:"Pune water cut: PMC decision expected this week",dek:"Commissioner Naval Kishore Ram meets irrigation officials, then the mayor and party leaders. A one-day-a-week shutdown is the main option.",why:"You will need to store water the evening before your area's shutdown day.",who:"Every household and business on PMC water.",ctx:"The state has ordered a 10% cut from October 16; Punekar News says Pune's could start a day earlier if approved.",body:"PMC has not yet announced a schedule or list of areas, Punekar News and Pune Pulse reported on Monday; a decision is expected after the commissioner's meetings this week. Shutting supply one day a week would save about 14%. The Khadakwasla dams hold 26.16 TMC, about 90% of capacity, and the irrigation department wants stocks to last until August 2027.",next:"PMC's schedule, which we will publish as soon as it is out.",src:"Punekar News / Pune Pulse",links:[{o:"Punekar News",u:"https://www.punekarnews.in/10-water-cut-pune-municipal-corporation-likely-to-take-a-call-today-or-tomorrow/"},{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-pmc-likely-to-decide-on-10-water-cut-this-week/"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"Sports",status:"Confirmed",st:"new",made:"India bounce back after Ranchi.",title:"India beat West Indies by 14 runs in Indore to lead the T20I series 2-1",dek:"Abhishek Sharma hit 69 off 30 balls and Arshdeep Singh took three wickets.",why:"India recovered from conceding a record chase two days earlier.",who:"Cricket fans.",ctx:"The West Indies chased 250 to win the second T20I in Ranchi.",body:"India made 223 all out and held the West Indies to 209 for 7 in the third T20I in Indore on Sunday, Outlook India reported. Abhishek Sharma scored 69 off 30 balls and Ishan Kishan 37 off 18; Arshdeep Singh took three wickets and Naman Dhir two.",next:"The fourth T20I on Wednesday.",src:"Outlook India",links:[{o:"Outlook India",u:"https://www.outlookindia.com/sports/cricket/india-vs-west-indies-3rd-t20i-live-score-updates-wi-tour-2026"}],loc:[22.72,75.88,"Holkar Stadium, Indore"]},
{c:"World",status:"Reported",st:"new",made:"A major political crisis in India's neighbour.",title:"Pakistan puts Khyber Pakhtunkhwa under emergency and governor's rule",dek:"The government cited terrorism; Imran Khan's PTI, which ran the province, called it 'an undemocratic attempt'.",why:"Instability on India's western border affects regional security.",who:"People in Khyber Pakhtunkhwa; the wider region.",ctx:"Pakistan has recorded more attacks in the first nine months of 2026 than in all of 2025, according to the PICSS think tank.",body:"President Asif Ali Zardari signed the proclamation on Prime Minister Shehbaz Sharif's advice, handing the province to Governor Faisal Karim Kundi, Al Jazeera reported. The PICSS think tank counted 1,232 attacks nationwide in the first nine months of 2026, against 1,066 in all of 2025. Parliament must approve the move within 10 days.",next:"Parliament's vote by October 21.",src:"Al Jazeera",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/12/what-do-emergency-and-governor-rule-in-pakistans-khyber-pakhtunkhwa-mean"}],loc:[34.01,71.58,"Peshawar, Pakistan"]}
]},

explainer:{title:"Thursday with no water: how to plan",body:"From October 15, PMC will stop supply across the city every Thursday. Fill what you need for a day on Wednesday evening, but don't over-store: PMC's guidelines ask people not to keep more water than they need, and to stop overhead tanks from overflowing. Reuse clean greywater for cleaning and gardens. Washing cars with drinking water is banned, vehicle-washing centres must shut, and unauthorised connections can lead to criminal cases. Report leaks to PMC on 1800-1030-222 or WhatsApp 9689900002.",src:"Pune Pulse / Punekar News (PMC notice)"},

stories:[
{c:"Pune",lead:1,big:1,one:1,status:"Confirmed",st:"upd",since:"After a week of waiting, PMC has named the day.",made:"Every household in Pune needs to plan around this.",title:"Pune to go without water every Thursday from October 15",dek:"The PMC will suspend supply across the city once a week. The Khadakwasla dams held 26.22 TMC on October 12, below a normal year.",why:"You will need to store water every Wednesday; the cut could last until the next monsoon.",who:"Every household, housing society and business on PMC water.",ctx:"The state ordered local bodies to cut water use by at least 10% from October 16 so stocks last until August 31, 2027, citing El Niño.",body:"The Pune Municipal Corporation will suspend water supply across the city every Thursday from October 15, Additional Commissioner Pavneet Kaur said, Punekar News and Pune Pulse reported. The Khadakwasla dam chain held 26.22 TMC on October 12; officials also reviewed the Bhama Askhed and Pavana dams. PMC's guidelines ask residents not to store more water than they need, to stop tanks overflowing and to reuse greywater; drinking water may not be used for construction, car washing, swimming pools or gardens, vehicle-washing centres must close, and unauthorised connections may face criminal cases. Changes to the schedule will be posted on PMC's website. Complaints: 1800-1030-222 or WhatsApp 9689900002.",next:"The first no-water day this Thursday.",src:"Pune Pulse / Punekar News",links:[{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-pmc-announces-weekly-thursday-water-cut-from-october-15-issues-water-saving-guidelines/"},{o:"Punekar News",u:"https://www.punekarnews.in/pune-to-face-weekly-water-cuts-from-october-15-pmc-urges-10-reduction-in-water-use/"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"India",big:2,status:"Developing",st:"upd",since:"The petition filed on Monday evening is expected before the court today.",made:"The voter-list fight moves from the streets into the courtroom.",title:"Supreme Court to take up opposition's petition against the Election Commission",dek:"Rahul Gandhi and ten other opposition leaders want the voter-list revision suspended in every state and an audit led by a retired Supreme Court judge.",why:"The court's response could decide how voter lists are revised before upcoming state elections.",who:"Voters; opposition parties; the Election Commission.",ctx:"Chief Justice Surya Kant declined to meet opposition leaders and said they could approach the court on its judicial side.",body:"The petition, filed on Monday, names the Election Commission, Chief Election Commissioner Gyanesh Kumar and Election Commissioners Sukhbir Singh Sandhu and Vivek Joshi, LiveLaw reported. It asks for the Commission's records on the revision, a review of whether its decisions were lawful, booth-wise lists of deleted voters with reasons, no deletions without notice and a hearing, and suspension of the exercise in all states while the case is heard. LiveLaw said similar matters were listed for Tuesday and the Chief Justice indicated the petition could be taken up with them. At Monday's march, Gandhi told Kumar: 'You will not survive as CEC.' The Election Commission and the BJP have denied the opposition's allegations. Separately, the Delhi High Court is due to hear the Youth Congress's plea for permission to protest today.",next:"Whether the court issues notice or orders a pause.",src:"LiveLaw / India TV",links:[{o:"LiveLaw",u:"https://www.livelaw.in/top-stories/opposition-leader-rahul-gandhi-files-writ-petition-in-supreme-court-against-eci-over-sir-process-554285"},{o:"India TV",u:"https://www.indiatvnews.com/news/india/rahul-gandhi-india-bloc-leaders-march-to-supreme-court-as-legal-team-files-petition-against-ec-gyanesh-kumar-over-sir-latest-updates-2026-10-12-1056758"},{o:"LiveLaw (Youth Congress plea)",u:"https://www.livelaw.in/high-court/delhi-high-court/delhi-police-seeks-time-to-respond-to-indian-youth-congress-plea-over-denial-of-permission-to-protest-against-cec-gyanesh-kumar-554210"}],loc:[28.62,77.24,"Supreme Court, New Delhi"]},
{c:"Geopolitics",big:3,status:"Reported",st:"dev",since:"The airport closure has been extended, and oil is back above $105.",made:"The war's pressure on oil is not easing.",title:"Riyadh airport stays shut after Houthi strikes; Brent back above $105",dek:"Saudi officials say at least 13 people were killed in Saturday's strike. The Houthis claimed another missile attack on the airport on Monday.",why:"Higher oil feeds India's inflation and weakens the rupee.",who:"Indians in Saudi Arabia and the Gulf; travellers; fuel buyers.",ctx:"Trump said on Saturday the US 'may' join strikes on the Houthis; no decision has been announced.",body:"Saudi Arabia's aviation authority extended the closure of Riyadh's King Khalid International Airport, CBS News reported. Officials said at least 13 people were killed and more than 300 wounded on Saturday and are investigating why air defences failed. On Monday the Saudi-led coalition said it intercepted a missile aimed at Riyadh, while the Houthis claimed a 'precise' strike on the airport. Energy Minister Prince Abdulaziz bin Salman said 'our response must be equally serious.' Iran's Revolutionary Guards claimed strikes on three supertankers in two days; the UK's maritime agency reported projectiles hitting vessels on Sunday. Brent rose above $105 a barrel, a two-week high. Delta delayed its planned Atlanta-Riyadh flights to March 2027.",next:"Whether the US joins strikes on the Houthis.",src:"CBS News",links:[{o:"CBS News",u:"https://www.cbsnews.com/live-updates/iran-war-us-trump-saudi-arabia-houthi/"}],th:"iran",loc:[24.96,46.70,"King Khalid Airport, Riyadh"]},
{c:"Personal Finance",big:4,status:"Reported",st:"upd",since:"After September's 5.54%, economists see worse to come.",made:"Why your EMI may not have stopped rising.",title:"Economists warn inflation could cross 6% as food prices climb",dek:"Kotak's Upasna Bhardwaj expects inflation above 6% in the next few months; India Ratings sees October near 6%.",why:"Above 6%, inflation would breach the RBI's tolerance band, making more rate hikes, and higher EMIs, likely.",who:"Borrowers on floating-rate loans; savers; households facing higher food bills.",ctx:"September's retail inflation was 5.54%, a 23-month high, with rural inflation already at 6.08%.",body:"Kotak Mahindra Bank's Upasna Bhardwaj expects retail inflation to rise above 6% in the next few months, and India Ratings' Devendra Pant expects October's reading to be around 6%, Business Standard reported. Oxford Economics' Alexandra Hermann Prasad said September's data 'reinforces the case for more interest rate hikes' and expects increases in December and February, Reuters reported. Bank of Baroda's Madan Sabnavis said the rise was mainly due to depleted stocks before the new harvest.",next:"The RBI's minutes on October 21 and its December meeting.",src:"Business Standard / Reuters",links:[{o:"Business Standard",u:"https://business-standard.com/economy/news/food-fuel-push-retail-inflation-to-23-month-high-of-5-54-in-september-126101200829_1.html"},{o:"Reuters (via Investing.com)",u:"https://www.investing.com/news/economy-news/india-inflation-jumps-to-554-in-september-strengthening-case-for-further-rate-hikes-4943948"}],th:"rbi",loc:[18.93,72.83,"Mumbai"]},
{c:"World",big:5,status:"Reported",st:"dev",made:"Europe moves Ukraine closer while Washington leans on it.",title:"EU set to open new accession talks with Ukraine as US presses Kyiv",dek:"Two negotiation clusters for Ukraine and Moldova are expected to open in Luxembourg today. The FT reports the US threatened to cut intelligence sharing over Ukraine's strikes on refineries.",why:"EU membership talks are a long-term lifeline for Ukraine at a moment of strain with the US.",who:"Ukrainians; Indian students and businesses in Ukraine and Europe.",ctx:"Trump announced an 'energy ceasefire' on Sunday; Russia has not confirmed it, and Kharkiv's power plant was hit afterwards.",body:"EU accession clusters for Ukraine and Moldova are expected to open in Luxembourg on October 13, the Kyiv Independent reported. The Financial Times reported that the US threatened to halt weapons procurement and cut intelligence sharing to pressure Ukraine over its strikes on Russian refineries, according to Just Security's roundup. Zelenskyy said Ukraine would stop such strikes only if Russia stopped hitting its power grid. The EU has adopted its largest-ever Russia sanctions list, nearly 1,600 listings.",next:"The outcome of today's EU meeting.",src:"Kyiv Independent / Just Security (FT, Reuters)",links:[{o:"Kyiv Independent",u:"https://kyivindependent.com/kremlin-has-nothing-to-say-on-trumps-energy-ceasefire-rejects-zelenskys-truce-proposal-2/"},{o:"Just Security roundup",u:"https://www.justsecurity.org/160381/early-edition-october-12-2026/"}],th:"ukraine",loc:[49.61,6.13,"Luxembourg"]},
{c:"Cybersecurity",status:"Reported",st:"new",made:"A hack of the FBI itself leads to an arrest.",title:"FBI arrests Canadian cybersecurity expert over hack of its own systems",dek:"Edward Dubrovsky was arrested over the ShinyHunters hacking group's breach of FBI systems, The New York Times reported.",why:"Even top law-enforcement agencies are being breached; the same groups target companies that hold your data.",who:"Anyone whose data sits with large organisations.",ctx:"ShinyHunters is a hacking group linked to large data breaches.",body:"The FBI arrested Canadian cybersecurity expert Edward Dubrovsky in connection with the ShinyHunters hack of FBI systems, The New York Times reported, according to Just Security's roundup.",next:"Charges and any court appearance.",src:"NYT, via Just Security",links:[{o:"Just Security roundup (NYT)",u:"https://www.justsecurity.org/160381/early-edition-october-12-2026/"}],loc:[38.89,-77.02,"Washington, US"]},
{c:"World",status:"Reported",st:"new",made:"The fallout from this year's Peace Prize.",title:"US sanctions the International Criminal Court; Trump calls Pillay's Nobel a 'stain'",dek:"Secretary of State Marco Rubio announced sanctions with a six-month grace period. Trump called the Peace Prize to Navi Pillay an 'indelible stain on Norway'.",why:"It deepens a clash between Washington and international courts, the cause this year's Peace Prize honoured.",who:"International courts; human-rights groups.",ctx:"Navi Pillay, a South African judge of Indian origin, won the Nobel Peace Prize on Friday.",body:"Rubio announced sanctions on the International Criminal Court with a six-month grace period, and Trump criticised the Peace Prize awarded to Pillay, The New York Times reported, according to Just Security's roundup.",next:"Whether European governments respond.",src:"NYT, via Just Security",links:[{o:"Just Security roundup (NYT)",u:"https://www.justsecurity.org/160381/early-edition-october-12-2026/"}],loc:[52.10,4.27,"The Hague, Netherlands"]},
{c:"Sports",status:"Confirmed",st:"new",made:"India can seal the series tomorrow.",title:"India eye series win in Hyderabad T20I on Wednesday",dek:"India lead the five-match series 2-1 after beating the West Indies by 14 runs in Indore.",why:"A win in Hyderabad would settle the series before the last match in Bengaluru.",who:"Cricket fans.",ctx:"The West Indies won the second match in Ranchi with their highest-ever T20I chase.",body:"India lead the series 2-1. The fourth T20I is in Hyderabad on Wednesday, October 14, and the fifth in Bengaluru on October 17, the ICC said.",next:"The match on Wednesday.",src:"ICC / Outlook India",links:[{o:"ICC",u:"https://www.icc-cricket.com/news/hope-rutherford-power-west-indies-to-record-chase"},{o:"Outlook India",u:"https://www.outlookindia.com/sports/cricket/india-vs-west-indies-3rd-t20i-live-score-updates-wi-tour-2026"}],loc:[17.41,78.55,"Hyderabad"]}
]},

explainer:{title:"What are EU 'accession clusters'?",body:"A country joining the EU has to bring its laws in line with the EU's in more than 30 policy areas, called chapters. Since 2020 the EU groups these chapters into six clusters, so talks move a whole cluster at a time. 'Fundamentals', covering the rule of law and the economy, opens first and closes last. Opening a cluster starts negotiations; it does not mean the country has met the standards. All 27 members must agree at each step, which is why Hungary could block Ukraine until this week. Ukraine now has four clusters open; agriculture and transport, the most sensitive for some EU farmers and hauliers, remain.",src:"Council of the EU / Kyiv Independent"},

stories:[
{c:"Markets",lead:1,big:1,one:1,status:"Confirmed",st:"upd",since:"Monday's 548-point fall has been more than erased.",made:"A strong set of IT results lifted the whole market.",title:"Sensex has its best day in four months as IT stocks surge",dek:"The Sensex rose 1,109 points to 73,033.78 and the Nifty 1.6% to 22,721.95, led by HCLTech's results. The rupee gained for a third day.",why:"IT stocks are a big part of most index funds and SIPs; a firmer rupee keeps imported fuel and gadgets from getting dearer.",who:"Investors and SIP holders; IT employees; anyone paying in dollars.",ctx:"The Nifty IT index is still down 21.2% this year, and foreign investors have sold Indian shares for 12 straight sessions.",body:"The Sensex rose 1,109.10 points, or 1.54%, to 73,033.78 on Tuesday, PTI reported; The Week called it the index's best day in four months. The Nifty gained 358.60 points to 22,721.95, and 15 of 16 sector indices rose. The Nifty IT index jumped 5.2% after HCLTech reported a 21.18% rise in quarterly profit to ₹5,132 crore; HCLTech rose 8.28%, TCS 6.59% and Infosys 4.44%, The Week reported. Geojit's Vinod Nair said 'stronger-than-expected technology earnings boosted confidence in corporate profit growth.' The rupee rose about 41 paise to 95.37 to the dollar, its third gain in a row, helped by the RBI's curbs on speculative trades and a separate dollar window for oil companies, PTI said. Brent fell 1.66% to $104.6 a barrel. The same day the IMF raised its forecast for India's 2026 growth to 7%.",next:"September's wholesale inflation data today; Wipro and Tech Mahindra results this week.",src:"PTI / The Week",links:[{o:"PTI (via ETV Bharat)",u:"https://www.etvbharat.com/en/business/stock-market-on-october-13-bse-sensex-nifty50-it-stocks-enn26101301291"},{o:"The Week",u:"https://www.theweek.in/news/biz-tech/2026/10/13/indian-stock-market-rebound.html"}],th:"markets",loc:[18.93,72.83,"Dalal Street, Mumbai"]},
{c:"India",big:2,status:"Confirmed",st:"upd",since:"We said the court was due to take it up on Tuesday; it was not listed.",made:"The voter-list case is delayed by paperwork, not by a ruling.",title:"Supreme Court yet to hear opposition's petition: registry flags 14 defects",dek:"Chief Justice Surya Kant said the case will be listed once the defects are fixed. Police detained 'Cockroach' movement leaders at Jantar Mantar.",why:"The case could decide how voter lists are revised before upcoming elections; the delay is procedural.",who:"Voters; opposition parties; the Election Commission.",ctx:"Jantar Mantar was closed as a protest site on Monday; police named Ramlila Ground, Burari Ground and CBD Ground instead.",body:"The petition by Rahul Gandhi and ten other opposition leaders was not listed on Tuesday because 14 defects, including an unclear copy of Mallikarjun Kharge's ID card and illegible pages, had not been fixed, PTI reported. 'Make sure that the defects are cured,' the Chief Justice told senior advocate Gopal Sankaranarayanan. The Delhi High Court issued notice on the Youth Congress's plea for permission to protest against Chief Election Commissioner Gyanesh Kumar; Additional Solicitor General Chetan Sharma said Jantar Mantar had been de-notified following Supreme Court orders, LiveLaw reported. The next hearing there is on November 17. Police detained Cockroach Janta Party leaders Ashutosh Ranka, Saurav Das and Ajinkya Shinde and about 20 volunteers after they climbed barricades into Jantar Mantar, Al Jazeera reported. The Election Commission denies that the revision favours any party and says wrongly deleted voters can re-enrol.",next:"A Supreme Court hearing once the petition is listed.",src:"PTI / LiveLaw / Al Jazeera",links:[{o:"PTI (via Business Standard)",u:"https://www.business-standard.com/amp/india-news/rahul-gandhi-s-plea-not-listed-for-hearing-in-sc-as-defects-yet-to-be-cured-126101300613_1.html"},{o:"LiveLaw",u:"https://www.livelaw.in/high-court/delhi-high-court/delhi-high-court-issues-notice-on-indian-youth-congress-plea-to-reconsider-request-to-hold-protest-at-jantar-mantar-554490"},{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/13/police-detain-leaders-of-indias-cockroach-movement-at-new-delhi-protest"}],loc:[28.62,77.24,"Supreme Court, New Delhi"]},
{c:"Geopolitics",big:3,status:"Reported",st:"dev",since:"The Houthis have now hit Saudi oil infrastructure directly.",made:"The war on Saudi Arabia reaches its oil company.",title:"Houthi missile hits Aramco office in Dhahran; Riyadh airport shut until October 17",dek:"Saudi media reported a 'limited fire' and no injuries. The strike followed coalition attacks on oil sites in Yemen.",why:"Each attack on Saudi oil keeps Brent above $100, which feeds India's fuel and food prices.",who:"Indians working in Saudi Arabia; travellers; fuel buyers.",ctx:"Trump said the Houthis are trying to push up oil prices before the US elections; no US strikes in Yemen were reported.",body:"A ballistic missile hit a Saudi Aramco administrative building in Dhahran, in the Eastern Province; the Saudi Press Agency reported a limited fire and no injuries, Al Jazeera reported. It came after the Saudi-led coalition struck oil facilities in Sanaa, Dhamar and Saada, CBS News reported. Debris from two intercepted missiles injured four people and damaged 15 homes in Riyadh. Houthi spokesman Yahya Saree called Aramco sites a 'legitimate target'. Riyadh's King Khalid airport will stay closed through October 17, CBS said. Trump wrote that the Houthis were 'purposefully trying to drive up Oil Prices, probably prior to the US Elections.' In the Strait of Hormuz, Britain's maritime agency said a tanker and a container ship were hit by projectiles.",next:"Whether Riyadh's airport reopens after October 17.",src:"Al Jazeera / CBS News",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/13/houthis-threaten-saudi-arabias-aramco-facilities-and-airports"},{o:"CBS News",u:"https://www.cbsnews.com/live-updates/iran-war-us-trump-saudi-arabia-houthi/"},{o:"Al Jazeera (Trump)",u:"https://www.aljazeera.com/news/2026/10/13/trump-says-houthis-trying-to-increase-oil-prices-before-us-elections"}],th:"iran",loc:[26.29,50.11,"Dhahran, Saudi Arabia"]},
{c:"Pune",big:4,status:"Confirmed",st:"upd",since:"PMC named the day on Monday; the first shutdown is tomorrow.",made:"Your reminder to fill up today.",title:"Pune's first no-water Thursday is tomorrow: store water today",dek:"Supply stops across all PMC areas for 24 hours every Thursday. Vehicle-washing centres must shut.",why:"Every household on PMC supply will go without water once a week, probably until the next monsoon.",who:"Every PMC household, housing society and business.",ctx:"The Khadakwasla dams held 26.22 TMC on October 12; the state wants stocks to last until August 31, 2027.",body:"PMC will halt supply across the city for 24 hours every Thursday from October 15, the Free Press Journal reported. Additional Municipal Commissioner Pavneet Kaur said it was 'necessary to use available water judiciously and plan properly.' Drinking water may not be used for construction, swimming pools or gardens, vehicle-washing centres must shut, and unauthorised connections face action, including possible criminal cases. Housing societies must keep their sewage treatment plants running, Pune Pulse reported. Complaints and leaks: 1800-1030-222 or WhatsApp 9689900002.",next:"Tomorrow's shutdown, and whether Friday's supply is at low pressure.",src:"Free Press Journal / Pune Pulse",links:[{o:"Free Press Journal",u:"https://www.freepressjournal.in/pune/pune-pmc-announces-thursday-water-shutdown-to-stretch-stocks-till-august-2027"},{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-pmc-issues-dos-and-donts-ahead-of-weekly-water-cut-in-pune-from-october-15/"}],th:"monsoon",loc:[18.52,73.86,"Pune"]},
{c:"World",big:5,status:"Confirmed",st:"upd",since:"The meeting we flagged yesterday delivered what was expected.",made:"Ukraine moves a step closer to the EU.",title:"EU opens two more membership chapters for Ukraine and Moldova",dek:"Four of the six negotiation clusters are now open after Hungary lifted its block. Late on Tuesday a Russian missile hit a residential building in Kyiv.",why:"Membership talks anchor Ukraine to Europe as its ties with Washington are strained.",who:"Ukrainians and Moldovans; Indian students and businesses in Europe.",ctx:"Ukraine passed a law on October 12 strengthening the rights of its Hungarian-speaking minority, which ended Hungary's block.",body:"EU ministers in Luxembourg opened the clusters on the internal market and on competitiveness and inclusive growth for both countries, the Council of the EU said; the first two opened in June and July. The remaining two, agriculture and transport, are the most sensitive for some EU members, the Kyiv Independent reported. 'Behind these technical names will be real benefits for Ukrainians,' Enlargement Commissioner Marta Kos said. Ireland's Thomas Byrne, whose country holds the EU presidency, called it 'another milestone on Ukraine's EU membership journey.' Late on Tuesday a Russian missile hit a nine-storey residential building in Kyiv's Desnianskyi district, the Kyiv Independent reported; Ukraine's Air Force said it had received no warning information from partners.",next:"Ireland aims to open the last two clusters before its presidency ends in December.",src:"Council of the EU / Kyiv Independent",links:[{o:"Council of the EU",u:"https://www.consilium.europa.eu/en/meetings/international-ministerial-meetings/2026/10/13/ukraine/"},{o:"Kyiv Independent",u:"https://kyivindependent.com/ukraine-advances-eu-membership-bid-with-4-of-6-integration-to-do-lists-unlocked/"}],th:"ukraine",loc:[49.61,6.13,"Luxembourg"]},
{c:"World",status:"Confirmed",st:"new",made:"The Pope's health becomes world news.",title:"Pope Leo has lung cancer; surgery 'successful', Vatican says",dek:"Doctors removed the lower lobe of his right lung at Rome's Gemelli hospital. His audiences are cancelled until October 20.",why:"The head of the Catholic Church, including India's Catholics, will be away from public duties for now.",who:"Catholics worldwide.",ctx:"Leo XIV, 71, is the first pope from the United States.",body:"Pope Leo XIV was diagnosed with lung adenocarcinoma after a 90-minute operation that removed the lower lobe of his right lung, Al Jazeera reported. The Vatican said the surgery 'was successful, and there were no complications.' Chemotherapy is not being discussed for now, pending further tests. He still intends to tour Latin America from November 6 to 17.",next:"Further test results.",src:"Al Jazeera",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/13/pope-leo-diagnosed-with-cancer-after-surgery-to-remove-part-of-lung"}],loc:[41.90,12.45,"Vatican City"]},
{c:"Space",status:"Confirmed",st:"new",made:"The space station gets its last power upgrade.",title:"SpaceX launches the last of the space station's new solar arrays",dek:"The cargo mission carries more than 6,300 pounds of supplies and science and is due to dock on Thursday.",why:"Each new array wing produces more than 20 kilowatts, extending the station's power for its remaining research.",who:"Space researchers; students following spaceflight.",ctx:"This is the fourth and final pair of the upgraded arrays.",body:"A Falcon 9 lifted off from Cape Canaveral at 4:03 pm IST on Tuesday carrying NASA's CRS-35 cargo mission, Spaceflight Now reported. It carries two Redwire ROSA solar array wings, each producing more than 20 kilowatts for over ten years, and equipment for more than 40 studies, including one on unconventional glass. Docking at the Harmony module is set for Thursday; NASA astronaut Anil Menon will monitor the arrival.",next:"Docking on Thursday.",src:"Spaceflight Now",links:[{o:"Spaceflight Now",u:"https://spaceflightnow.com/2026/10/13/spacex-launches-nasa-science-and-cargo-to-the-international-space-station/"}],loc:[28.49,-80.58,"Cape Canaveral, US"]},
{c:"Maharashtra",status:"Confirmed",st:"upd",since:"The protest at S M Joshi Bridge has ended.",made:"The MPSC fight moves from the street to an inquiry.",title:"MPSC aspirants end Pune protest as five-member inquiry panel is named",dek:"Retired judge Dilip Bhosale chairs the panel, with Tukaram Mundhe as secretary. MPSC chairman Vivek Bhimanwar has gone on leave.",why:"The inquiry will shape how state recruitment exams are run for lakhs of aspirants.",who:"MPSC aspirants, many of them in Pune.",ctx:"Minister Shivendraraje Bhosale announced the panel on Sunday after meeting aspirants in Pune.",body:"The panel will examine alleged paper leaks and the tenures of present and past MPSC chairpersons and members, PTI reported; if it finds misconduct by the chairperson, it can recommend action to the President under Article 317. Its other members are IPS officer Laxmi Gautam, former IAS officer Ganesh Patil and retired judge P D Naik. Aspirants ended their 10-day agitation at S M Joshi Bridge. NCP (SP)'s Rohit Pawar said: 'We hope that the committee will have the freedom to work properly.'",next:"The panel's first steps.",src:"PTI",links:[{o:"PTI (via ETV Bharat)",u:"https://www.etvbharat.com/en/state/panel-on-mpsc-to-probe-commissions-present-past-chairpersons-and-members-enn26101300797"}],th:"mpsc",loc:[18.51,73.84,"S M Joshi Bridge, Pune"]},
{c:"Sports",status:"Confirmed",st:"new",made:"India can seal the T20I series today; badminton starts badly.",title:"India meet West Indies in Hyderabad today; Sindhu and Lakshya out of Denmark Open",dek:"India lead the T20I series 2-1. In Odense, PV Sindhu and Lakshya Sen lost in the first round.",why:"A win in Hyderabad settles the series before Saturday's final match.",who:"Cricket and badminton fans.",ctx:"India beat the West Indies by 14 runs in Indore on Sunday.",body:"India play the fourth T20I in Hyderabad today, leading 2-1. At the Denmark Open, PV Sindhu lost to Germany's Yvonne Li 21-13, 23-25, 19-21, and Lakshya Sen lost to Chou Tien-chen of Chinese Taipei in three games, the Free Press Journal reported. Kidambi Srikanth and Tanvi Sharma reached the second round.",next:"Today's match; Srikanth in round two.",src:"Free Press Journal / Public TV",links:[{o:"Free Press Journal",u:"https://www.freepressjournal.in/sports/denmark-open-2026-indias-pv-sindhu-and-lakshya-sen-suffer-first-round-exits-after-tough-three-game-battles-in-womens-and-mens-singles"},{o:"Public TV",u:"https://english.publictv.in/denmark-open-pv-sindhu-lakshya-sen-suffer-first-round-exits-srikanth-tanvi-advance/"}],loc:[17.41,78.55,"Hyderabad"]}
]},

explainer:{title:"Wholesale and retail inflation: what's the difference?",body:"Wholesale inflation (WPI) tracks prices that producers and traders pay for goods in bulk: fuel, metals, chemicals and farm produce. It leaves out services. Retail inflation (CPI) tracks what households pay, including food, rent, transport and services. The RBI targets retail inflation at 4%, with a tolerance band of 2% to 6%. Wholesale inflation still matters because higher costs for companies usually show up in shop prices some months later. September's retail figure was 5.54%; a wholesale figure of 11.39% suggests more pressure ahead.",src:"ANI / RBI"},

stories:[
{c:"Pune",lead:1,big:1,one:1,status:"Confirmed",st:"upd",since:"The shutdown announced on Monday starts today.",made:"Today is the first test of Pune's water plan.",title:"No water across Pune today in the first weekly shutdown",dek:"Supply is off for 24 hours across all PMC areas. PMC expects the weekly cut to save about 3.21 TMC a year.",why:"Use what you stored; supply may come at low pressure on Friday, and the cut is planned to continue until the next monsoon.",who:"Every household, housing society and business on PMC water.",ctx:"The state ordered at least a 10% cut in water use from October 16 so dam stocks last until August 31, 2027.",body:"Water supply is suspended across Pune Municipal Corporation limits for 24 hours today, the first of the weekly Thursday shutdowns, Punekar News reported. PMC expects the cut to save about 3.21 TMC a year, roughly 10% of use; the city draws about 1,750 million litres a day on average, water supply head Nandkishor Jagtap said. PMC has asked the state for 21.34 TMC a year. Supply may come at low pressure on Fridays, Lokshahi reported. Vehicle-washing centres must stay shut, and drinking water may not be used for construction, pools or gardens. Complaints: 1800-1030-222 or WhatsApp 9689900002.",next:"Friday's supply, and whether PMC changes the plan.",src:"Punekar News / Lokshahi",links:[{o:"Punekar News",u:"https://www.punekarnews.in/weekly-one-day-water-cut-in-pune-starts-today-pmc-expects-to-save-3-21-tmc/"},{o:"Lokshahi",u:"https://english.lokshahi.com/maharashtra/water-supply-in-pune-to-remain-shut-every-thursday-starting-today-12677833/amp"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"Personal Finance",big:2,status:"Confirmed",st:"new",made:"Price pressure is building before it reaches shops.",title:"Wholesale inflation jumps to 11.39% as fuel costs soar",dek:"Fuel and power prices rose 25.85% from a year earlier. The Sensex fell 252 points as bond yields rose.",why:"Factory and fuel costs reach shop prices later; with retail inflation near 6%, more RBI rate hikes, and higher EMIs, become likelier.",who:"Borrowers on floating-rate loans; households; businesses that buy fuel and raw materials.",ctx:"Retail inflation was 5.54% in September, a 23-month high.",body:"Wholesale inflation rose to 11.39% in September from 9.92% in August, government data showed, ANI reported. Fuel and power inflation was 25.85%, manufactured products 9.76% and food 8.66%. The Sensex fell 251.89 points to 72,781.89 and the Nifty 99.25 points to 22,622.70, PTI reported; Geojit's Vinod Nair said 'a hotter-than-expected domestic WPI print pushed bond yields higher.' The 10-year government bond yield rose to 7.40%, Business Standard reported. The rupee gained again, closing at 95.16 to the dollar, and RBI Governor Sanjay Malhotra defended last weekend's curbs on currency speculation.",next:"The RBI's minutes on October 21.",src:"ANI / PTI / Business Standard",links:[{o:"ANI (via The Tribune)",u:"https://www.tribuneindia.com/news/business/wpi-inflation-climbs-to-11-39-in-september-from-9-92-in-august"},{o:"PTI (via The Tribune)",u:"https://www.tribuneindia.com/news/business/sensex-nifty-close-lower-as-rising-inflation-and-crude-oil-prices-weigh-on-sentiment/"},{o:"Business Standard",u:"https://www.business-standard.com/amp/finance/news/rupee-gains-for-third-straight-session-closes-at-95-16-on-rbi-support-126101401142_1.html"}],th:"rbi",loc:[18.93,72.83,"Mumbai"]},
{c:"Geopolitics",big:3,status:"Reported",st:"dev",since:"Attacks on shipping are at their highest this month.",made:"The world's key oil route is getting more dangerous.",title:"Attacks on ships in Hormuz surge; a container ship sinks",dek:"Britain's maritime agency logged 15 attacks from October 6 to 14. All 21 crew of the Singapore-flagged GFS Pride were rescued.",why:"Oil moving through Hormuz fell to 2.9 million barrels a day on October 11; India imports most of its crude.",who:"Seafarers, including Indians; oil importers; fuel buyers.",ctx:"Before the war, about 17.1 million barrels a day passed through the strait.",body:"UKMTO recorded 15 attacks on ships between October 6 and 14, 11 of them in the last four days, Al Jazeera reported; oil transit through the strait fell to 2.9 million barrels a day on October 11. The Singapore-flagged container ship GFS Pride sank after being hit by a projectile; all 21 crew were evacuated, Singapore's maritime authority said, according to The National. Iran's Revolutionary Guards said it had hit a mine; a maritime security firm found no evidence of one. US Central Command said 'American forces and regional partners clearly control the Strait of Hormuz.' The Saudi-led coalition said it intercepted a Houthi missile aimed at Riyadh. The International Energy Agency called the recovery in oil supply 'fragile'. Brent was about $106 a barrel during Indian trading, PTI reported.",next:"Whether the US escorts more ships through the strait.",src:"Al Jazeera / The National / IEA",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/14/iran-steps-up-hormuz-surveillance-attacks-soar-oil-flows-crash-again"},{o:"The National",u:"https://www.thenationalnews.com/news/gulf/2026/10/15/fire-sinking-and-reported-scramble-for-cargo-what-we-know-about-ship-lost-in-strait-of-hormuz/"},{o:"IEA",u:"https://www.iea.org/reports/oil-market-report-october-2026"}],th:"iran",loc:[26.57,56.25,"Strait of Hormuz"]},
{c:"India",big:4,status:"Reported",st:"upd",since:"After Tuesday's delay over defects, the petition is listed for today.",made:"A second opposition leader takes the Election Commission to court.",title:"Supreme Court to hear voter-list petition today; Owaisi files his own",dek:"AIMIM chief Asaduddin Owaisi asked the court to stop the revision immediately. The opposition's petition was held up on Tuesday by defects.",why:"The court's response could decide how voter lists are revised before upcoming elections.",who:"Voters; opposition parties; the Election Commission.",ctx:"The opposition wants an audit of voter deletions led by a retired Supreme Court judge.",body:"Owaisi's petition alleges the Chief Election Commissioner used the commission's collective powers without the other commissioners' knowledge, and that online voter-registration forms were changed without amending the rules, ANI reported. He wants the revision stopped and the law on Election Commission appointments repealed. 'The Supreme Court itself has said that protesting is a fundamental right,' he said. The Election Commission has said its decisions were unanimous. Two Cockroach Janta Party activists arrested at Jantar Mantar were sent to five days' judicial custody, ANI reported.",next:"Today's hearing.",src:"ANI",links:[{o:"ANI",u:"https://www.aninews.in/news/national/politics/owaisi-moves-supreme-court-challenging-election-commissions-sir-exercise20261014120727/"}],loc:[28.62,77.24,"Supreme Court, New Delhi"]},
{c:"World",big:5,status:"Confirmed",st:"dev",since:"Hours after Tuesday's EU step, Russia struck Kyiv's power system.",made:"Kyiv's power is hit as winter approaches.",title:"Russian missiles knock out Kyiv's power plants; 600,000 lose electricity",dek:"Five people were killed in Kyiv. In London, the UK pledged a £45 million air-defence package as Zelenskyy met King Charles and Prime Minister Andy Burnham.",why:"Attacks on power plants before winter raise the human cost of the war, and the pressure on talks.",who:"Ukrainians; Indian students in Ukraine.",ctx:"Ukraine says partners gave no early warning, after reports that the US threatened to cut intelligence sharing.",body:"Russia fired 39 ballistic missiles and more than 120 drones, Zelenskyy said, hitting all three of Kyiv's combined heat and power plants, the Kyiv Independent reported. Five people were killed and at least 25 injured, including a 7-year-old girl; all three metro lines stopped for a time. 'This was a targeted Russian ballistic strike specifically against the energy sector,' Zelenskyy said. In London, Burnham said 'we're accelerating the delivery of British-made air defenses' and that he would try to 'repair bridges' between Ukraine and the US.",next:"Whether Ukraine resumes strikes on Russian refineries.",src:"Kyiv Independent",links:[{o:"Kyiv Independent",u:"https://kyivindependent.com/kyiv-residential-building-struck-by-russia-as-ukraine-says-intelligence-sharing-from-partners-interrupted/"},{o:"Kyiv Independent (London)",u:"https://kyivindependent.com/zelensky-arrives-in-uk-as-london-vows-to-speed-up-anti-drone-missile-deliveries/"}],th:"ukraine",loc:[50.45,30.52,"Kyiv"]},
{c:"Sports",status:"Confirmed",st:"upd",since:"India led 2-1 before last night.",made:"The series goes to a decider.",title:"West Indies beat India by 24 runs to level the series 2-2",dek:"Shai Hope made an unbeaten 102 off 50 balls and Keemo Paul took 5 for 41 in Hyderabad.",why:"India now need to win in Bengaluru on Saturday to take the series.",who:"Cricket fans.",ctx:"India's captain Shreyas Iyer won the toss and chose to bowl.",body:"The West Indies scored 247 for 3, with Hope's 102 not out and 49 not out from Sherfane Rutherford, ETV Bharat reported. India were bowled out for 223; Sanju Samson made 56 off 23 balls, Tilak Varma 43 and Nitish Kumar Reddy 41. Paul took 5 for 41. Arshdeep Singh was injured and could not bat, Outlook reported.",next:"The decider in Bengaluru on Saturday.",src:"ETV Bharat / Outlook India",links:[{o:"ETV Bharat",u:"https://www.etvbharat.com/en/sports/keemo-pauls-five-wicket-wrecks-indias-chase-after-hopes-ton-as-west-indies-level-series-enn26101408823"},{o:"Outlook India",u:"https://www.outlookindia.com/sports/cricket/india-vs-west-indies-4th-t20i-live-score-hyderabad-latest-updates"}],loc:[17.41,78.55,"Hyderabad"]},
{c:"AI",status:"Reported",st:"new",made:"US states take on the maker of ChatGPT.",title:"Eight US states sue OpenAI over ChatGPT safety",dek:"They allege OpenAI 'marketed ChatGPT as safe while concealing its risks', including to teenagers.",why:"How courts treat these claims will shape safety rules for chatbots that many students use.",who:"Users of AI chatbots, especially teenagers.",ctx:"The suits were filed in each state's own courts under consumer-protection laws.",body:"Arizona, Arkansas, Idaho, Iowa, Kansas, Montana, Nebraska and West Virginia filed the suits on Wednesday, Just Security reported. POLITICO reported that the states say missing safeguards encouraged self-harm and violence, including among teenagers. Separately, a former OpenAI employee was charged with planting a recording device in an executive conference room, The New York Times and POLITICO reported.",next:"OpenAI's response in court.",src:"Just Security (POLITICO, NYT)",links:[{o:"Just Security",u:"https://justsecurity.org/160981/eight-states-sue-openai-chatgpt-safety"},{o:"Just Security roundup",u:"https://www.justsecurity.org/160924/early-edition-october-15-2026/"}],loc:[41.59,-93.62,"Des Moines, Iowa"]},
{c:"World",status:"Reported",st:"new",made:"A diplomatic row over an alleged plot in Britain.",title:"Iran threatens to review ties with the UK over alleged RAF Fairford plot",dek:"Iran told Britain's ambassador it could 'seriously reconsider' relations unless the UK shows evidence.",why:"A break between Iran and a major European power would narrow the room for diplomacy in the war.",who:"Diplomats; Indians in the Gulf and the UK.",ctx:"Seven men were arrested and bailed in Britain; none has been charged.",body:"Iran warned UK ambassador Hugo Shorter that it could 'seriously reconsider' ties unless Britain produced evidence for its claims about an alleged plot targeting RAF Fairford, AP reported. Prime Minister Andy Burnham has said the plot was 'almost certainly' directed by Iran's Revolutionary Guards.",next:"Whether either side recalls its ambassador.",src:"AP",links:[{o:"AP (via WPXI)",u:"https://www.wpxi.com/news/local/iran-increases-threat-strait-hormuz-shipping-other-middle-east-developments/2HMPLLWI7RF25ILLP7YRIRIUMI/?outputType=amp"}],loc:[51.68,-1.79,"RAF Fairford, England"]}
]},

explainer:{title:"What 'issuing notice' means in the Supreme Court",body:"When the Supreme Court issues notice, it asks the other side, here the Election Commission, to file its response. It is not a ruling on who is right. 'Issuing notice does not mean that we are condemning anything,' Chief Justice Surya Kant said. Unless the court grants interim relief, such as a stay, the work under challenge carries on; here, the voter-list revision continues. The court tagged this petition with other pending challenges to the revision, so they will be heard together.",src:"LiveLaw / The Week"},
