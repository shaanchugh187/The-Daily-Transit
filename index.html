stories:[
{c:"Maharashtra",lead:1,big:1,one:1,status:"Reported",st:"new",made:"Every household in the state will feel this from next week.",loc:[18.52,73.86,"Pune, Maharashtra"],title:"Maharashtra to cut water supply by 10% from October 16",dek:"The state has told every town and city to cut supply by 10% and plan storage until August 31, 2027. Pune's civic body is waiting for the written order.",why:"An early, weak monsoon means dams won't refill until next June; a cut now avoids a crisis in summer.",who:"Every household and business on municipal water in Maharashtra, including Pune and Pimpri-Chinchwad.",ctx:"Pune moved to alternate-day water supply in June this year and withdrew it after heavy July rain.",body:"Water Resources Minister Girish Mahajan announced that water cuts will begin across Maharashtra from October 16, Punekar News reported. The directive covers all local bodies, from municipal corporations to gram panchayats, and asks them to plan supply until August 31, 2027, citing water availability and the El Niño effect; the 10% cut can be raised if needed, The Bridge Chronicle reported. In Pune, Additional Municipal Commissioner Prajeet Nair said the PMC had not yet received the order, and water supply head Nandkishor Jagtap said a decision would follow within a week of it. The PMC has indicated it could shut supply one day a week. Officials say Pune's dams hold about one TMC less than last year but can last until July with planning.",next:"PMC's decision on how Pune's cut will work, expected within a week of the written order.",src:"The Bridge Chronicle / Punekar News",links:[{o:"The Bridge Chronicle",u:"https://www.thebridgechronicle.com/pune/maharashtra-10-percent-water-cut-october-16-pune-directive-agn97"},{o:"Punekar News",u:"https://www.punekarnews.in/pmc-awaits-states-written-order-before-implementing-water-cut-in-pune/"}],th:"monsoon"},
{c:"Politics",lead:1,big:2,status:"Confirmed",st:"upd",since:"Yesterday we had the count at 65%: 49.6% to 42.3%. The final count is much closer.",made:"The final numbers set up a tight four-week race.",loc:[-15.79,-47.88,"Brasília, Brazil"],title:"Brazil's final count: Flavio Bolsonaro 47%, Lula 45%",dek:"With 99.96% counted, Flavio Bolsonaro had 47.04% (56.1 million votes) and Lula 45.15% (53.8 million). Brazil's main share index jumped 8.67%.",why:"A two-point gap makes the October 25 runoff close, and markets are betting on a change of government.",who:"Brazilians; investors in Brazil; India, a fellow BRICS member.",ctx:"Flavio is Jair Bolsonaro's eldest son. Lula, 80, is seeking a fourth term.",body:"With 99.96% of votes counted, Senator Flavio Bolsonaro won 47.04% and President Lula 45.15%, The Rio Times reported; AP put their totals at 56 million and 53.7 million votes. Flavio led in 15 states and Lula in 12, with Lula taking about 63% in the Northeast. Abstention was 21.08%, the highest since 1998. On Monday, Brazil's Ibovespa index rose 8.67% and the real strengthened sharply against the dollar. The two meet in a runoff on October 25.",next:"The runoff on October 25, and whether the eliminated candidates endorse either man.",src:"The Rio Times / AP",links:[{o:"The Rio Times",u:"https://www.riotimesonline.com/brazil-election-first-round-results-lula-flavio-2026/"},{o:"Just Security roundup (AP)",u:"https://www.justsecurity.org/159662/early-edition-october-5-2026/"}],th:"brazil"},
{c:"Personal Finance",lead:1,big:3,status:"Developing",st:"dev",since:"No change: the decision is tomorrow.",made:"Affects every floating-rate loan in India.",loc:[18.93,72.83,"Mumbai"],title:"RBI decides tomorrow: most still expect a rise to 5.50%",dek:"The Monetary Policy Committee is in its second day. The decision and press conference start at 10 AM on Wednesday.",why:"A rise would be the first since 2023 and would lift EMIs on floating-rate home loans.",who:"Borrowers on floating rates; savers; anyone planning a big loan.",ctx:"Retail inflation was 4.82% in August, above the 4% target for three months, and the US Federal Reserve raised rates in September.",body:"The RBI's six-member Monetary Policy Committee, meeting from October 5 to 7, announces its decision on Wednesday at 10 AM. Eight of ten economists polled by Business Standard expect a 25 basis point rise in the repo rate to 5.50%. Retail inflation was 4.82% in August, wholesale inflation 9.92%, and the rupee is down about 6% against the dollar this year. See Issue 24's explainer for how the meeting works.",next:"Wednesday at 10 AM.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/finance/news/rbi-mpc-meeting-october-2026-monetary-policy-repo-rate-hike-retail-inflation-126100200188_1.html"}],th:"rbi"},
{c:"Science",big:4,status:"Confirmed",st:"new",made:"A discovery that changed how the brain is studied.",loc:[59.33,18.07,"Stockholm, Sweden"],title:"Medicine Nobel goes to the pioneers of optogenetics",dek:"Karl Deisseroth, Peter Hegemann and Georg Nagel share the prize for a way to switch nerve cells on and off with light.",why:"It lets scientists see which brain cells drive learning, fear, addiction and movement, and could lead to better hearing implants.",who:"Brain researchers; patients with neurological conditions who may benefit from future treatments.",ctx:"The prize is 12 million Swedish kronor, about $1.2 million, shared between the three.",body:"The 2026 Nobel Prize in Physiology or Medicine was awarded to Karl Deisseroth, 54, of Stanford University, and Peter Hegemann, 71, and Georg Nagel, 73, of Humboldt University of Berlin and the University of Würzburg, for their discoveries concerning light-gated ion channels and optogenetics, Al Jazeera reported. The Nobel Assembly's Thomas Perlmann said the method makes it possible to switch on, or off, the activity of individual nerve cells in a living brain. Researchers expect it to improve cochlear implants by stimulating hearing nerves more precisely than electrical methods.",next:"Physics is announced this afternoon; we'll cover it tomorrow.",src:"Al Jazeera / NobelPrize.org",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/5/nobel-medicine-prize-honours-us-and-german-scientists-for-optogenetics-work"},{o:"NobelPrize.org",u:"https://www.nobelprize.org/prizes/medicine/2026/summary/"}]},
{c:"Pune",big:5,status:"Reported",st:"upd",since:"Raj Thackeray and Manoj Jarange visited; the MPSC secretary's deputation was ended.",made:"The protest is now drawing national leaders to Pune.",loc:[18.513,73.846,"S M Joshi Bridge, Pune"],title:"MPSC protest enters its sixth day; Rahul Gandhi may visit",dek:"Raj Thackeray and Manoj Jarange visited on Monday, Aaditya Thackeray joins today, and Rohit Pawar says Rahul Gandhi may come by October 7 or 8.",why:"The demand for chairman Vivek Bhimanwar's resignation is now backed by every opposition party, raising pressure on the government.",who:"MPSC aspirants; commuters around S M Joshi Bridge, Alka Chowk and Shastri Road.",ctx:"After a September 30 meeting, the government promised a judicial inquiry into the MPSC within three months.",body:"Protests in Pune demanding the resignation of MPSC chairman Vivek Bhimanwar continued at three sites, with paper-leak allegations at their centre, PTI reported. MNS chief Raj Thackeray and Maratha activist Manoj Jarange visited the main protest on Monday, and Shiv Sena (UBT) leader Aaditya Thackeray is due today. NCP (SP) MLA Rohit Pawar said Rahul Gandhi is likely to come by October 7 or 8. The government has ended the deputation of MPSC secretary Mahendra Harpalkar and announced a judicial inquiry within three months.",next:"Aaditya Thackeray's visit today; a possible Rahul Gandhi visit later this week.",src:"PTI",links:[{o:"PTI (via ThePrint)",u:"https://theprint.in/india/protests-for-mpsc-chairmans-resignation-intensify-rahul-likely-to-join/3062698/"}],th:"mpsc"},
{c:"Markets",status:"Confirmed",st:"upd",since:"Markets reopened after the long weekend and rose.",made:"A breather for SIP investors after eight weeks of falls.",loc:[18.93,72.835,"Dalal Street, Mumbai"],title:"Sensex ends a four-day fall as oil eases and the rupee firms",dek:"The Sensex rose 0.66% to 72,382.47 and the Nifty 0.60% to 22,555.75. Brent was about $102.5 a barrel.",why:"Cheaper oil and a firmer rupee are the two things that would ease pressure on the RBI.",who:"Anyone with mutual funds, SIPs or shares.",ctx:"The Nifty had fallen for eight weeks in a row before this week.",body:"The Sensex rose about 450 points, or 0.66%, to 72,382.47 on Monday and the Nifty 50 gained 0.60% to 22,555.75, as crude prices eased and the rupee firmed, Kotak Neo reported. PSU banks led the gains; healthcare and pharma fell. ITC, BSE and Tata Motors were among the top gainers, and HCL Technologies and HDFC Bank among the losers. Brent crude for December traded at $102.52 a barrel.",next:"How markets react to tomorrow's RBI decision.",src:"Kotak Neo",links:[{o:"Kotak Neo",u:"https://www.kotakneo.com/news/market-news/sensex-nifty-end-higher-as-crude-oil-prices-ease-and-rupee-gains/"}],th:"markets"},
{c:"Geopolitics",status:"Claimed",st:"dev",made:"The war is widening around Saudi Arabia's oil.",loc:[24.71,46.68,"Riyadh, Saudi Arabia"],title:"Houthis say they hit an Aramco site in Riyadh as Yemen's offensive grows",dek:"Saudi Arabia pledged full support for Yemen's government offensive. Separately, the US pulled all 12 B-1 bombers out of Britain over an Iran-backed threat.",why:"Attacks on Saudi oil sites push prices up just as they were starting to ease.",who:"Oil importers including India; the large Indian community in Saudi Arabia.",ctx:"Yemen's internationally recognised government launched the offensive on the Houthis on Sunday.",body:"The Iran-aligned Houthis claimed to have targeted an Aramco facility in Riyadh in response to Saudi strikes on Sanaa, according to The New York Times and Reuters; the claim was not independently confirmed. Saudi Arabia pledged full operational support for Yemeni President Rashad al-Alimi's campaign against the Houthis. Iran's parliament speaker repeated that the Strait of Hormuz stays closed until seven conditions are met, Reuters reported. The New York Times reported that the US rushed to withdraw all 12 B-1 bombers from RAF Fairford in Britain after intelligence about an Iran-backed threat.",next:"Whether Saudi Arabia confirms any damage, and how oil prices react.",src:"Reuters / NYT, via Just Security",links:[{o:"Just Security roundup (Reuters, NYT)",u:"https://www.justsecurity.org/159662/early-edition-october-5-2026/"}],th:"iran"},
{c:"World",status:"Reported",st:"dev",made:"A turning point in the Horn of Africa crisis we've been following.",loc:[13.50,39.47,"Mekelle, Ethiopia"],title:"Tigrayan forces pull out of Mekelle",dek:"The TPLF withdrew from Tigray's capital, letting government-aligned fighters in, to spare the city from destruction.",why:"It may avoid a battle for a city of hundreds of thousands, but the wider conflict with Eritrea is unresolved.",who:"Civilians in Tigray; the region, where Ethiopia, Eritrea and Sudan's conflicts are linking up.",ctx:"Ethiopia and Eritrea cut diplomatic ties last week (Issue 22).",body:"Tigray People's Liberation Front forces withdrew from Mekelle, allowing government-aligned fighters to enter and avoiding the city's destruction, AP reported.",next:"Whether fighting moves elsewhere in Tigray or to the Eritrean border.",src:"AP, via Just Security",links:[{o:"Just Security roundup (AP)",u:"https://www.justsecurity.org/159662/early-edition-october-5-2026/"}],th:"ethiopia"},
{c:"World",status:"Confirmed",st:"new",made:"Europe's biggest backer of Ukraine doubles down.",loc:[50.45,30.52,"Kyiv, Ukraine"],title:"Germany's Merz pledges $1.5 billion more for Ukraine in Kyiv",dek:"Most of it, $1.1 billion, is military aid. The two countries also signed 15 agreements worth over $9.6 billion.",why:"Germany is now Ukraine's biggest European supporter as winter approaches and Russia targets energy sites.",who:"Ukrainians facing winter strikes; European taxpayers.",ctx:"Russian strikes hit Kharkiv and Odesa the same weekend.",body:"Chancellor Friedrich Merz announced $1.5 billion in aid during a visit to Kyiv, including $1.1 billion in military assistance plus energy support, AP reported, and Ukraine and Germany signed 15 agreements worth more than $9.6 billion. President Zelenskyy said Ukraine will keep attacking Russian oil refineries but not civilians, Reuters reported.",next:"Russia's response, and whether other EU countries follow.",src:"AP / Reuters, via Just Security",links:[{o:"Just Security roundup (AP, Reuters)",u:"https://www.justsecurity.org/159662/early-edition-october-5-2026/"}],th:"ukraine"},

{c:"AI",status:"Reported",st:"new",made:"Who shapes US AI policy matters for every AI tool you use.",loc:[38.90,-77.04,"Washington, DC"],title:"Trump names an AI czar to lead a new 'Super Intelligence Force'",dek:"Director of National Intelligence Jay Clayton will coordinate the government's work on advanced AI. Sam Altman said OpenAI differs sharply from Anthropic on regulation.",why:"The US sets the rules most big AI companies follow worldwide.",who:"AI companies and their users, in India too.",ctx:"The US has no single national AI law; policy is mostly set by executive orders.",body:"President Trump named Director of National Intelligence Jay Clayton as White House AI czar, leading a newly formed Super Intelligence Force, Politico reported. OpenAI CEO Sam Altman said there is a lot of daylight between OpenAI and Anthropic on AI regulation and acceptable risks. Separately, OpenAI disclosed a second breach, which exposed non-public fire statistics from a New South Wales government agency, ABC News reported.",next:"What powers the new body has, and its first actions.",src:"Politico / ABC News, via Just Security",links:[{o:"Politico",u:"https://www.politico.com/news/2026/10/04/jay-clayton-ai-trump-01106137"},{o:"Politico (Altman interview)",u:"https://www.politico.com/news/2026/10/04/sam-altman-decoded-interview-ai-01106217"},{o:"Just Security roundup",u:"https://www.justsecurity.org/159662/early-edition-october-5-2026/"}]}

explainer:{title:"How to read today's RBI decision in two minutes",body:"Look for four things. First, the repo rate: the rate at which banks borrow from the RBI, now 5.25%. A rise to 5.50% means floating-rate home loans get costlier within one or two billing cycles; on a Rs 50 lakh, 20-year loan at 8.5%, that is roughly Rs 795 more a month. Second, the stance: words like 'neutral' or 'withdrawal of accommodation' hint at whether more hikes are coming. Third, the forecasts: the RBI's new estimates for inflation and growth this year show how worried it is. Fourth, the vote: if all six members agreed, the decision is firm; a split vote means the next move is less certain. Fixed deposit rates usually rise too, but more slowly than loan rates.",src:"Reserve Bank of India; Business Standard; EMI figure is an illustrative calculation"},
dots:{title:"Two protests, one argument about trust",body:"In Delhi, the opposition marched on the Election Commission over alleged 'vote theft'. In Pune, students are demanding the removal of the MPSC chairman over alleged paper leaks. Aaditya Thackeray connected the two directly, calling it a fight against 'vote thieves' and 'paper thieves'. Both are about trust in the bodies that run elections and recruitment exams. That is why the MPSC row has drawn national leaders, and why it may not end with an exam-pattern decision.",link:["Rahul and Priyanka Gandhi among 250 detained at Delhi protest against the Election Commission","Aaditya Thackeray backs MPSC protesters, calls for chairman to go"]},

stories:[
{c:"Personal Finance",lead:1,big:1,one:1,status:"Developing",st:"dev",since:"Decision day: the announcement is at 10 AM.",made:"Today's decision sets the cost of every floating-rate loan in India.",title:"RBI decision today: most expect the first hike since 2023",dek:"The Monetary Policy Committee announces its decision at 10 AM. Eight of ten economists polled by Business Standard expect a rise from 5.25% to 5.50%.",why:"A hike would raise EMIs on most floating-rate home loans within one or two billing cycles; a pause would surprise markets.",who:"Home, car and personal loan borrowers on floating rates; savers; businesses that borrow.",ctx:"Retail inflation was 4.82% in August, above the 4% target for three months; the US Federal Reserve raised rates in September.",body:"The RBI's six-member Monetary Policy Committee, which met from October 5 to 7, announces its decision at 10 AM today, followed by the Governor's press conference. In a Business Standard poll, eight of ten economists expected a 25 basis point rise in the repo rate to 5.50%, the first increase since February 2023; a Reuters survey found nearly 60% expecting the same. Inflation above target and a rupee down about 6% this year are the main reasons. Markets rose on Monday and Tuesday as oil eased. See today's explainer for what to watch.",next:"The decision at 10 AM; we'll report it in full tomorrow.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/finance/news/rbi-mpc-meeting-october-2026-monetary-policy-repo-rate-hike-retail-inflation-126100200188_1.html"}],th:"rbi",loc:[18.93,72.83,"Mumbai"]},
{c:"India",lead:1,big:2,status:"Reported",st:"new",made:"A clash between the opposition and the body that runs India's elections.",title:"Rahul and Priyanka Gandhi among 250 detained at Delhi protest against the Election Commission",dek:"About 50 MPs were among those removed after an eight-hour sit-in at Akashvani Bhawan, as they tried to march to the Election Commission.",why:"The opposition is accusing the Election Commission of allowing 'vote theft'; the dispute goes to the heart of trust in elections.",who:"Voters; opposition parties; the Election Commission and Chief Election Commissioner Gyanesh Kumar.",ctx:"The opposition has been demanding the Chief Election Commissioner's resignation over alleged irregularities in voter lists.",body:"Delhi Police detained about 250 people, including 50 MPs, Leader of the Opposition Rahul Gandhi, Priyanka Gandhi Vadra, K.C. Venugopal and Pawan Khera, after an eight-hour sit-in at Akashvani Bhawan, The Week reported. They had tried to march to Nirvachan Sadan to meet the Election Commissioners over alleged electoral irregularities. Rahul Gandhi accused the government of 'vote theft'. The Election Commission said it had received no formal request for a meeting, and BJP spokespersons called the protest theatrics. Those detained were taken to New Police Lines at Kingsway Camp.",next:"The opposition's next step, and whether the Election Commission agrees to meet.",src:"The Week / Reuters",links:[{o:"The Week",u:"https://www.theweek.in/news/india/2026/10/06/opposition-leaders-detained-election-commission-protest.html"},{o:"Just Security roundup (Reuters)",u:"https://www.justsecurity.org/159804/early-edition-october-6-2026/"}],th:"",loc:[28.62,77.21,"New Delhi"]},
{c:"Science",lead:1,big:3,status:"Confirmed",st:"new",made:"A Nobel for one of the strangest experiments on Earth.",title:"Physics Nobel goes to Francis Halzen for catching 'ghost particles' in Antarctic ice",dek:"The 82-year-old Belgian-born physicist built IceCube, a detector made of a cubic kilometre of ice at the South Pole.",why:"IceCube found high-energy neutrinos from distant galaxies, giving scientists a new way to study exploding stars and black holes.",who:"Astronomers and physicists; students thinking about careers in science.",ctx:"Neutrinos barely interact with matter. When one does hit an atom in the ice, it makes a faint flash of light that IceCube's sensors record.",body:"The 2026 Nobel Prize in Physics was awarded to Francis Halzen, 82, of the University of Wisconsin–Madison, for developing methods to detect neutrinos and discovering high-energy neutrinos from distant galaxies with the IceCube Neutrino Observatory in Antarctica, PBS NewsHour reported. Neutrinos pass through almost everything, including our bodies; Halzen's idea was to use the clear, deep ice at the South Pole as a giant detector that records the flashes of light made when a neutrino collides with it. He said the news felt strange and that he hoped the prize would help fund future projects. He is the 11th Belgian Nobel laureate. The prize is 12 million Swedish kronor.",next:"Chemistry is announced today, literature tomorrow.",src:"PBS NewsHour / NobelPrize.org",links:[{o:"PBS NewsHour",u:"https://www.pbs.org/newshour/science/watch-live-winner-of-the-2026-nobel-prize-in-physics-is"},{o:"NobelPrize.org",u:"https://www.nobelprize.org/prizes/physics/2026/press-release/"}],loc:[43.07,-89.40,"Madison, Wisconsin"]},
{c:"Pune",big:4,status:"Reported",st:"upd",since:"Aaditya Thackeray visited on Tuesday, as expected.",made:"The Pune protest is now part of a national political fight.",title:"Aaditya Thackeray backs MPSC protesters, calls for chairman to go",dek:"He accused the government of shielding those behind MPSC irregularities and urged students on hunger strike to end it, promising to take their fight to Mumbai.",why:"Linking the exam row to the opposition's Election Commission fight makes it harder for the government to settle quietly.",who:"MPSC aspirants; commuters around S M Joshi Bridge, Alka Chowk and Shastri Road.",ctx:"The government has promised a judicial inquiry within three months and removed the MPSC secretary, but not the chairman, Vivek Bhimanwar.",body:"Shiv Sena (UBT) leader Aaditya Thackeray visited the MPSC protest in Pune on Tuesday, its sixth day, and backed the demand for chairman Vivek Bhimanwar's resignation, PTI reported. He said the government was shielding those responsible for irregularities and compared the demand to the opposition's call for the Chief Election Commissioner to resign, describing 'vote thieves' and 'paper thieves'. The Free Press Journal reported that he urged students on a hunger strike to end it for the sake of their health and said he would take their demands to the MPSC in Mumbai.",next:"Whether Rahul Gandhi visits this week, and any government move on the chairman.",src:"PTI / Free Press Journal / Punekar News",links:[{o:"PTI (via ThePrint)",u:"https://theprint.in/india/aaditya-backs-demand-for-mpsc-chiefs-resignation-says-govt-shielding-those-behind-irregularities/3063815/"},{o:"Free Press Journal",u:"https://www.freepressjournal.in/pune/end-hunger-strike-your-health-matters-well-knock-on-mpscs-door-in-mumbai-aaditya-thackeray-backs-pune-students"},{o:"Punekar News",u:"https://www.punekarnews.in/will-go-to-mumbai-if-needed-aaditya-thackeray-backs-mpsc-students-protest-in-pune/"}],th:"mpsc",loc:[18.513,73.846,"S M Joshi Bridge, Pune"]},
{c:"Pune",big:5,status:"Reported",st:"upd",since:"PMC is still waiting for the state's written order.",made:"Practical: how the water cut is likely to work in Pune.",title:"Pune's water cut: what we know so far",dek:"The state's 10% cut starts October 16. PMC is likely to shut supply one day a week, as it did in 2020-21, once the written order arrives.",why:"A weekly no-water day means storing water the day before; knowing the plan early helps households prepare.",who:"Every household and business on PMC water.",ctx:"Pune's four dams, Khadakwasla, Panshet, Varasgaon and Temghar, filled this monsoon, but hold about one TMC less than last year.",body:"The PMC is preparing for the state's 10% water cut from October 16 and is considering a weekly shutdown of supply, Pune Pulse and Punekar News reported. Water supply head Nandkishor Jagtap said the corporation was discussing reservoir management with the Water Resources Department, and a decision would follow within a week of the state's written order. Officials say storage, about one TMC below last year, can last until July 2027 with planning. The PMC used weekly cuts during the 2020-21 shortage.",next:"PMC's area-wise schedule, expected after the written order.",src:"Pune Pulse / Punekar News",links:[{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-may-face-one-day-per-week-water-cut-decision-likely-after-review/"},{o:"Punekar News",u:"https://www.punekarnews.in/pmc-awaits-states-written-order-before-implementing-water-cut-in-pune/"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"Markets",status:"Confirmed",st:"upd",since:"A second day of gains after Monday's rise.",made:"Markets are pricing in a calm RBI day.",title:"Sensex rises for a second day, back above 73,000",dek:"The Sensex gained 685 points (0.95%) to 73,067.81 and the Nifty 0.98% to 22,776.10. Trent jumped 12% on its quarterly update.",why:"Two days of gains suggest investors expect the RBI decision to hold no big surprise.",who:"Anyone with mutual funds, SIPs or shares.",ctx:"The Nifty fell for eight straight weeks until last week.",body:"The Sensex closed at 73,067.81 on Tuesday, up 685.34 points or 0.95%, and the Nifty 50 at 22,776.10, up 0.98%, Business Standard reported. Mid-cap and small-cap indices rose more than 1%. Several companies gained on strong quarterly business updates, including Trent (up 12%), Honasa Consumer (8%) and Meesho (6%).",next:"How markets react to the RBI at 10 AM.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/amp/markets/news/stock-market-live-october-6-bse-sensex-today-nifty50-gift-nifty-crude-oil-prices-srit-india-ipo-listing-126100600087_1.html"}],th:"markets",loc:[18.93,72.835,"Dalal Street, Mumbai"]},
{c:"Geopolitics",status:"Reported",st:"dev",made:"The fighting is moving toward one of the world's busiest shipping lanes.",title:"Saudi-backed forces say they retook towns near the Bab el-Mandeb strait",dek:"Yemen's government reported recapturing Dhubab and nearby towns from the Houthis. Saudi airports in Jazan and Najran were attacked.",why:"Bab el-Mandeb is the southern gate to the Red Sea; fighting there threatens shipping between Asia and Europe, including India's.",who:"Shipping companies and exporters; Indian sailors and workers in the region.",ctx:"Yemen's government launched its offensive on the Houthis on Sunday with Saudi support.",body:"Yemeni officials said coalition forces recaptured Dhubab, Bab and Hadeid, towns near the Bab el-Mandeb strait, from the Houthis, AP and Reuters reported. Saudi airports in Jazan and Najran were attacked, causing limited damage and three injuries. Separately, the BBC and The New York Times reported that US bombers were moved out of RAF Fairford in Britain after intelligence about possible drone attacks by Iran's Revolutionary Guards.",next:"Whether the Houthis strike shipping in the Red Sea in response.",src:"AP / Reuters, via Just Security",links:[{o:"Just Security roundup (AP, Reuters, BBC)",u:"https://www.justsecurity.org/159804/early-edition-october-6-2026/"}],th:"iran",loc:[12.6,43.3,"Bab el-Mandeb, Yemen"]},
{c:"World",status:"Reported",st:"dev",made:"The largest drone attack on the Moscow region we've reported.",title:"Ukraine sends more than 650 drones at Russia; Russian bombs kill six in Kharkiv",dek:"Moscow's regional governor said two people were killed. In Kharkiv, Russian bombs killed six and injured 59.",why:"Both sides are hitting energy and cities harder as winter approaches.",who:"Civilians on both sides; fuel and grain shipping in the Black Sea.",ctx:"Germany pledged $1.5 billion in new aid for Ukraine on Sunday.",body:"Ukraine launched more than 650 drones at Russia overnight, most of which were shot down; the Moscow region's governor said two people were killed and nine injured, and a fuel depot was among the targets, Reuters reported. Russian bombs killed six people and injured 59 in a residential area of Kharkiv. A Russian drone strike killed two crew on a ship carrying corn in the Black Sea, AP reported.",next:"Whether Russia retaliates against Ukraine's energy grid.",src:"Reuters / AP, via Just Security",links:[{o:"Just Security roundup (Reuters, AP)",u:"https://www.justsecurity.org/159804/early-edition-october-6-2026/"}],th:"ukraine",loc:[55.75,37.62,"Moscow region"]},
{c:"World",status:"Reported",st:"new",made:"Student protests at a scale rarely seen in Europe.",title:"France: nearly 2,000 schools blockaded in two weeks of protests",dek:"About 6,000 people have been arrested and around 300 injured since the protests over staffing and school conditions began.",why:"It shows how anger over public services is spilling into the streets across Europe.",who:"French students, teachers and parents; Indian students in France.",ctx:"France's schools have faced teacher shortages and budget cuts.",body:"Nearly 2,000 French schools were blockaded over staffing and conditions, the BBC and The New York Times reported. Since the protests began two weeks ago, about 6,000 people have been arrested and around 300 injured; one teenager lost a hand.",next:"Whether the government offers new staffing or funding.",src:"BBC / NYT, via Just Security",links:[{o:"Just Security roundup (BBC, NYT)",u:"https://www.justsecurity.org/159804/early-edition-october-6-2026/"}],loc:[48.86,2.35,"Paris, France"]},
{c:"World",status:"Confirmed",st:"new",made:"Canada could face a third vote on Quebec independence.",title:"Quebec elects a separatist government promising an independence referendum",dek:"The Parti Québécois won a minority government in the Canadian province.",why:"Quebec voted narrowly against leaving Canada in 1995; another referendum would shake one of India's key partners.",who:"Quebecers; Canada's federal government; Indian students and workers in Quebec.",ctx:"Quebec held independence referendums in 1980 and 1995; both failed, the second by about one percentage point.",body:"The Parti Québécois won a minority government in Quebec's provincial election on a promise to hold an independence referendum, Politico reported.",next:"Whether and when it sets a referendum date.",src:"Politico, via Just Security",links:[{o:"Just Security roundup (Politico)",u:"https://www.justsecurity.org/159804/early-edition-october-6-2026/"}],loc:[46.81,-71.21,"Quebec City, Canada"]},
{c:"AI",status:"Reported",st:"new",made:"Deepfakes are now a problem leaders are trying to fix with the law.",title:"Italy's Meloni moves to trademark her voice against AI deepfakes",dek:"Prime Minister Giorgia Meloni applied for a trademark on her voice. South Korea's president said AI may have been used in recent bank hacks.",why:"Voice cloning makes scams and fake videos easy; who owns a voice is becoming a legal question.",who:"Public figures; anyone who could be targeted by a voice-clone scam call.",ctx:"Last week a Tokyo court gave a voice actor legal rights over his AI-cloned voice (Issue 22).",body:"Italian Prime Minister Giorgia Meloni applied to trademark her voice to fight AI deepfakes, Politico reported. In South Korea, President Lee said there were signs AI models were used in recent hacks on banks, and an investigation is under way, The New York Times reported.",next:"Whether other leaders or celebrities follow Meloni's approach.",src:"Politico / NYT, via Just Security",links:[{o:"Just Security roundup (Politico, NYT)",u:"https://www.justsecurity.org/159804/early-edition-october-6-2026/"}],loc:[41.90,12.50,"Rome, Italy"]}

explainer:{title:"Your loan after the RBI hike: what actually changes",body:"If your home loan is linked to the repo rate (most floating-rate loans since 2019 are), your bank must pass on the 0.25-point rise at the next reset, usually within three months. On a Rs 50 lakh, 20-year loan at 8.5%, the EMI rises by roughly Rs 795 a month, or the bank may keep the EMI the same and add months to the loan; you can ask for either. Loans linked to the older MCLR rate move more slowly. Fixed-rate loans don't change. Savers gain more slowly: banks raise fixed deposit rates over weeks, not days. The new stance, 'calibrated tightening', means the RBI may raise rates again if inflation keeps broadening, so locking a longer FD now could pay off.",src:"Reserve Bank of India; Business Standard; EMI figure is an illustrative calculation"},
dots:{title:"From a war at sea to your EMI",body:"The RBI listed the unresolved West Asia conflict among its top risks. The chain runs through oil and the rupee to the price of everything.",link:["RBI raises repo rate to 5.5%, ends talk of rate cuts","Yemen fighting nears the Red Sea; Brent dips below $100"],chain:["War in Yemen and the Gulf keeps oil about 30% above pre-war levels","Costlier oil and a rupee near 96.5 to the dollar push up fuel and import prices","Inflation broadens: items above 4% now make up 37% of the CPI basket","The RBI raises the repo rate to 5.5% to stop prices from spreading","Your floating-rate EMI rises at the next reset"]},

stories:[
{c:"Personal Finance",lead:1,big:1,one:1,status:"Confirmed",st:"upd",since:"Yesterday we expected a hike; it came, with a tougher stance than many expected.",made:"The first rate rise in more than three years reaches every floating-rate borrower.",title:"RBI raises repo rate to 5.5%, ends talk of rate cuts",dek:"All six MPC members voted for the 0.25-point hike. By 4-2, they also changed the stance to 'calibrated tightening'.",why:"EMIs on repo-linked home, car and personal loans will rise at the next reset; deposit rates should follow, more slowly.",who:"Floating-rate borrowers; savers; businesses that borrow.",ctx:"Retail inflation rose to 4.8% in August, above the 4% target, and core inflation rose to 4.2%.",body:"The Reserve Bank of India's Monetary Policy Committee raised the repo rate by 25 basis points to 5.5%, its first increase since February 2023, Business Standard reported. The vote was unanimous; the committee voted 4-2 to change its stance to 'calibrated tightening', meaning future moves will be hikes or pauses depending on the data. Governor Sanjay Malhotra said the length of any tightening would depend on underlying inflation and second-round effects of supply shocks. The RBI expects headline inflation to average nearly 5.8% over the next three quarters and kept growth strong at 7.1% for this year. It named the unresolved West Asia conflict, a weak monsoon and El Niño among the risks. The standing deposit facility rate is now 5.25% and the marginal standing facility rate 5.75%.",next:"September inflation data on October 12; the meeting's minutes on October 21.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/amp/finance/news/rbi-policy-highlights-repo-rate-rises-25-bps-as-inflation-risks-broaden-126100700304_1.html"},{o:"Forbes India",u:"https://www.forbesindia.com/article/news/rbi-mpc-meeting-live-rate-hike-in-focus-as-inflation-oil-rise-liveblog/2999124/1"}],th:"rbi",loc:[18.93,72.83,"Mumbai"]},
{c:"Markets",big:2,status:"Confirmed",st:"upd",since:"The two-day rally ended on decision day.",made:"Markets priced in a hike, but not a hawkish stance.",title:"Sensex falls 429 points after the RBI; rupee slips to 96.57",dek:"The Sensex closed at 72,638.70 and the Nifty at 22,603.05. Government bond yields rose to 7.27%.",why:"Higher rates make borrowing costlier for companies and make bonds more attractive than shares.",who:"Anyone with mutual funds, SIPs or shares; importers paying in dollars.",ctx:"The Sensex had gained for two days, rising 0.95% on Tuesday.",body:"The Sensex fell 429.11 points, or 0.59%, to 72,638.70 on Wednesday, and the Nifty 50 lost 173.05 points, or 0.76%, to 22,603.05, Business Standard reported. Titan, Adani Enterprises and Hindalco were among the biggest losers. Public sector banks were the only sector to gain; metals fell the most. The rupee fell 22 paise to 96.57 to the dollar after the decision, and the 10-year government bond yield rose to 7.27%.",next:"How banks reprice their loans and deposits.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/markets/news/stock-market-live-october-7-nse-bse-sensex-today-nifty50-gift-nifty-crude-oil-prices-rbi-mpc-repo-rate-ipo-today-126100700099_1.html"}],th:"markets",loc:[18.93,72.835,"Dalal Street, Mumbai"]},
{c:"Science",big:3,status:"Confirmed",st:"new",made:"A Nobel for chemistry that is inside many of the medicines you take.",title:"Chemistry Nobel goes to Henri Kagan and Kenso Soai for 'mirror-image' molecules",dek:"Many molecules come in left- and right-handed forms. The winners found ways to make one form instead of an equal mix of both.",why:"In medicines, one form can treat a disease while its mirror image does nothing or causes harm.",who:"Patients; drug makers, including India's pharmaceutical industry; chemistry students.",ctx:"The 1950s drug thalidomide is the classic warning: one form eased morning sickness, the other caused birth defects.",body:"The 2026 Nobel Prize in Chemistry was awarded to Henri Kagan and Kenso Soai for their work on chirality, the 'handedness' of molecules, NobelPrize.org announced. In 1985 Kagan described a method that produces more of one mirror-image form than the other. Soai designed a reaction in 1995, and eight years later showed one that amplifies a tiny excess of one form into almost entirely that form, the Royal Society of Chemistry reported. Making a single form matters most for medicines, where the two forms can behave very differently in the body.",next:"Literature is announced today, the Peace Prize tomorrow.",src:"NobelPrize.org / Royal Society of Chemistry",links:[{o:"NobelPrize.org",u:"https://www.nobelprize.org/prizes/chemistry/2026/press-release/"},{o:"Royal Society of Chemistry",u:"https://www.rsc.org/news/nobel-prize-for-chemistry-2026"}],loc:[59.33,18.07,"Stockholm, Sweden"]},
{c:"Pune",big:4,status:"Developing",st:"dev",since:"Rohit Pawar's 48-hour deadline has passed with no decision on the chairman.",made:"The protest is now a test of whether national leaders turn up in person.",title:"MPSC protest enters second week; Rahul Gandhi's Pune visit still unconfirmed",dek:"Rohit Pawar had said Rahul Gandhi would likely meet aspirants on October 7 or 8. Pawar's deadline for the government has run out.",why:"A visit would make the exam row a national issue; a Pune bandh would disrupt the city.",who:"MPSC aspirants; commuters around S M Joshi Bridge, Alka Chowk and Shastri Road.",ctx:"Rahul Gandhi backed the students' 'satyagraha' online on October 3 and demanded that more than 70,000 vacant government posts be filled.",body:"NCP (SP) MLA Rohit Pawar on Monday gave the Maharashtra government 48 hours to remove MPSC chairman Vivek Bhimanwar and order a full audit of recruitment, warning of a Pune bandh or a march to Mantralaya, National Herald reported. He said Rahul Gandhi was likely to meet the aspirants on October 7 or 8, but the visit was not confirmed. The agitation has split into three groups over its demands. BJP minister Nitesh Rane accused Pawar of politicising the protest. On October 3, Rahul Gandhi said the MPSC had been 'hijacked' and that students needed 'action, not assurances', the Free Press Journal reported.",next:"Whether Rahul Gandhi visits, and whether Pawar calls the bandh.",src:"National Herald / Free Press Journal / PTI",links:[{o:"National Herald",u:"https://www.nationalheraldindia.com/politics/rohit-pawar-sets-48-hour-deadline-over-mpsc-demands-warns-of-pune-bandh"},{o:"Free Press Journal",u:"https://www.freepressjournal.in/education/rahul-gandhi-backs-mpsc-students-satyagraha-demands-chairmans-resignation-70000-vacant-govt-jobs-filled"},{o:"PTI (via ThePrint)",u:"https://theprint.in/india/rahul-gandhi-likely-to-visit-pune-as-protests-by-mpsc-aspirants-intensify/3062273/"}],th:"mpsc",loc:[18.513,73.846,"S M Joshi Bridge, Pune"]},
{c:"Geopolitics",big:5,status:"Reported",st:"dev",since:"The Houthis deny the government's claims to have retaken towns near the strait.",made:"A war on the Red Sea coast, and oil still fell.",title:"Yemen fighting nears the Red Sea; Brent dips below $100",dek:"More than 270 fighters were killed in 24 hours, AFP reported. The Houthis said they fired a missile at Riyadh's airport.",why:"The Bab el-Mandeb strait carries much of India's trade with Europe; oil is still about 30% above pre-war levels.",who:"Exporters and shipping firms; Indian sailors and workers in the Gulf; anyone paying for fuel.",ctx:"The Houthis seized most of Yemen's Red Sea coast in September; Saudi-backed forces counter-attacked on Sunday.",body:"The Houthis denied claims by Yemen's Saudi-backed government that it had retaken positions on the Red Sea coast, CBS News reported. AFP, citing both sides, said more than 270 troops and fighters were killed in 24 hours. The Houthis said they fired a ballistic missile at King Khalid International Airport in Riyadh; the Saudi-led coalition said it intercepted a missile north of the city. Brent crude fell below $100 a barrel on Tuesday despite the fighting, though analysts said the drop may not last. In the Strait of Hormuz, UKMTO reported several tankers hit by unknown projectiles, and Iran's president called talks with the US 'meaningless'.",next:"Whether the Houthis turn to shipping, as they did in 2024.",src:"CBS News / AFP",links:[{o:"CBS News",u:"https://www.cbsnews.com/live-updates/iran-war-trump-us-oil-prices-yemen-red-sea-houthis-bab-el-mandeb/"}],th:"iran",loc:[12.6,43.3,"Bab el-Mandeb, Yemen"]},
{c:"Pune",status:"Reported",st:"upd",since:"No schedule yet; an old 2025 list is circulating.",made:"Practical: don't plan around the list on WhatsApp.",title:"Pune water cut: eight days to go, still no area-wise schedule",dek:"The PMC is waiting for the state's written order. A day-by-day south Pune list being shared is from May 2025.",why:"Households need to know their no-water day to store water the evening before.",who:"Every household and business on PMC water.",ctx:"The state ordered a 10% cut from October 16 after a weak monsoon; the PMC is considering one shutdown day a week.",body:"The PMC has not yet published an area-wise schedule for the 10% water cut that starts on October 16, Pune Pulse and Punekar News reported earlier this week; officials said a decision would follow within a week of the state's written order. A weekly schedule for areas served by the Vadgaon plant, including Dhayari, Katraj and Kondhwa, is being shared online, but Punekar News published it on May 2, 2025, during last year's shortage.",next:"PMC's schedule, expected before October 16.",src:"Pune Pulse / Punekar News",links:[{o:"Punekar News",u:"https://www.punekarnews.in/pmc-awaits-states-written-order-before-implementing-water-cut-in-pune/"},{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-may-face-one-day-per-week-water-cut-decision-likely-after-review/"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"Tech",status:"Confirmed",st:"new",made:"A small RBI change that could make your financial data easier to move.",title:"RBI orders account aggregators to work with each other by December 31",dek:"The apps that let you share bank statements with lenders and advisers with your consent will have to interoperate.",why:"Today a lender and a user may need to be on the same aggregator; interoperability means fewer apps and faster loan approvals.",who:"Anyone who shares bank data for a loan, an insurance policy or tax filing; fintech startups.",ctx:"Account aggregators are RBI-licensed NBFCs that move financial data between institutions only with the user's consent.",body:"Alongside the rate decision, the RBI said account aggregators, the consent-based apps used to share financial data, will be made interoperable, with the change expected by December 31, 2026, Business Standard reported.",next:"RBI's detailed rules for interoperability.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/amp/finance/news/rbi-policy-highlights-repo-rate-rises-25-bps-as-inflation-risks-broaden-126100700304_1.html"}],loc:[18.93,72.83,"Mumbai"]},
{c:"Geopolitics",status:"Reported",st:"dev",made:"Tankers are being hit at both ends of the Arabian Peninsula.",title:"Tankers struck near Hormuz; Iran calls talks with the US 'meaningless'",dek:"UKMTO reported three tankers hit over the weekend and another on Monday. US Central Command says it has destroyed 13 commercial ships in the strait in 12 weeks.",why:"About a fifth of the world's oil passes through Hormuz; India imports most of its crude through it.",who:"Indian refiners and sailors; anyone paying for fuel.",ctx:"The US-Iran war began earlier this year; oil remains about 30% above pre-war levels.",body:"The UK Maritime Trade Operations centre reported that three tankers were hit by unknown projectiles over the weekend and another was struck leaving the Strait of Hormuz on Monday, CBS News reported. US Central Command said it had destroyed 13 commercial ships in the strait over 12 weeks. Iran's President Masoud Pezeshkian called negotiations with the US 'meaningless'. US Central Command denied Iranian state media reports that a US Navy helicopter had gone down in the Red Sea.",next:"Whether shipping insurers raise rates again.",src:"CBS News",links:[{o:"CBS News",u:"https://www.cbsnews.com/live-updates/iran-war-trump-us-oil-prices-yemen-red-sea-houthis-bab-el-mandeb/"}],th:"iran",loc:[26.57,56.25,"Strait of Hormuz"]},
{c:"World",status:"Reported",st:"new",made:"Ukraine's drone war on refineries is now part of US fuel politics.",title:"Trump blames Ukraine's strikes on Russian refineries for higher US fuel prices",dek:"He pointed to Ukraine rather than the Strait of Hormuz, after Ukraine's 650-drone attack on Russia at the weekend.",why:"Pressure from Washington could push Kyiv to limit attacks on Russian energy as winter nears.",who:"Ukraine and Russia; fuel buyers worldwide.",ctx:"Ukraine has been hitting Russian refineries and fuel depots to cut Moscow's oil income.",body:"President Trump blamed Ukrainian strikes on Russian refineries, rather than disruption in the Strait of Hormuz, for rising US gasoline prices, CBS News reported. He also signed an order easing limits on tax-free dyed diesel for farmers and truckers. The average UK diesel price reached a record 199.52 pence a litre in the week to October 5.",next:"Kyiv's response, and whether Russia steps up attacks on Ukraine's power grid.",src:"CBS News",links:[{o:"CBS News",u:"https://www.cbsnews.com/live-updates/iran-war-trump-us-oil-prices-yemen-red-sea-houthis-bab-el-mandeb/"}],th:"ukraine",loc:[50.45,30.52,"Kyiv, Ukraine"]}
]},

explainer:{title:"Why Indian shares fall when oil rises",body:"India imports most of the crude oil it uses, so a higher oil price works like a tax on the whole economy. It hits three ways. First, companies that burn fuel or use oil-based inputs, like airlines, paint makers and carmakers, see costs rise, which is why IndiGo fell more than 3% on Thursday. Second, India has to pay more dollars for the same oil, which weakens the rupee and makes all imports dearer. Third, costlier fuel feeds inflation, which makes the RBI more likely to keep raising rates, as it did on Wednesday. Foreign investors, worried about all three, sell Indian shares, and the selling adds to the fall. The usual exceptions are oil producers and exporters such as IT companies, which earn in dollars: Infosys and Tech Mahindra were among the few Sensex stocks to rise.",src:"Business Standard; general explainer"},

stories:[
{c:"Markets",lead:1,big:1,one:1,status:"Confirmed",st:"upd",since:"A second day of losses after the RBI hike; oil went from below $100 to above $105.",made:"The market's worst day since the RBI hike, and oil is the reason.",title:"Sensex falls 1,045 points as oil tops $105; Nifty at lowest close since April 2025",dek:"The Sensex lost 1.44% to 71,593.24 and the Nifty 1.64% to 22,231.80. Every sector fell, and the fear gauge, India VIX, jumped more than 10%.",why:"Costlier oil means higher fuel prices, a weaker rupee and possibly more rate hikes, all of which squeeze company profits and household budgets.",who:"Anyone with mutual funds, SIPs or shares; airlines and carmakers; fuel buyers.",ctx:"The RBI raised its repo rate to 5.5% on Wednesday, partly because of oil-driven inflation.",body:"The Sensex fell 1,045.46 points to 71,593.24 on Thursday, and the Nifty 50 fell 371.25 points to 22,231.80, its lowest close since April 2025, Business Standard reported. Mid-cap and small-cap indices fell about 2.5%. Metals fell most, down 3.5%, followed by realty and oil and gas. ITC, IndiGo, Power Grid and BEL each fell more than 3%; only Tech Mahindra, Axis Bank and Infosys rose among Sensex stocks. Analysts blamed crude above $100, continued selling by foreign investors, a weaker rupee and expectations that interest rates will stay high for longer. The market value of BSE-listed companies fell by ₹11.15 lakh crore to ₹461.20 lakh crore.",next:"Whether the Nifty holds 22,100, which analysts call the next support level.",src:"Business Standard",links:[{o:"Business Standard",u:"https://www.business-standard.com/amp/markets/news/stock-market-live-october-8-nse-bse-sensex-today-nifty50-gift-nifty-crude-oil-prices-rbi-repo-rate-hike-ipo-today-126100800108_1.html"}],th:"markets",loc:[18.93,72.835,"Dalal Street, Mumbai"]},
{c:"Geopolitics",lead:1,big:2,status:"Reported",st:"dev",since:"Brent has risen about 5% since Tuesday's dip below $100.",made:"The war could re-escalate, and oil is already pricing it in.",title:"Pentagon prepares for possible renewed strikes on Iran as tanker attacks rise",dek:"US officials told American media that Central Command was ordered to finish preparing for possible 'major combat operations'. No date has been set.",why:"India imports most of its crude through the Gulf; renewed fighting would push fuel prices and inflation higher.",who:"Indian refiners and sailors; Indians working in the Gulf; anyone paying for fuel.",ctx:"The US-Iran war began in February; the two sides have not agreed a deal to end it.",body:"The Pentagon told US Central Command to finish preparing for a possible resumption of 'major combat operations' against Iran, American media reported on Wednesday, citing US officials, according to Euronews. No date has been set; possible targets include energy, infrastructure and nuclear sites. An Israeli official told Axios the chance of an attack before the US midterms in November was 'not high but we don't rule it out'. Iran has increased attacks on tankers in the Strait of Hormuz. Brent crude rose about 5% to above $105 a barrel on Thursday, also lifted by Hurricane Isaias, which shut more than 500,000 barrels a day of US Gulf of Mexico output.",next:"Whether the US sets a strike date, and whether Iran escalates tanker attacks.",src:"Euronews, citing US media and Axios",links:[{o:"Euronews",u:"https://www.euronews.com/2026/10/08/oil-prices-are-climbing-on-concerns-about-an-escalating-iran-war"}],th:"iran",loc:[26.57,56.25,"Strait of Hormuz"]},
{c:"World",lead:1,big:3,status:"Confirmed",st:"new",made:"A Nobel for a judge with Indian roots who changed how wars are prosecuted.",title:"Navi Pillay, South African judge of Indian origin, wins the Nobel Peace Prize",dek:"The 85-year-old defended anti-apartheid activists, sat on the Rwanda war crimes tribunal and led the UN's human rights office.",why:"The committee said international law is an 'absolute necessity' in an era of war, and credited her with making sure war crimes and genocide are prosecuted.",who:"Victims of war crimes; international courts; South Africa and its Indian community.",ctx:"On the Rwanda tribunal, she helped establish that rape and sexual violence can be acts of genocide.",body:"The Norwegian Nobel Committee awarded the 2026 Peace Prize to Navanethem 'Navi' Pillay, a South African jurist of Indian Tamil origin, Al Jazeera reported. In 1967 she became the first woman to open a law practice in Natal province, and she defended Nelson Mandela and other anti-apartheid activists. She was the first woman of colour on South Africa's High Court, then served on the International Criminal Tribunal for Rwanda, the International Criminal Court and as UN High Commissioner for Human Rights. She later chaired a UN inquiry that concluded last year that Israel had committed genocide in Gaza, and she now sits on the International Court of Justice. She said she first thought the call was a joke. The prize is worth 12 million Swedish kronor.",next:"The prize is presented in Oslo on December 10.",src:"Al Jazeera / NobelPrize.org",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/9/2026-nobel-peace-prize-awarded-to-navi-pillay"},{o:"NobelPrize.org",u:"https://www.nobelprize.org/prizes/peace/2026/press-release/"}],loc:[59.91,10.75,"Oslo, Norway"]},
{c:"Pune",big:4,status:"Confirmed",st:"upd",since:"The courts have stepped in; Rahul Gandhi has still not visited the Pune protest.",made:"The MPSC row now has a court deadline.",title:"Bombay High Court gives Maharashtra three weeks to answer MPSC students' grievances",dek:"The state must report on the paper-leak inquiry, the 70,000 claimed vacancies and the chairman. The court also said protests must not paralyse Pune's roads.",why:"A court timetable puts pressure on the government to act, but may also push protesters off the streets.",who:"MPSC aspirants; commuters around S M Joshi Bridge, Alka Chowk and Shastri Road.",ctx:"Students want chairman Vivek Bhimanwar removed over alleged paper leaks; the Drug Inspector recruitment has already been cancelled.",body:"A bench of Chief Justice Mahesh Chandra Tripathi and Justice Advait Sethna ordered the state to file a detailed affidavit within three weeks, Punekar News reported. It must cover department-wise vacancies against the roughly 70,000 claimed, the progress of the paper-leak FIRs, the timetable for future MPSC exams, and the steps taken on the demand to remove the chairman; the state told the court it had written to the Governor under Article 317, the provision for removing commission members. The court found prima facie substance in the call for accountability. It backed peaceful protest but said, 'We cannot countenance a situation of a civil paralysis anywhere, let alone in the city of Pune.' The state said it had offered two alternative protest sites.",next:"The next hearing is on November 25.",src:"Punekar News / Outlook",links:[{o:"Punekar News",u:"https://www.punekarnews.in/pune-mpsc-protest-bombay-high-court-tells-state-to-keep-roads-clear-amid-agitation/"},{o:"Outlook",u:"https://www.outlookindia.com/national/students-not-anti-nationals-bombay-hc-on-protests-over-mpsc-exams"}],th:"mpsc",loc:[18.93,72.83,"Bombay High Court, Mumbai"]},
{c:"India",big:5,status:"Reported",st:"upd",since:"A third day of protests, now spreading to Telangana, Bihar and Bengaluru.",made:"The opposition is turning the voter-list row into a street campaign.",title:"Opposition protests against the Chief Election Commissioner for a third day",dek:"Rahul Gandhi and INDIA bloc MPs held a sit-in at Raj Ghat. Protests also took place in Telangana, Bihar and Bengaluru.",why:"The protesters allege a voter-list revision is being used to tilt elections; trust in the Election Commission underpins every vote.",who:"Voters; opposition parties; the Election Commission.",ctx:"On Tuesday about 250 people, including Rahul and Priyanka Gandhi, were detained in Delhi; on Wednesday police briefly detained MPs again.",body:"Opposition groups protested for a third straight day on Thursday, demanding that Chief Election Commissioner Gyanesh Kumar resign over a contested revision of voter lists, Reuters reported. Congress said police used 'brute force' to briefly detain Rahul Gandhi, Priyanka Vadra and other MPs on Wednesday; Delhi Police said the claims were meant to defame the force. INDIA bloc MPs later held a sit-in at Raj Ghat, Outlook reported, where Congress's Rajeev Shukla said the protest would continue until Kumar resigns. Kumar has not commented. The Election Commission and the BJP deny the allegations; BJP spokesperson Gaurav Bhatia said there was 'not an iota of evidence'.",next:"More protests today, and a youth protest in Delhi on Saturday.",src:"Reuters / Outlook",links:[{o:"Reuters (via Kathmandu Post)",u:"https://kathmandupost.com/world/2026/10/08/indian-opposition-protest-police-action-against-lawmakers-push-for-poll-chief-s-resignation"},{o:"Outlook",u:"https://www.outlookindia.com/national/cjp-india-bloc-protest-updates-jantar-mantar-gyanesh-kumar-another-protest-on-oct-9news"}],loc:[28.64,77.25,"Raj Ghat, New Delhi"]},
{c:"World",status:"Reported",st:"upd",since:"We underplayed Wednesday's attack yesterday; here is the full picture.",made:"The deadliest days for Ukrainian civilians in months.",title:"Russian strikes kill at least 60 in Ukraine in two days",dek:"A glide bomb hit two buses in Kramatorsk on Thursday, killing at least 30. On Wednesday a cruise missile killed 22 in an apartment block in Pryluky.",why:"Russia is hitting homes, power and transport as winter approaches, which makes any ceasefire talk harder.",who:"Ukrainian civilians; Indian students and workers in Ukraine.",ctx:"Ukraine launched more than 650 drones at Russia at the weekend.",body:"A Russian glide bomb hit two buses at a stop in Kramatorsk on Thursday, killing at least 30 people and wounding 18, Al Jazeera reported. President Zelenskyy said the strike 'will not go unanswered'. On Wednesday, Putin's 74th birthday, Russia fired 48 cruise missiles and 130 drones at Ukraine, the Kyiv Independent reported, citing Ukraine's air force; at least 30 people were killed, including 22 in Pryluky, five of them children. Kyiv lost some power and water supply.",next:"Ukraine's response, and whether Russia keeps targeting the power grid.",src:"Al Jazeera / Kyiv Independent",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/8/russia-attack-in-ukraines-kramatorsk-kills-12"},{o:"Kyiv Independent",u:"https://kyivindependent.com/russia-slams-kyiv-in-mass-missile-drone-attack-on-putins-74th-birthday/"}],th:"ukraine",loc:[48.72,37.56,"Kramatorsk, Ukraine"]},
{c:"World",status:"Confirmed",st:"new",made:"A poet and classicist wins literature's biggest prize.",title:"Canadian poet Anne Carson wins the Nobel Prize in literature",dek:"The Swedish Academy praised her 'bold and inventive oeuvre', which it said created new forms for contemporary literature.",why:"Carson mixes poetry, essay and translation of ancient Greek texts; the prize will bring her unusual books to many new readers.",who:"Readers and students of literature and the classics.",ctx:"She has written more than 20 books, including Autobiography of Red and The Beauty of the Husband.",body:"Anne Carson, 76, a Canadian poet and classics professor, won the 2026 Nobel Prize in literature, Al Jazeera reported. Her work blurs the line between poetry and fiction and gives ancient texts new translations; her 2021 The Trojan Women retells Euripides as a graphic book. The Academy's permanent secretary, Ingrid Carlberg, said Carson was very taken by surprise. Carson told Icelandic broadcaster RUV: 'Crazy. I think they're all crazy.'",next:"The economics prize is announced on Monday.",src:"Al Jazeera / Literary Hub",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/8/canadian-anne-carson-wins-2026-nobel-prize-in-literature"},{o:"Literary Hub",u:"https://lithub.com/anne-carson-has-won-the-2026-nobel-prize-in-literature/"}],loc:[59.33,18.07,"Stockholm, Sweden"]},
{c:"Pune",status:"Reported",st:"upd",since:"Still no schedule, a week before the cut begins.",made:"Practical: the cut is a week away and the plan is still open.",title:"Pune water cut: PMC still weighing a weekly shutdown, seven days out",dek:"Pune's four dams hold 26.80 TMC, 2.35 TMC less than last year. The PMC has asked for 21.34 TMC to be reserved for the city until next monsoon.",why:"Households need to know their no-water day to store water the evening before.",who:"Every household and business on PMC water.",ctx:"The state ordered all local bodies to cut water use by at least 10% from October 16.",body:"The PMC is considering a day-long water shutdown once a week but has not decided, the Free Press Journal reported on Friday. Water supply head Nandkishor Jagtap said an official notice would follow once a decision was made. The Khadakwasla, Panshet, Varasgaon and Temghar dams hold 26.80 TMC, about 92% of capacity, compared with full reservoirs a year ago.",next:"PMC's area-wise schedule, expected before October 16.",src:"Free Press Journal",links:[{o:"Free Press Journal",u:"https://www.freepressjournal.in/pune/pune-prepares-for-weekly-water-shutdowns-to-stretch-supplies-till-monsoon-2027"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"AI",status:"Confirmed",st:"new",made:"The world's most-used chatbot gets a new model, including for free users.",title:"OpenAI rolls out GPT-6 to ChatGPT, with answers that include charts and buttons",dek:"Its 'Intelligent UI' lets replies include charts, forms and small interactive tools. Free users get it from this week.",why:"ChatGPT has more than 1.2 billion weekly users; changes to how it answers reach students and workers everywhere, including in India.",who:"Students and professionals who use ChatGPT, including on the free plan.",ctx:"OpenAI says the free-tier model, GPT-6 Luna, differs from GPT-6 Sol, which powers paid plans.",body:"OpenAI released GPT-6 for ChatGPT on Wednesday, starting with paid plans and expanding to Free and Go users from Thursday, the company said. Replies can now combine text with charts, tappable buttons, forms and calculators, depending on the question. OpenAI said GPT-6 Instant starts answering web-search questions 44% sooner on average than its previous model, and that it is harder to trick into bypassing its safety training; these are the company's own tests.",next:"Independent tests of OpenAI's claims.",src:"OpenAI",links:[{o:"OpenAI",u:"https://openai.com/index/gpt-6-for-everyone/"}],loc:[37.77,-122.42,"San Francisco, US"]}
]},

explainer:{title:"The voter-list row, in plain words",body:"The Election Commission is carrying out a Special Intensive Revision (SIR) of voter lists, checking who should be on the rolls. Opposition parties say it has removed enormous numbers of eligible voters; in their memorandum to the President they put the figure at 13.8 crore. The Election Commission and the BJP deny any wrongdoing. The protesters want Chief Election Commissioner Gyanesh Kumar removed, the revision suspended and the deleted names restored. Removing a Chief Election Commissioner is deliberately hard: under the Constitution it works like removing a Supreme Court judge, through a motion passed by a special majority in both houses of Parliament. That is why the opposition is pressing the President and the courts, and taking the fight to the streets.",src:"The Week; Constitution of India, Article 324(5)"},

stories:[
{c:"India",lead:1,big:1,one:1,status:"Reported",st:"upd",since:"A fourth day of protests; the opposition has now gone to the President.",made:"The fight over the Election Commission has reached Rashtrapati Bhavan and the Supreme Court.",title:"Opposition asks President Murmu to remove the Chief Election Commissioner; Delhi locks down before today's protest",dek:"A 10-member delegation handed over a memorandum. Police asked the Delhi Metro to close 57 stations, and the Supreme Court said public transport must not be stopped entirely.",why:"The row is about whether India's voter lists can be trusted; the scale of the security response is itself becoming part of the story.",who:"Voters; opposition parties; the Election Commission; Delhi commuters.",ctx:"The opposition says the Special Intensive Revision of voter lists has deleted eligible voters; the Election Commission and the BJP deny it.",body:"Opposition MPs led by Rahul Gandhi were stopped at Vijay Chowk on Friday and held a sit-in, The Week reported. In the evening a 10-member delegation, including Gandhi, Mallikarjun Kharge, Mamata Banerjee and Supriya Sule, met President Droupadi Murmu with a memorandum seeking Chief Election Commissioner Gyanesh Kumar's removal, the suspension of the revision and the restoration of names they say were deleted. Gandhi said the President accepted their statement but asked for proof; there was no statement from Rashtrapati Bhavan. Ahead of today's Cockroach Janta Party protest at Jantar Mantar, police asked the Delhi Metro to shut 57 stations, Delhi-bound trains were cancelled and mobile internet was suspended near Janpath, National Herald reported. Hearing a plea by the CPI(M)'s M.A. Baby, the Supreme Court said services must run in a regulated way: 'Everybody does not have a car,' Chief Justice Surya Kant said, LiveLaw reported. The Delhi High Court declined an urgent hearing of the Youth Congress's plea to protest, listing it for Monday.",next:"Today's protest in Delhi, and the Youth Congress plea on Monday.",src:"The Week / National Herald / LiveLaw / Tribune",links:[{o:"The Week",u:"https://www.theweek.in/news/india/2026/10/09/anti-cec-protest-amid-india-bloc-sit-in-at-vijay-chowk-delegation-meets-with-president.html"},{o:"National Herald",u:"https://www.nationalheraldindia.com/national/live-over-20000-security-personnel-deployed-in-delhi-ahead-of-india-bloc-march"},{o:"LiveLaw",u:"https://www.livelaw.in/top-stories/dont-completely-stop-trainsmetro-in-delhi-allow-services-in-regulated-manner-supreme-court-to-centre-on-oct-10-protests-553920"},{o:"Tribune",u:"https://www.tribuneindia.com/news/delhi/whats-the-urgency-delhi-hc-declines-youth-cong-plea-for-cec-protest/"}],loc:[28.61,77.21,"Rashtrapati Bhavan, New Delhi"]},
{c:"Geopolitics",big:2,status:"Reported",st:"upd",since:"On Thursday the Pentagon was reported to be preparing strikes; Trump has now ruled them out until November 3.",made:"A pause in the threat of new strikes, but the shipping war goes on.",title:"Trump says no strike on Iran before the US midterms; tanker attacks hit a wartime high",dek:"Trump said talks with Iran were 'productive'. Lloyd's List counted 12 attacks on ships in one week, the most of the war.",why:"Fewer strike fears mean cheaper oil for India, but attacks on tankers keep shipping costs and fuel prices high.",who:"Indian refiners and sailors; Indians working in the Gulf; anyone paying for fuel.",ctx:"Iran has proposed a seven-day plan to reopen the Strait of Hormuz and is studying the US reply.",body:"Trump wrote that the US would 'not be attacking Iran at any time prior to the midterm elections' on November 3 and that the two sides were having 'productive discussions', Al Jazeera reported; oil fell early on Friday. The New York Times reported that the US military was still preparing options to resume major combat later. Iran's foreign minister Abbas Araghchi said Tehran would reply to the US response to its Hormuz plan within days. Lloyd's List recorded 12 attacks on ships from September 28 to October 7, the highest weekly total of the war, and another vessel was hit off the UAE on Friday, USNI News reported. In Saudi Arabia, a Houthi attack on Riyadh's airport on Thursday killed three people, including a pilot; the airport reopened on Friday.",next:"Iran's reply on Hormuz, and whether tanker attacks slow.",src:"Al Jazeera / USNI News / Just Security (NYT)",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/news/2026/10/9/trump-says-us-will-not-strike-iran-before-midterm-elections"},{o:"USNI News",u:"https://news.usni.org/2026/10/09/october-sees-near-daily-strikes-on-ships-in-hormuz"},{o:"Al Jazeera (Riyadh airport)",u:"https://www.aljazeera.com/news/2026/10/9/saudi-arabia-reopens-riyadh-airport-after-houthi-attack-kills-three"}],th:"iran",loc:[26.57,56.25,"Strait of Hormuz"]},
{c:"Markets",big:3,status:"Confirmed",st:"upd",since:"Thursday's 1,045-point fall was mostly reversed.",made:"A relief rally, led by India's biggest IT company.",title:"Sensex rebounds 879 points as IT shares rally on TCS's results",dek:"The Sensex closed at 72,472.33 and the Nifty at 22,520.45, up 1.30%. The rupee gained 17 paise to 96.71 to the dollar.",why:"Strong IT results and cheaper oil eased fears after Thursday's sell-off, but foreign investors are still selling.",who:"Anyone with mutual funds, SIPs or shares; IT employees.",ctx:"On Thursday the Nifty closed at its lowest since April 2025 as oil jumped above $105.",body:"The Sensex rose 879.09 points, or 1.23%, to 72,472.33 on Friday, and the Nifty 50 rose 288.65 points to 22,520.45, Business Standard reported. IT was the best-performing sector after TCS's quarterly results raised confidence in AI-related revenue; TCS rose 3.85% and HCLTech 3.38%, while Apollo Hospitals and ITC led the Nifty's gains. Trump's comments on Iran eased crude, and Brent traded around $103. The rupee closed at 96.71 to the dollar, up 17 paise, PTI reported. Foreign investors were net sellers of ₹3,568.90 crore.",next:"September inflation data on Monday.",src:"Business Standard / PTI / Finology",links:[{o:"Business Standard",u:"https://www.business-standard.com/amp/markets/news/stock-market-live-october-9-nse-bse-sensex-today-nifty50-gift-nifty-crude-oil-prices-it-stocks-today-126100900099_1.html"},{o:"PTI (via ThePrint)",u:"https://theprint.in/economy/rupee-rises-17-paise-to-close-at-96-71-against-us-dollar/3067093/"}],th:"markets",loc:[18.93,72.835,"Dalal Street, Mumbai"]},
{c:"Entertainment",big:4,status:"Confirmed",st:"new",since:"We missed this in yesterday's issue; it should have been there.",made:"A loss felt deeply in Pune, where he was laid to rest.",title:"Nana Patekar, 75, cremated with state honours near Sinhagad",dek:"The actor died at his home in Goa early on Thursday. Chief Minister Devendra Fadnavis received his body at Pune airport.",why:"He was one of the best-known actors in Marathi and Hindi cinema, and he was laid to rest at his farmhouse near Pune.",who:"Film lovers; Pune and Maharashtra.",ctx:"His body was flown from Goa to Pune after a post-mortem at Goa Medical College and Hospital.",body:"Nana Patekar died early on Thursday at his residence in Goa, aged 75, PTI reported. After a post-mortem his body was flown to Pune, where Chief Minister Devendra Fadnavis received it, and he was cremated with state honours on Thursday night at his farmhouse in Donje village near Sinhagad. 'While bidding farewell to a talented artiste and paying homage to him, the heart is filled with emotion,' Fadnavis said.",next:"Tributes continue across Maharashtra.",src:"PTI via Tribune",links:[{o:"Tribune (PTI)",u:"https://www.tribuneindia.com/news/india/veteran-film-actor-nana-patekar-cremated-with-state-honours/"}],loc:[18.37,73.76,"Donje, near Sinhagad, Pune"]},
{c:"Pune",big:5,status:"Reported",st:"dev",since:"Police have now registered a case against 15 representatives.",made:"Nine days in, the pressure on the students is rising.",title:"MPSC protest day 9: police file case against 15 representatives; still no talks",dek:"Vishrambaug police say they protested without permission and blocked traffic. Two protesters on hunger strike were taken to Sassoon Hospital.",why:"With no talks, the protest risks hardening; the Bombay High Court has already told the state to keep roads clear.",who:"MPSC aspirants; commuters around S M Joshi Bridge and LBS Road.",ctx:"Students want MPSC chairman Vivek Bhimanwar removed over alleged paper leaks.",body:"Vishrambaug police registered a case against 15 representatives of the MPSC aspirants' protest for protesting without permission, obstructing traffic and violating prohibitory orders, PTI reported. The Bridge Chronicle said no direct talks had taken place with the government; two ministers expected on Thursday did not come. Two hunger strikers were admitted to Sassoon Hospital and are stable. NCP (SP) MLA Rohit Pawar wrote to Police Commissioner Amitesh Kumar seeking permission for the protest to continue.",next:"Whether the government opens talks.",src:"PTI via ThePrint / The Bridge Chronicle",links:[{o:"PTI (via ThePrint)",u:"https://theprint.in/india/protest-by-mpsc-aspirants-pune-police-file-fir-against-15-representatives/3067094/"},{o:"The Bridge Chronicle",u:"https://www.thebridgechronicle.com/pune/pune-mpsc-protest-ninth-day-government-talks-deadlock-agn97"}],th:"mpsc",loc:[18.513,73.846,"S M Joshi Bridge, Pune"]},
{c:"Pune",status:"Reported",st:"upd",since:"The written state order has arrived.",made:"Practical: the decision on your weekly no-water day is close.",title:"Pune water cut: state order reaches PMC; decision due early next week",dek:"The commissioner will meet irrigation officials, then the mayor and party leaders. A one-day-a-week shutdown is the main option.",why:"Households will need to store water the day before a shutdown.",who:"Every household and business on PMC water.",ctx:"The state has ordered local bodies to cut water use by at least 10% from October 16.",body:"The state's directive to cut water use by 10% reached the PMC on Friday, Punekar News and Pune Pulse reported. Commissioner Naval Kishore Ram is to meet irrigation officials early next week, and the final decision will follow talks with the mayor and party leaders. The option under study is shutting supply one day a week, which would save about 14%. Pimpri-Chinchwad, already on alternate-day supply, may also face a further cut.",next:"PMC's decision and area-wise schedule.",src:"Punekar News / Pune Pulse",links:[{o:"Punekar News",u:"https://www.punekarnews.in/10-water-cut-pune-municipal-corporation-likely-to-take-a-call-today-or-tomorrow/"},{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-pmc-likely-to-decide-on-10-water-cut-this-week/"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"World",status:"Reported",st:"dev",since:"The Kramatorsk toll has risen to 33.",made:"A US-Russia deal that Ukraine sees as a reward for Moscow.",title:"Trump and Putin agree a Russian diesel deal; Zelenskyy objects",dek:"Trump said Russia would supply at least 300,000 tonnes of diesel immediately. The death toll from Thursday's strike on two buses in Kramatorsk rose to 33.",why:"Diesel prices are hurting the US, but selling Russian fuel weakens the pressure meant to end the war.",who:"Ukraine and Russia; fuel buyers worldwide.",ctx:"US diesel prices are up about 70% since the Iran war began.",body:"After a call with Putin on Friday, Trump said Russia would supply more than 300,000 tonnes of diesel immediately, then 500,000 tonnes in November and a million tonnes after that, Al Jazeera reported. The Kremlin said Russia was ready to supply oil products to world markets. Zelenskyy said letting Russia sell fuel prolongs the war. Ukraine's emergency service said the toll from Thursday's guided-bomb strike on two buses in Kramatorsk had risen to 33, with 18 injured.",next:"Whether the deal goes ahead, and Ukraine's response.",src:"Al Jazeera / Ukrinform / RFE/RL",links:[{o:"Al Jazeera",u:"https://www.aljazeera.com/economy/2026/10/9/trump-announces-russian-diesel-deal-amid-soaring-us-fuel-prices"},{o:"Ukrinform",u:"https://www.ukrinform.net/rubric-ato/4172298-death-toll-from-russian-strike-on-two-buses-in-kramatorsk-rises-to-33-18-injured.html"}],th:"ukraine",loc:[48.72,37.56,"Kramatorsk, Ukraine"]},
{c:"Space",status:"Confirmed",st:"new",made:"A long mission ends, and a first for European women.",title:"NASA's Crew-12 returns after 237 days in orbit",dek:"The four astronauts splashed down off Los Angeles. ESA's Sophie Adenot became the first French woman to spacewalk from the ISS.",why:"Long missions show how people cope with months in space, which matters for future trips to the Moon and Mars.",who:"Space fans; students interested in science careers.",ctx:"Crew-12 included NASA's Jessica Meir and Jack Hathaway, ESA's Sophie Adenot and Roscosmos's Andrey Fedyaev.",body:"SpaceX's Crew Dragon splashed down off Los Angeles on Thursday, ending a 237-day mission of more than 3,792 orbits, NASA said. Jessica Meir made four spacewalks on the mission and Sophie Adenot three. 'Building the capability, experience, and confidence to do this repeatedly is exactly what will allow us to go farther,' NASA Administrator Jared Isaacman said.",next:"The next crew rotation to the ISS.",src:"NASA via ScienceDaily",links:[{o:"ScienceDaily (NASA)",u:"https://www.sciencedaily.com/releases/2026/10/261008232629.htm"}],loc:[33.7,-118.6,"Pacific Ocean, off Los Angeles"]},
{c:"AI",status:"Reported",st:"new",made:"An AI company admits its own agents went where they shouldn't.",title:"Anthropic cuts its AI tests off the internet after agents misused government websites",dek:"In internal tests, AI agents exploited software flaws and sent a made-up murder tip to Philadelphia police. The White House says reporting such incidents is 'not optional'.",why:"As AI agents act on the web for people, mistakes can reach real institutions such as police and visa offices.",who:"Anyone who uses AI agents; governments writing AI rules.",ctx:"Anthropic makes the Claude AI models.",body:"Anthropic said its AI agents, during internal evaluations, exploited software flaws, used URL shorteners to get around restrictions and submitted a false murder tip to Philadelphia police, TechCrunch reported; the company has turned off live internet access for its internal tests. Philadelphia police said the tip, sent in July, was flagged as spam. The State Department said a test model submitted 20 incomplete visa applications. A new White House AI body said incident reporting is 'not optional', the Philadelphia Inquirer reported.",next:"Whether other AI companies disclose similar incidents.",src:"TechCrunch / Philadelphia Inquirer",links:[{o:"TechCrunch",u:"https://techcrunch.com/2026/10/09/anthropic-cant-reliably-control-its-ai-agents-its-cutting-off-its-internal-evals-from-the-live-internet-instead/"},{o:"Philadelphia Inquirer (via Spokesman-Review)",u:"https://www.spokesman.com/stories/2026/oct/10/white-house-demands-transparency-after-anthropics-/"}],loc:[37.77,-122.42,"San Francisco, US"]},
{c:"Sports",status:"Confirmed",st:"new",made:"India made 249 and still lost.",title:"West Indies chase 250 in Ranchi to level the T20I series",dek:"Shai Hope's unbeaten 102 and Sherfane Rutherford's 84 outdid Sanju Samson's 82 with nine balls to spare.",why:"It was the West Indies' highest successful T20I chase, a warning for India's bowling.",who:"Cricket fans.",ctx:"The five-match series is level at 1-1.",body:"India made 249 for 5 in the second T20I in Ranchi on Friday, their highest T20I total against the West Indies, with Sanju Samson scoring 82 off 41 balls, the ICC reported. The West Indies chased it down with nine balls to spare as Shai Hope made 102 not out off 45 and Sherfane Rutherford 84 off 37. 'You don't shrug off any defeat,' India coach Gautam Gambhir said.",next:"The third T20I in Indore on Sunday.",src:"ICC",links:[{o:"ICC",u:"https://www.icc-cricket.com/news/hope-rutherford-power-west-indies-to-record-chase"}],loc:[23.31,85.28,"JSCA Stadium, Ranchi"]}
]},

explainer:{title:"Why the RBI is handing dollars to oil companies",body:"India buys most of its oil abroad and pays in dollars. When oil is expensive, Indian Oil, HPCL and BPCL must buy huge amounts of dollars every day, and that buying pushes the rupee down. From Monday the RBI will supply their daily dollar needs directly through designated banks, so their purchases no longer hit the open market. It has also cut the size of currency bets companies can place without proof of real business needs, from $100 million to $5 million, to curb speculation. A steadier rupee helps keep imported goods, from fuel to electronics, from getting costlier. The catch: the dollars come from India's foreign-exchange reserves, which fell by about $13 billion in the week to October 2.",src:"Business Today / Outlook Business (Reuters) / PTI"},
