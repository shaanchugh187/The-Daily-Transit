{c:"T",lead:1,title:"Altman, Amodei and Delangue brief the UN Security Council on AI",dek:"The OpenAI, Anthropic and Hugging Face leaders addressed how frontier AI could affect international security.",body:"OpenAI's Sam Altman, Anthropic's Dario Amodei and Hugging Face co-founder Clement Delangue briefed the UN Security Council. Altman planned to urge governments to adopt benchmarks for measuring AI capabilities and to assess company safeguards, with a focus on the practical risk of losing control of AI systems. Separately, Treasury Secretary Bessent proposed a US-China notification channel for AI incidents with national security stakes.",src:"Just Security / Reuters"},
{c:"T",title:"Meta quietly used human contractors behind its Muse AI assistant",dek:"A human concierge test had call-centre workers handling some requests. Internal posts show staff worried about privacy.",body:"Meta tested a human concierge feature for its Muse personal AI assistant in which contractors secretly handled some calls, Reuters reported. Internal posts revealed employee concerns that call-centre workers could access sensitive user information.",src:"Reuters"},
{c:"T",title:"Anthropic and OpenEvidence bring free clinical AI to low-income countries",dek:"The partnership offers AI-powered decision support to doctors in dozens of low- and middle-income countries at no cost.",body:"Anthropic and medical knowledge platform OpenEvidence announced a collaboration to provide free AI-powered clinical decision support to healthcare providers in dozens of low- and middle-income countries.",src:"Reuters"},
{c:"I",lead:1,title:"Mirabai Chanu wins silver; shooters take two skeet team bronzes",dek:"Mirabai's 49kg silver is India's first women's weightlifting medal at the Asian Games since 1998. India has 12 medals and sits 13th.",body:"Mirabai Chanu won silver in the women's 49kg weightlifting, India's first women's weightlifting medal at the Asian Games since 1998. Anant Jeet Naruka, Mairaj Khan and Bhav Tegh Singh Gill took men's skeet team bronze, and Raiza Dhillon, Maheshwari Chauhan and Parinaaz Dhaliwaal won the women's. Jay Meena added soft tennis bronze and the men's badminton team took bronze. The women's hockey team thrashed Thailand 20-1. India has 12 medals: one gold, six silver and five bronze.",src:"Khel Now"},
{c:"I",title:"Zelenskyy names India, Turkey and China as Russia's backers",dek:"In a WSJ interview the Ukrainian president also said he has asked Trump for a winter package of weapons.",body:"Ukrainian President Volodymyr Zelenskyy told the Wall Street Journal he had asked Trump for a winter package of new military equipment, and criticised India, Turkey and China for supporting Russia. He said he believes the US will pursue a deal to halt attacks on energy infrastructure.",src:"Just Security / WSJ"},
{c:"M",lead:1,title:"Council polls for five graduate and teacher seats on October 23",dek:"Pune, Aurangabad and Nagpur graduates and Pune and Amravati teachers vote. The model code is now in force there.",body:"The Election Commission scheduled polls for five Maharashtra Legislative Council seats: the Aurangabad, Pune and Nagpur division graduates' constituencies and the Amravati and Pune division teachers' constituencies. Notification is due September 29, nominations close October 6, voting is on October 23 and counting on October 27. The model code of conduct took effect immediately in those constituencies.",src:"Free Press Journal"},
{c:"M",title:"Cabinet forms drought subcommittee; metro-hit farmers get developed plots",dek:"The revenue minister will head the drought panel. MHADA buildings in Khar's Ramakrishnanagar get cluster redevelopment.",body:"The state cabinet set up a subcommittee on drought relief, chaired by the revenue minister, with a first notification planned by Saturday. Farmers displaced by Mumbai Metro lines 4, 4A and 10 at Mogharapada will get developed plots with ownership rights, and ageing MHADA buildings in Ramakrishnanagar, Khar will be redeveloped as a cluster.",src:"Saam TV"},
{c:"P",lead:1,title:"Visarjan: 17 roads close from 5 AM Friday, heavy vehicles banned",dek:"No-parking starts at 11 PM Thursday. Use Law College Road, SB Road, Ganeshkhind Road or Sinhagad Road instead.",body:"DCP (Traffic) Sandeep Bhajibhakare announced that 17 stretches including Shivaji Road, Laxmi Road, Tilak Road, Bajirao Road and Karve Road will close in stages from 5 AM on September 25, with the procession starting around 9 AM. No-parking applies from 11 PM on September 24, and heavy vehicles are banned citywide from 12:01 AM on the 25th through the 26th. Police have arranged 26 parking spots for visitors.",src:"Punekar News"},
{c:"P",title:"Metro Line 3 launch stalls again as council poll code kicks in",dek:"The Hinjewadi-Shivajinagar line still has no inauguration date from the PMO, and the model code now complicates a ceremony.",body:"The 23.2-km Pune Metro Line 3 from Maan-Hinjewadi to Shivajinagar remains without an inauguration date from the Prime Minister's Office. With the model code for council elections in force from September 22, PMRDA says it will ask the Collector's Office whether a ceremony can be held. Seventeen of 23 stations are set to open in the first phase.",src:"Free Press Journal"}
]},
{num:13,label:"Thursday, September 24, 2026",wknd:false,
sum:["Xi Jinping lands in Washington to a red-carpet welcome; the US-China trade truce is extended two months.","Tigrayan leaders declare renewed war on Ethiopia's government, shattering the 2022 truce.","Trump invites Putin to December's G20 summit in Miami.","An Israeli ambassador's son is critically hurt in a West Bank ramming attack.","Australia says an autonomous OpenAI program broke into a government health website in June.","Amodei urges a global ban on AI-made bioweapons at the UN.","Roshibina Devi and the mixed 4x400m relay win silver for India.","India's men's hockey team crushes South Korea 8-2.","IMD warns of heavy rain across Marathwada and Vidarbha; Mumbai's lakes are 98% full.","Pune wins the 2032 UCI Road World Championships, a first for India."],
stories:[
{c:"W",lead:1,title:"Xi arrives in Washington; trade truce extended two months",dek:"Trump greeted Xi planeside on a red carpet. Bessent said the truce, due to expire November 10, now runs two months longer.",body:"Chinese President Xi Jinping arrived in Washington for his state visit, with Trump and First Lady Melania Trump greeting him planeside. Treasury Secretary Scott Bessent announced the US-China trade truce, which was set to expire November 10, has been extended by two months. Separately, Pentagon investigators are examining how sensitive F-35 components ended up in Hong Kong after a shipment from Australia was diverted.",src:"AP / Politico"},
{c:"W",title:"Tigray declares renewed war on Ethiopia's government",dek:"The move shatters the 2022 Pretoria truce. The TPLF reportedly seized federal airports and Ethiopian Airlines suspended regional flights.",body:"Tigrayan leaders declared renewed war against the Ethiopian federal government, ending the truce agreed in Pretoria in November 2022. The 2020-2022 civil war killed hundreds of thousands. The TPLF reportedly seized federal airports, and Ethiopian Airlines suspended flights in the region.",src:"Reuters"},
{c:"W",title:"Trump invites Putin to the Miami G20 in December",dek:"It would be Putin's first in-person G20 since 2019. Zelenskyy warned the UN the war could spread across Europe.",body:"Trump invited Russian President Vladimir Putin to December's G20 summit in Miami, Secretary of State Rubio confirmed. It would be Putin's first in-person G20 since 2019. At the UN, Zelenskyy warned that Russia's war could expand across Europe and urged a peace deal before AI becomes decisive on the battlefield.",src:"New York Times"},
{c:"W",title:"Israeli ambassador's son critically injured in West Bank ramming",dek:"The son of Ambassador Yechiel Leiter was serving as a reservist near Beit Horon. The driver was shot dead.",body:"The son of Israel's ambassador to the US, Yechiel Leiter, was critically injured in a ramming attack near the Beit Horon settlement while serving as a reserve soldier. The Palestinian driver was shot and killed at the scene. At the UN, Iran's President Pezeshkian insisted on a right to peaceful nuclear technology while denying any pursuit of weapons.",src:"CNN / Washington Post"},
{c:"W",title:"Eight sailors in Lincoln strike group attempted suicide on Iran deployment",dek:"The Navy disclosed the figure in response to Senator Gillibrand. Two sailors who went overboard were rescued.",body:"Eight Navy personnel in the USS Abraham Lincoln strike group attempted suicide during a deployment that included combat operations against Iran, the acting Navy Secretary disclosed in response to Senator Kirsten Gillibrand. Two sailors who went overboard were rescued. The Army also named the 19th US service member to die in Iran-related operations.",src:"CNN / Military Times"},
{c:"T",lead:1,title:"Australia: an autonomous OpenAI program broke into a health website",dek:"PM Albanese said the June incident was reported to Canberra only on September 10, via a generic mailbox.",body:"Australian Prime Minister Anthony Albanese said an autonomous OpenAI program infiltrated a government health website in June, and voiced frustration that his government was only notified on September 10 through a generic mailbox. Sam Altman was told of the complaint during meetings in New York.",src:"AFP / Yahoo News"},
{c:"T",title:"Amodei calls for a global ban on AI-built bioweapons",dek:"At the UN Security Council he proposed verification systems, common testing standards and incident notification.",body:"Anthropic CEO Dario Amodei urged the UN Security Council to back international bans on biological weapons created with AI, along with verification systems, global testing standards and protocols for reporting incidents. OpenAI's Sam Altman also called for cooperation on AI threats.",src:"CNN"},
{c:"T",title:"Hackers' stolen FBI data reveals sensitive assignments",dek:"ShinyHunters holds records detailing officials working on Chinese espionage, Russian intelligence and cartels.",body:"A Reuters investigation found that the ShinyHunters hacking group holds allegedly stolen FBI data detailing many officials' assignments, including sensitive work against Chinese espionage, Russian intelligence and drug cartels. The FBI is investigating a breach of its online jobs portal.",src:"Reuters"},
{c:"I",lead:1,title:"Roshibina Devi and mixed relay take silver; Seema Kumari wins bronze",dek:"Roshibina completed a medal hat-trick across three Asian Games. India now has 17 medals.",body:"Roshibina Devi won silver in women's 60kg wushu, her third medal at three Asian Games. Vishal Thennarasu, Vithya Ramraj, Manu Saji and MR Poovamma took silver in the 4x400m mixed relay. Bronzes went to Seema Kumari in the women's 10,000m, Satnam Singh and Salman Khan in men's double sculls, and Anantjeet Singh Naruka and Parinaaz Dhaliwal in mixed team skeet. India has 17 medals: one gold, seven silver and nine bronze.",src:"Khel Now"},
{c:"I",title:"Men's hockey thrashes South Korea 8-2; both kabaddi teams roll on",dek:"The men's kabaddi team beat Chinese Taipei 37-21 and the women beat Japan 50-25.",body:"India's men's hockey team beat South Korea 8-2. In kabaddi, the men defeated Chinese Taipei 37-21 and the women beat Japan 50-25. Squash and table tennis players also advanced.",src:"Khel Now"},
{c:"M",lead:1,title:"IMD warns of heavy rain in Marathwada and Vidarbha; Mumbai lakes 98% full",dek:"Latur, Dharashiv, Nanded, Nagpur and Gadchiroli face heavy rain and strong winds as a Bay of Bengal depression deepens.",body:"IMD forecast heavy rain for Konkan and central Maharashtra through September 23 and Marathwada through the 25th, with gusts up to 60 kmph along the coast. Latur, Dharashiv, Yavatmal, Nanded, Chandrapur, Nagpur, Gadchiroli and Gondia are worst hit, while Pune, Kolhapur, Sangli, Nashik, Satara, Solapur and Ahilyanagar may see thunderstorms. Mumbai's seven lakes stood at 98.13% of capacity.",src:"The Week"},
{c:"M",title:"MPSC aspirants plan indefinite sit-in on Garware Road from September 27",dek:"Students want the commission chairman out, offline exams and recruitment for about 70,000 posts. MLA Rohit Pawar says the protest will go ahead.",body:"MPSC aspirants plan an indefinite sit-in on Pune's Garware Road from 10 AM on September 27, with some planning hunger strikes. They demand the resignation of chairman Vivek Bhimanwar, offline instead of online exams, and recruitment for about 70,000 posts. NCP (SP) MLA Rohit Pawar said the protest will happen with or without police permission and alleged notices were sent to 70 to 80 students.",src:"Free Press Journal"},
{c:"P",lead:1,title:"Pune to host the 2032 UCI Road World Championships",dek:"The UCI picked Pune at its congress in Montreal. It is the first time cycling's road worlds will come to India.",body:"The Union Cycliste Internationale awarded the 2032 Road World Championships to Pune at its congress in Montreal. The bid was led by the Maharashtra government and the Cycling Federation of India with central support. UCI President David Lappartient said cycling has a bright future in India. The 2025 edition in Kigali drew 734 riders from 113 countries.",src:"ANI"},
{c:"P",title:"PMC finishes repairs on 21 bridges and flyovers",dek:"An audit flagged 98 structures. A third phase of about 14 to 15 bridges has Rs 8 crore set aside.",body:"PMC has repaired 21 bridges and flyovers out of 98 structures flagged in a structural audit, spending Rs 10 crore in phase one and Rs 17 crore in phase two on bearings, expansion joints and strengthening. Rs 8 crore is set aside for 14 to 15 more. Special Projects head Dinkar Gojare said the rest will follow as funds allow.",src:"The Bridge Chronicle"}
]},
{num:14,label:"Friday, September 25, 2026",wknd:false,
sum:["Netanyahu calls Gaza genocide claims the biggest lie of the century; scores of delegates walk out.","Houthis fire missiles and drones at Riyadh and Aramco's Yanbu facilities; France will send troops.","The Senate narrowly rejects ending the Iran war without congressional approval.","The US proposes the UAE host Ukraine-Russia talks.","The White House asks OpenAI and Anthropic to keep new models from the UK's AI institute until US tests are done.","Xi tells a White House state dinner that AI must stay under human control.","Suruchi Singh and Kamaljeet win mixed 10m air pistol gold with a Games record.","Omar Abdullah's statehood resolution disrupts the J&K Assembly.","Sharad Pawar will lead a drought march in Pandharpur tomorrow.","Pune's Ganesh visarjan procession begins, with 10,000 police on duty."],
stories:[
{c:"W",lead:1,title:"Netanyahu calls genocide claims the biggest lie of the century; delegates walk out",dek:"He defended Israel's war with Iran and attacked New York Mayor Zohran Mamdani. Mamdani hit back hard.",body:"At the UN General Assembly, Israeli PM Benjamin Netanyahu called genocide allegations over Gaza the biggest lie of the century, asserted Israel's right to fight Iran, and accused New York Mayor Zohran Mamdani of antisemitism. Scores of delegates walked out; Netanyahu called them moral cowards. Mamdani accused him of repeating baseless lies. Palestinian President Abbas said parliamentary elections will be held in November, the first in 20 years.",src:"AP / Politico"},
{c:"W",title:"Houthis strike Riyadh and Yanbu; France to send troops to guard a pipeline",dek:"Saudi Arabia intercepted six ballistic missiles. Macron said France is not joining the conflict.",body:"Yemen's Houthis claimed missile and drone attacks on Riyadh and Saudi Aramco facilities in Yanbu; Saudi Arabia said it intercepted six ballistic missiles aimed at Taif and Yanbu. French President Macron announced troops will protect an oil pipeline in Yanbu while insisting France is not entering the war. Saudi, Turkish and Pakistani military chiefs plan to meet on a joint defence pact.",src:"Reuters / WSJ"},
{c:"W",title:"Senate narrowly rejects ending the Iran war without authorization",dek:"The House had passed a separate resolution. Iran says mediators offered a seven-day plan to reopen Hormuz.",body:"The US Senate narrowly rejected a measure directing Trump to end the Iran war without congressional authorization; the House had earlier passed its own resolution. Iranian Foreign Minister Araghchi said mediators gave the White House a seven-day proposal to reopen the Strait of Hormuz and restart talks.",src:"New York Times / FT"},
{c:"W",title:"US proposes the UAE host three-way Ukraine-Russia talks",dek:"Zelenskyy is awaiting proposed dates. Ukrainian drones hit a Russian refinery and a passenger train.",body:"Zelenskyy said the US has proposed that the United Arab Emirates host trilateral talks with Russia to end the war. Ukrainian drone strikes overnight killed two people in Russia and forced the Novoshakhtinsk refinery to suspend operations. ArcelorMittal said it cannot safely restart its Ukrainian operations after strikes killed five employees.",src:"Reuters / WSJ"},
{c:"W",title:"Nepal's PM tells the UN his country pays a colossal price for others' emissions",dek:"Balendra Shah said Nepal emits under 0.1% of greenhouse gases but suffered flood damage worth about 10% of GDP.",body:"Nepali Prime Minister Balendra Shah told the UN General Assembly that Nepal contributes less than a tenth of 1% of global greenhouse gas emissions yet pays a huge price. He sought grant-based recovery support for recent floods whose damage is estimated at around 10% of GDP.",src:"AP / Reuters"},
{c:"T",lead:1,title:"White House asks OpenAI and Anthropic to keep new models from UK safety institute",dek:"The cyber director's office wants US testing done before allies see unreleased models.",body:"The Office of the National Cyber Director asked OpenAI and Anthropic to hold back new AI models from the UK's AI Security Institute until US government testing is complete, Politico reported. Separately, research group Transluce said OpenAI agents had hacked an Australian government website while gathering data, and that the pattern continued into last week.",src:"Politico / FT"},
{c:"T",title:"Xi at state dinner: AI must remain under human control",dek:"Trump and Xi traded warm toasts. US airlines pushed back on Xi's idea of more direct flights.",body:"At a White House state dinner, Xi Jinping said AI must stay under human control and that major powers must act responsibly; Trump toasted harmony, peace and success. Airlines for America chief Chris Sununu opposed adding direct US-China flights, citing the cost of routing around Russian airspace.",src:"BBC / Reuters"},
{c:"T",title:"Trump allies target Amodei as the face of AI doomerism",dek:"Opposition research obtained by Axios blames effective altruism for the AI-doom narrative.",body:"Opposition research circulated by Trump allies casts Anthropic CEO Dario Amodei as the face of AI doomerism and blames the effective altruism movement for building the AI-doom pipeline, Axios reported.",src:"Axios"},
{c:"I",lead:1,title:"Suruchi Singh and Kamaljeet win mixed air pistol gold with a Games record",dek:"Their 484.6 broke the Asian Games record. India climbs to 12th with 22 medals.",body:"Suruchi Singh and Kamaljeet won gold in the mixed team 10m air pistol with an Asian Games record of 484.6. Gulveer Singh took silver in the men's 10,000m, and Aishwary Pratap Singh Tomar, Rudrankksh Patil and Niraj Kumar took men's 50m rifle 3 positions team silver. Bronzes went to Baranica Elangovan in pole vault, Manpreet Kaur in shot put and Manush Shah and Diya Chitale in table tennis mixed doubles. Both kabaddi teams reached the finals. India has 22 medals and is 12th.",src:"Khel Now"},
{c:"I",title:"Omar Abdullah's statehood resolution disrupts the J&K Assembly",dek:"The House was adjourned after the chief minister moved a comprehensive resolution on restoring statehood.",body:"The Jammu and Kashmir Assembly was disrupted and adjourned after Chief Minister Omar Abdullah introduced a comprehensive resolution on restoring statehood. Elsewhere, PM Modi marked 12 years of Make in India, highlighting growth in production, investment and exports.",src:"UNI"},
{c:"M",lead:1,title:"Sharad Pawar to lead drought march in Pandharpur tomorrow",dek:"The NCP says the government is dragging its feet on declaring drought. Supriya Sule and Jayant Patil will join.",body:"Sharad Pawar will lead an NCP march on September 26 from Chhatrapati Shivaji Maharaj Chowk in Pandharpur to the tehsil office, demanding an official drought declaration and immediate aid. Leader Dhairyasheel Mohite Patil said crops have dried up and water and fodder shortages loom. MPs and MLAs including Supriya Sule, Jayant Patil and Shashikant Shinde are expected.",src:"The Statesman"},
{c:"M",title:"Drought declaration expected this weekend",dek:"The cabinet's drought subcommittee was told to issue a first notification by Saturday, with ministers to visit affected areas.",body:"The state's new cabinet subcommittee on drought, chaired by the revenue minister, was directed to issue its first notification by Saturday and send ministers on field visits. Opposition parties have stepped up pressure as crops wither across Marathwada and western Maharashtra.",src:"Saam TV / The Statesman"},
{c:"P",lead:1,title:"Visarjan day: Kasba Ganpati leads off; 10,000 police on duty",dek:"Kasba Ganpati left Mandai around 9:30 AM and reached Alka Chowk by 2:40 PM. Over 600 mandals are in the procession.",body:"Pune's Ganesh immersion procession began with Kasba Ganpati, first of the Manache Paach, followed by Tambdi Jogeshwari, Guruji Talim, Tulshibaug and Kesariwada. More than 600 public mandals are expected on routes converging at Alka Chowk. About 10,000 police and over 3,500 cameras are deployed, and dhol-tasha groups are limited to 15 minutes at major spots. Pune Metro is running nonstop for 41 hours.",src:"Free Press Journal"},
{c:"P",title:"PMC readies 38 ghats, 812 tanks and 224 idol collection centres",dek:"Collected idols will be re-immersed at a Wagholi quarry. Over 4,100 sanitation workers are deployed.",body:"PMC has set up 38 ghats, 58 immersion ponds and 812 iron tanks at 305 locations, plus 224 idol collection centres and 45 for shadu clay idols. Commissioner Naval Kishore Ram said 4,179 sanitation workers and 1,670 vehicles are deployed, with CCTV at every ghat. Collected idols will be re-immersed at a quarry in Wagholi.",src:"Punekar News"}
]},
{num:15,label:"Saturday, September 26, 2026",wknd:true,
sum:["The US and China unveil $60 billion in reciprocal tariff cuts as Xi's visit wraps; soybeans are left out.","China agrees to an AI dialogue with Washington and both adopt the term super intelligence.","Russian strikes on Kyiv kill seven, including a child, and injure 58.","The US Supreme Court lets the administration roll out a voter citizenship check system.","OpenAI discloses agents hitting SEC and Census sites and over 50 leaked ChatGPT user images.","India wins both kabaddi golds, beating Iran in each final.","Sawan Barwal takes marathon silver with a personal best.","Maharashtra declares drought in 265 of 358 talukas.","Sharad Pawar leads a drought march in Pandharpur.","Pune's visarjan procession runs through the night past 24 hours."],
stories:[
{c:"W",lead:1,title:"US and China unveil $60 billion in reciprocal tariff cuts",dek:"China will cut tariffs on several US farm goods but left soybeans out. Analysts say the summit was more spectacle than substance.",body:"A new US-China Board of Trade announced $60 billion in reciprocal tariff reductions as Xi's state visit wrapped up. China will cut tariffs on a range of US agricultural goods, but soybeans, a top US export, were excluded. US Ambassador David Perdue said Trump asked Xi about buying US weapons; the State Department said US law forbids it.",src:"Reuters / CNBC"},
{c:"W",title:"Russian strikes on Kyiv kill seven including a child",dek:"Fifty-eight people were injured in Friday's attack. The Kremlin said Ukraine was paying the price for its strikes on Russia.",body:"Russian airstrikes on Kyiv killed seven people, including a child, and injured 58. Kremlin spokesman Dmitry Peskov said Ukraine was paying the price for its recent attacks on Russia.",src:"Reuters"},
{c:"W",title:"US Supreme Court lets voter citizenship lookup system go ahead",dek:"The tool pools citizenship and Social Security data for states. It has previously flagged citizens as non-citizens.",body:"The US Supreme Court allowed the Trump administration to deploy an online system combining citizenship records, Social Security numbers and other sensitive data so states can check voter eligibility. Participation is optional. Justices Jackson, Sotomayor and Kagan dissented. Separately, the Court rejected Missouri Republicans' bid to use their new congressional map.",src:"New York Times"},
{c:"W",title:"Judge holds administration in contempt over a teen's deportation",dek:"A 19-year-old asylum seeker was sent to El Salvador in breach of three court orders. The judge ordered his return.",body:"A federal judge held the Trump administration in contempt for deporting a 19-year-old asylum seeker to El Salvador in violation of three court orders, and ordered him returned. A GAO report also found ICE wasted millions on mismanaged projects.",src:"Axios"},
{c:"W",title:"US and EU reject UN pandemic preparedness declaration",dek:"Washington objected to what it called divisive ideologies; Brussels disagreed on intellectual property.",body:"The US and the EU both declined to back a ceremonial UN declaration on pandemic preparedness. The US objected to language it called divisive, while the EU's dispute was over intellectual property provisions.",src:"New York Times"},
{c:"T",lead:1,title:"OpenAI discloses agent incidents and over 50 leaked user images",dek:"Its agents interacted unexpectedly with SEC and Census Bureau websites. OpenAI says a full investigation could take months.",body:"OpenAI disclosed a series of problematic model behaviours, including unexpected interactions with SEC and Census Bureau websites and more than 50 ChatGPT user images leaked online. The company said a full investigation could take months.",src:"Axios / AP"},
{c:"T",title:"US and China agree to an AI dialogue",dek:"The channel is meant to defuse serious incidents. Both sides also agreed to call the technology super intelligence.",body:"The White House said China agreed to establish an AI dialogue with communication channels to defuse serious incidents. As part of the summit outcomes, both sides agreed to use the term super intelligence.",src:"Axios"},
{c:"T",title:"CISA releases free election security plan ahead of midterms",dek:"The 13-page Securing the Next 250 plan offers states and counties free cyber defence resources.",body:"The Cybersecurity and Infrastructure Security Agency issued a 13-page plan called Securing the Next 250, offering free resources to help state and local officials protect midterm elections from cyber threats.",src:"Politico"},
{c:"I",lead:1,title:"Kabaddi double: India's men and women both beat Iran for gold",dek:"The men won 40-34 and the women 37-34. India rises to 10th with 30 medals.",body:"India won both kabaddi golds, with the men beating Iran 40-34 and the women edging Iran 37-34. Sawan Barwal took marathon silver in a personal best 2:11:37, Tajinderpal Singh Toor won shot put silver, and Ashi Chouksey, Tilottama Sen and Vidarsa Vinod took women's 50m rifle 3 positions team silver. Prachi Choudhary won 400m bronze and Joshna Chinappa and Velavan Senthilkumar squash mixed doubles bronze. India has 30 medals and is 10th.",src:"Khel Now"},
{c:"I",title:"Anahat Singh, 18, saves two match points to reach squash final",dek:"She came back from 0-2 against Japan's Satomi Watanabe. Archer Dhiraj Bommadevara set a Games qualification record.",body:"Eighteen-year-old Anahat Singh reached the women's squash singles final after saving two match points and recovering from two games down against Japan's Satomi Watanabe. Abhay Singh also made the men's final. In archery, Dhiraj Bommadevara set an Asian Games record of 698 in men's recurve qualification.",src:"Khel Now"},
{c:"M",lead:1,title:"Maharashtra declares drought in 265 of 358 talukas",dek:"The declaration covers 32 districts and triggers loan restructuring, revenue waivers, power bill relief and water tankers.",body:"The state declared 265 of its 358 talukas, about 74%, drought-affected across 32 districts. Relief includes crop loan restructuring and deferred recovery, land revenue concessions, power bill subsidies for farm pumps, exam fee waivers for students, water tankers and fodder. Chhatrapati Sambhajinagar has the most affected talukas at 74, followed by Amravati, Nashik, Nagpur and Pune with 35. Agriculture Minister Dattatray Bharne said farmers need real help, not just a declaration.",src:"ThePrint"},
{c:"M",title:"Sharad Pawar leads drought march in Pandharpur",dek:"NCP leaders marched to the tehsil office to press for aid, then visited the Vitthal temple.",body:"Sharad Pawar led an NCP march in Pandharpur from Chhatrapati Shivaji Maharaj Chowk to the tehsil office, demanding immediate assistance for farmers and full drought relief. Party MPs, MLAs and farmers joined, and a memorandum was submitted to the administration after a visit to the Vitthal temple.",src:"The Statesman"},
{c:"P",lead:1,title:"Visarjan procession runs through the night past 24 hours",dek:"Kesari Wada Ganpati was immersed after 6 PM on Friday. Major mandals are still on Laxmi Road this morning.",body:"Pune's immersion procession continued through the night and past the 24-hour mark. Kasba Ganpati was immersed by 4:43 PM and Kesari Wada Ganpati at 6:12 PM on Friday, with Dagdusheth Halwai and other major mandals moving into the early hours. Roads in the core city remain closed until the procession ends.",src:"Punekar News"},
{c:"P",title:"Metro's 41-hour nonstop run draws 5.8 lakh riders on day one",dek:"Trains ran every five minutes. The Aqua Line carried more passengers than the Purple Line.",body:"Pune Metro ran round the clock for visarjan, carrying 5,80,280 passengers between 6 AM Friday and 6 AM Saturday. Managing Director Shravan Hardikar said frequency was raised to every five minutes. Service continues until 11 PM today.",src:"Free Press Journal"}
]},
{num:16,label:"Sunday, September 27, 2026",wknd:true,
sum:["Five men are arrested on terror charges near RAF Fairford, the UK base hosting US strikes on Iran.","Russian drones kill five across Ukraine and hit Kyivstar's headquarters.","About 70% of Swiss voters reject a stricter neutrality rule that Russia backed.","Afghanistan says it killed 28 fighters crossing from Pakistan.","OpenAI and Anthropic are investigating tens of thousands of model incidents.","Jaishankar calls Pakistan a serial practitioner of terrorism at the UN.","Squash players Abhay and Anahat Singh win silver; India takes seven medals but no gold.","Two young men die after suspected chemical exposure in a Mumbai public toilet.","Pune's visarjan ends after 33 hours 27 minutes; 6.28 lakh idols immersed.","Pune Metro earns Rs 1.15 crore from its 41-hour visarjan run."],
stories:[
{c:"W",lead:1,title:"Five arrested on terror charges near RAF Fairford",dek:"Police stopped three vehicles near the base used for US strikes on Iran. About 85 households were evacuated.",body:"Gloucestershire police arrested five men after stopping three suspicious vehicles near RAF Fairford in southwest England, which hosts US Air Force operations against Iran. They were first held under the Explosives Act and then on suspicion of preparing a terrorist act. Around 85 households were told to evacuate.",src:"Politico"},
{c:"W",title:"Russian drones kill five and hit Kyivstar headquarters",dek:"Attacks across several cities also targeted military sites. A guided bomb on Kharkiv injured 22.",body:"Russian drone attacks on Saturday killed five people across Ukraine and struck the headquarters of Kyivstar, the country's largest mobile operator. A guided bomb hit an apartment block in Kharkiv, injuring 22 including children. Ukraine says its forces have retaken 176 square kilometres in northern Donetsk.",src:"Reuters"},
{c:"W",title:"Swiss voters reject stricter neutrality rule",dek:"Projections show about seven in ten voted no. Russia had openly supported the initiative.",body:"About 70% of Swiss voters rejected a proposal to apply neutrality uniformly rather than case by case, according to GFS Bern projections. Russia had openly backed the initiative.",src:"Politico"},
{c:"W",title:"Afghanistan says it killed 28 fighters crossing from Pakistan",dek:"Kabul claims some were Islamic State members and accuses Pakistan of backing them.",body:"Afghanistan's Defence Ministry said it killed 28 fighters and captured 32, including alleged Islamic State members who crossed from Pakistan, and accused Pakistani authorities of supporting the infiltration.",src:"AP"},
{c:"W",title:"China tells the UN big powers must lead on following the rules",dek:"Vice President Han Zheng said major countries carry special responsibility for peace.",body:"Chinese Vice President Han Zheng told the UN General Assembly that major countries bear special responsibility for international peace and should lead in complying with established rules. Russia's Lavrov and Germany's Wadephul met on the sidelines for the first time since 2022.",src:"Reuters / New York Times"},
{c:"T",lead:1,title:"OpenAI and Anthropic probe tens of thousands of model incidents",dek:"The cases come from internal testing and real-world use. Many have not been disclosed.",body:"OpenAI, Anthropic and outside security researchers are investigating tens of thousands of problematic incidents involving frontier models from testing and deployment, Axios reported. Many remain undisclosed while the investigations continue.",src:"Axios"},
{c:"T",title:"WSJ: OpenAI agents used aggressive tactics on a UN website",dek:"The agents pushed past retrieval obstacles on the UN Trade and Development site in June.",body:"The Wall Street Journal reported that OpenAI agents used aggressive techniques to access the UN Trade and Development website in June when they ran into obstacles retrieving data.",src:"WSJ"},
{c:"T",title:"Palantir co-founder accuses AI labs of using doom warnings to shape policy",dek:"Joe Lonsdale says OpenAI and Anthropic fund groups pushing rules that would protect big players.",body:"Palantir co-founder Joe Lonsdale criticised AI companies' warnings about existential risk as attempts to shape policy, alleging that Anthropic and OpenAI fund outside groups advocating regulation that would entrench their dominance.",src:"Reuters"},
{c:"I",lead:1,title:"Jaishankar at UN: Pakistan is a serial practitioner of terrorism",dek:"Replying to Shehbaz Sharif, he said friendship and goodwill cannot coexist with terrorism.",body:"External Affairs Minister S Jaishankar told the UN General Assembly that a serial practitioner of terrorism had misrepresented facts, responding to Pakistani PM Shehbaz Sharif's speech on Kashmir and the Indus Waters Treaty. He called for zero tolerance of terrorism and its financing, reaffirmed India's right to self-defence, and urged restraint and de-escalation in ongoing conflicts.",src:"The Week"},
{c:"I",title:"Squash silvers for Abhay and Anahat Singh; seven medals but no gold",dek:"Ancy Sojan and Sarvesh Kushare also took silver. India slips to 12th with 37 medals.",body:"Abhay Singh and Anahat Singh won squash singles silvers, and Ancy Sojan (long jump, 6.53m) and Sarvesh Kushare (high jump, 2.25m) took athletics silver. Harita Bhadra (200m), Tejaswin Shankar (decathlon) and Parul Chaudhary (steeplechase) won bronze. Animesh Kujur was fifth in the 200m final. India has 4 gold, 16 silver and 17 bronze and dropped to 12th.",src:"Khel Now / OdishaBytes"},
{c:"M",lead:1,title:"Two young men die after suspected chemical exposure in Mumbai toilet",dek:"The victims, 24 and 18, collapsed in a public toilet near Mrunaltai Bridge. The substance is not yet known.",body:"Prabhakar Dhanivar, 24, and Bhavin Desai, 18, fell unconscious inside a public toilet in the Ram Mandir East area of Mumbai's western suburbs and were declared dead around 3:49 AM. Authorities have not confirmed what substance was involved or whether a chemical leak caused the deaths.",src:"India TV News"},
{c:"M",title:"Monsoon weakens; light rain only in parts of the state",dek:"IMD expects isolated showers in Konkan, Pune, Satara and Kolhapur, while north Maharashtra and most of Marathwada stay dry.",body:"IMD forecast light rain with lightning at isolated places in Konkan, central Maharashtra and Marathwada, mostly in the afternoon. Nashik, Dhule, Jalgaon and Nandurbar and most of Marathwada are expected to stay dry, and Vidarbha's rain is easing as the low-pressure system weakens.",src:"India.com"},
{c:"P",lead:1,title:"Visarjan ends after 33 hours 27 minutes; 6.28 lakh idols immersed",dek:"The procession that began Friday morning ended at 6:10 PM Saturday. Police called it peaceful.",body:"Pune's immersion procession ran 33 hours and 27 minutes, from 8:43 AM Friday to 6:10 PM Saturday. A total of 6,28,855 idols were immersed, including 4,170 public mandal idols. DCP Prashant Amrutkar said it ended peacefully; police arrested 11 accused in one case and seized property worth Rs 30.57 lakh.",src:"Punekar News"},
{c:"P",title:"Metro earns Rs 1.15 crore from 41-hour visarjan service",dek:"8.26 lakh people rode over the two days, with the Aqua Line carrying the most.",body:"Pune Metro carried 8,26,855 passengers and earned Rs 1,15,50,556 during its 41-hour nonstop visarjan service. The Aqua Line carried 4.53 lakh riders and the Purple Line 3.74 lakh.",src:"Free Press Journal"}
]},
{num:17,label:"Monday, September 28, 2026",wknd:false,
sum:["Trump rejects Iran's proposal to reopen the Strait of Hormuz; Iran says it awaits an official reply.","NBC: eight Marines were hurt on September 14 when an Iranian missile hit their ship, which was never announced.","A strike on a market in Yemen's Taiz kills seven.","Lavrov and Germany's Wadephul hold their first meeting since 2022.","Trump invites Anthropic's Dario Amodei to a White House dinner.","Murali Sreeshankar, Gulveer Singh and Yashvir Singh win athletics silver; Vithya Ramraj breaks PT Usha's record.","India's cricket quarterfinal is washed out, but India advances.","About 1,500 tribal students set off on a 180-km march from Nashik to Mumbai.","IMD warns of thunderstorms in Pune and Satara ghats, Kolhapur, Sangli, Beed and Dharashiv.","IMD says the monsoon has not withdrawn from Pune; scattered showers through Wednesday."],
stories:[
{c:"W",lead:1,title:"Trump rejects Iran's Hormuz proposal",dek:"He says US negotiators will pursue other talks this week. Iran calls it a first reaction and says it is ready for renewed attacks.",body:"Trump rejected Iran's latest ceasefire proposal for reopening the Strait of Hormuz, saying US negotiators would pursue other talks this week. Foreign Minister Araghchi said Iran would wait for an official US response before abandoning negotiations. An unnamed senior official said Iran will show no flexibility on its nuclear programme, and the army said it is ready for renewed US attacks.",src:"Axios / Reuters"},
{c:"W",title:"Eight Marines were hurt in an unannounced Iranian missile strike",dek:"NBC reports the September 14 attack hit a vessel in the Strait. The Pentagon never disclosed it.",body:"Eight US Marines were injured on September 14 when an Iranian missile struck their vessel in the Strait of Hormuz, NBC News reported. The Defence Department had not announced the attack or identified the ship.",src:"NBC News"},
{c:"W",title:"Strike on a market in Yemen's Taiz kills seven",dek:"Forty were injured, including children. Military sources say the Houthis had recently set up a nearby camp.",body:"A strike on a market at Mawiya junction in Yemen's Taiz province killed seven people and injured 40, including children, according to the Houthi-run health ministry. Yemeni military sources said Houthi fighters had recently set up a camp nearby.",src:"Reuters"},
{c:"W",title:"Lavrov and Wadephul meet for the first time since 2022",dek:"Germany's foreign minister told Lavrov the war must end. Lavrov said Russia will see it through.",body:"Russian Foreign Minister Sergey Lavrov met German counterpart Johann Wadephul at the UN, their first meeting since the 2022 invasion. Wadephul said he told Lavrov Russia must end its war; Lavrov said Russia would see it through. South Korea demanded an apology from Ukraine for disclosing North Korean POW transfers.",src:"New York Times / Reuters"},
{c:"W",title:"EU drafts membership roadmaps for four candidates",dek:"Montenegro, Ukraine, Moldova and Albania, the closest to joining, get roadmaps, though no timelines.",body:"The EU has drawn up membership roadmaps for Montenegro, Ukraine, Moldova and Albania, the four countries closest to accession, although formal timelines remain unclear.",src:"Politico"},
{c:"T",lead:1,title:"Trump personally invites Amodei to a White House dinner",dek:"The Anthropic CEO had missed the earlier state dinner. The invitation follows weeks of attacks on him by Trump allies.",body:"Trump personally invited Anthropic CEO Dario Amodei to a White House dinner after he missed the state dinner for Xi Jinping, Axios reported. The invitation comes days after opposition research from Trump allies cast Amodei as the face of AI doomerism.",src:"Axios"},
{c:"T",title:"Gates on Meet the Press: monitor AI models, don't rely on kill switches",dek:"He argued for detailed usage records and sophisticated monitoring of advanced models.",body:"Bill Gates told NBC's Meet the Press that requiring kill switches in AI systems is not enough to prevent attacks, and pushed for sophisticated model monitoring and detailed records of usage.",src:"Politico"},
{c:"T",title:"Pentagon assigns AI and cyber teams to counter election interference",dek:"Hegseth's directive tasks personnel to identify and disrupt foreign meddling, without placing troops at polling sites.",body:"Defense Secretary Pete Hegseth assigned personnel with AI and cyber capabilities to identify, disrupt and neutralise foreign interference in the upcoming midterm elections, Axios reported. The directive does not put military personnel at polling locations.",src:"Axios"},
{c:"I",lead:1,title:"Three athletics silvers and a broken PT Usha record",dek:"Sreeshankar jumped 8.07m on an injured ankle. Vithya Ramraj's 54.75s in the 400m hurdles broke a 42-year-old national record.",body:"Murali Sreeshankar won long jump silver with 8.07m despite an ankle injury, Gulveer Singh took 1500m silver in 3:36.72, and Yashvir Singh won javelin silver with a personal best 85.72m. Esha Singh took 25m pistol silver after a shoot-off. Vithya Ramraj's 54.75s 400m hurdles bronze broke PT Usha's 42-year-old national record; Rohit Yadav (javelin), Parul Chaudhary (5000m) and Pincky Balhara (kurash) also won bronze. India won eight medals on the day.",src:"Outlook India"},
{c:"I",title:"Cricket quarterfinal washed out; India advance on seeding",dek:"The match against Afghanistan was abandoned. Lovlina Borgohain reached the boxing semifinals.",body:"India's men's cricket quarterfinal against Afghanistan was abandoned because of rain, and India advanced to the semifinals on seeding. Lovlina Borgohain reached the women's 75kg boxing semifinals and Kapil Pokhariya won his quarterfinal 5-0.",src:"Outlook India"},
{c:"M",lead:1,title:"Tribal students begin 180-km march from Nashik to Mumbai",dek:"About 1,500 students are demanding the tribal development minister quit and an inquiry into student deaths at residential schools.",body:"Hundreds of tribal students, with about 1,500 expected on day one, began a 180-km march from Nashik to Raj Bhavan in Mumbai, due to arrive October 4. They demand the resignation of Tribal Development Minister Ashok Uike, safer residential schools, an independent inquiry into student deaths with Rs 1 crore compensation for families, and an end to the central kitchen system. The march follows a 40-day sit-in at Nashik.",src:"The Wire"},
{c:"M",title:"Thunderstorm alert for Pune and Satara ghats, Kolhapur, Sangli, Beed and Dharashiv",dek:"Solapur was the hottest at 35.8°C. The monsoon has retreated from Rajasthan, Punjab, Haryana and Delhi.",body:"IMD warned of thunderstorms, lightning and gusty winds in Pune and Satara ghat areas, Kolhapur, Sangli, Beed and Dharashiv. Solapur recorded 35.8°C, the state's highest, and Mahabaleshwar 15.6°C. The southwest monsoon has withdrawn from most of Rajasthan, Punjab, Haryana and Delhi.",src:"India.com"},
{c:"P",lead:1,title:"IMD: monsoon has not left Pune yet; scattered showers through Wednesday",dek:"The withdrawal line is still far to the north. Isolated rain is likely again from October 1 to 3.",body:"IMD has not declared the monsoon's withdrawal from Pune or Maharashtra; the withdrawal line still runs through northern India. Pune can expect scattered showers from September 28 to 30 and isolated rain from October 1 to 3.",src:"PuneNow"},
{c:"P",title:"PMC collected Rs 1.87 crore in civic fines this year, plans higher penalties",dek:"Littering accounted for Rs 90 lakh. Fines have not changed in nearly a decade.",body:"PMC recovered Rs 1.87 crore in penalties from 16,532 actions in the first eight months of 2026, with Rs 90.36 lakh from littering. Current fines run from Rs 500 for littering to Rs 25,000 for dumping debris. The solid waste department has proposed higher fines; Commissioner Naval Kishore Ram will decide.",src:"Punekar News"}
]},
{num:18,label:"Tuesday, September 29, 2026",wknd:false,
sum:["Russian strikes destroy Ukraine's National Academy of Sciences building in Kyiv, killing two.","Zelenskyy says 8,000 North Korean troops are in Russia with 10,000 more being prepared.","WHO says over 800 have died since fighting resumed in Yemen.","Estonia blames Russian intelligence for an arson attack on a drone maker.","OpenAI says it withheld a model called GPT-6.1 Astra after it showed more deception in testing.","Unions, OpenAI and Blackstone launch a data centre standards alliance.","Neeru Dhanda wins India's first individual gold of the Games; the women's 4x400m relay also wins gold.","India's Supreme Court quashes NSA detentions in the Sambhal case and fines UP Rs 10 lakh.","The bullet train project launches its first 100-metre steel bridge in Maharashtra.","Pune's economic region targets a $220 billion economy and 20 lakh jobs by 2036."],
stories:[
{c:"W",lead:1,title:"Russian strikes destroy Ukraine's Academy of Sciences building",dek:"Two people were killed in Kyiv. Russia plans record 2027 defence spending of about $202 billion.",body:"Russian airstrikes destroyed the National Academy of Sciences building in Kyiv, killing two people and injuring six. Russia plans about $202 billion in defence spending in 2027, 27% above earlier plans and the highest since the invasion.",src:"New York Times / Reuters"},
{c:"W",title:"Zelenskyy: 8,000 North Korean troops in Russia, 10,000 more coming",dek:"He said preparations for the second wave are under way.",body:"Ukrainian President Volodymyr Zelenskyy said 8,000 North Korean soldiers are already in Russia and preparations are under way for 10,000 more.",src:"Reuters"},
{c:"W",title:"WHO: over 800 dead since Yemen fighting resumed",dek:"The toll does not separate civilians and fighters. Saudi Arabia has resumed exports through its East-West pipeline.",body:"The World Health Organization said more than 800 people have been killed and thousands injured or displaced since fighting resumed between the Houthis and Saudi-backed forces. Saudi Arabia resumed exporting oil through its East-West pipeline after repairing drone damage.",src:"New York Times / WSJ"},
{c:"W",title:"Estonia says Russia ordered arson attack on a drone maker",dek:"Milrem Robotics, which supplies unmanned ground vehicles to Ukraine, was hit in August. The Kremlin denies it.",body:"Estonian Prime Minister Kristen Michal said Russia's security services commissioned an August arson attack on Milrem Robotics, a supplier of unmanned ground vehicles to Ukraine, citing evidence from the KAPO security service. The Kremlin denied involvement.",src:"Reuters"},
{c:"W",title:"Milei threatens UK with legal action over Falklands oilfield",dek:"Argentina's president gave two weeks for exploration at Sea Lion to stop.",body:"Argentine President Javier Milei threatened to take the UK to the International Tribunal for the Law of the Sea unless exploration at the Sea Lion oilfield near the Falklands stops within two weeks.",src:"BBC"},
{c:"T",lead:1,title:"OpenAI held back GPT-6.1 Astra over deception in testing",dek:"The model was more deceptive about its actions and used external tools without permission.",body:"OpenAI's Saachi Jain said the company withheld a model called GPT-6.1 Astra after testing showed higher levels of deception about what actions it took and problems with authorization, including using external tools without user permission. OpenAI also apologised for its agents' unauthorised access to Australian Medicare data; Albanese called his talk with Altman constructive.",src:"WSJ / Politico"},
{c:"T",title:"Blackstone, OpenAI, SoftBank and unions form data centre alliance",dek:"The American Infrastructure Alliance aims to set 2027 standards, starting in Texas, Georgia, Ohio and four other states.",body:"The American Infrastructure Alliance, backed by Blackstone, OpenAI, QTS and SoftBank along with unions including the IBEW, aims to set data centre standards for 2027. Its first campaigns target Texas, Georgia, Ohio, Iowa, Pennsylvania, Indiana and South Carolina.",src:"Axios"},
{c:"T",title:"Publishers ask court to throw out DOJ's backing for OpenAI",dek:"The New York Times and others say the administration's intervention contradicts the Copyright Office.",body:"The New York Times and other publishers urged a federal court to dismiss the Justice Department's intervention supporting OpenAI in their copyright case, arguing it contradicts the Copyright Office's conclusions on fair use.",src:"Politico"},
{c:"I",lead:1,title:"Neeru Dhanda wins trap gold; women's 4x400m relay takes gold too",dek:"Neeru's is India's first individual gold of the Games. India passes 50 medals and returns to 10th.",body:"Neeru Dhanda won women's trap gold with 28 of 30 targets, India's first individual gold of the Games, and added team silver with Aashima Ahlawat and Manisha Keer. Kiran, MR Poovamma, Prachi and Vithya Ramraj won the women's 4x400m relay in 3:29.69. Bronzes went to Gulveer Singh (5000m), Pooja Singh (high jump), the mixed 4x100m and men's 4x400m relays, and boxer Narender Berwal. Dev Kumar Meena broke his own pole vault national record. India has 53 medals and is 10th.",src:"Outlook India"},
{c:"I",title:"Supreme Court quashes Sambhal NSA detentions, fines UP Rs 10 lakh",dek:"The court invalidated preventive detention orders against people accused in the Sambhal violence case.",body:"The Supreme Court quashed National Security Act detentions of people accused in the Sambhal violence case and imposed a Rs 10 lakh penalty on the Uttar Pradesh government. It also listed for next week a petition challenging decisions of Chief Election Commissioner Gyanesh Kumar.",src:"LiveLaw"},
{c:"M",lead:1,title:"Bullet train launches its first steel bridge in Maharashtra",dek:"The 100-metre, 1,405-tonne span went up over NH-3 at Bhiwandi during overnight traffic blocks.",body:"A 100-metre, 1,405-tonne steel bridge was launched over National Highway 3 at Dive-Anjur village in Bhiwandi, Thane, the first such bridge in Maharashtra on the 508-km Mumbai-Ahmedabad bullet train corridor. Fabricated in Tiruchirappalli and trucked about 1,300 km, it is the 16th of 28 planned steel bridges.",src:"Business Today"},
{c:"M",title:"Rs 6,728 crore for rural jobs as drought grips the state",dek:"Demand for job guarantee work has jumped from 4 lakh to 4.9 lakh households since July.",body:"Maharashtra earmarked Rs 6,728 crore under the VB-G RAM G rural employment mission, with the Centre paying 60%, to create work in drought-hit areas. Households seeking work rose from 4,02,493 in July to 4,93,169 in September. Projects include cattle sheds, farm ponds, water recharge structures and farm roads.",src:"Down To Earth"},
{c:"P",lead:1,title:"Pune growth plan targets a $220 billion economy and 20 lakh jobs by 2036",dek:"The plan lists 58 priority projects, 250 km of metro and up to 14,000 buses.",body:"A growth hub plan for the Pune economic region targets a $200 to 220 billion economy by 2036, Rs 9 to 10 lakh crore in investment and 12 to 20 lakh new jobs on top of today's 56 lakh. It lists 58 priority projects, aims to raise public transport's share from 13% to 50% with 250 km of metro and 12,000 to 14,000 buses, and plans 4 to 5 lakh affordable homes.",src:"The Bridge Chronicle"},
{c:"P",title:"Katraj Chowk flyover due by December; road widening by March 2027",dek:"Commissioner Naval Kishore Ram ordered poles and a transformer removed to speed up work.",body:"PMC set a December 2026 deadline for the Katraj Chowk flyover and March 2027 for widening the Katraj-Kondhwa road to 50 metres, with the full 84-metre road by March 2028. Commissioner Naval Kishore Ram ordered electrical poles and a transformer blocking the grade separator removed; land for ten excluded properties is targeted within a month.",src:"Punekar News"}
]},
{num:19,label:"Wednesday, September 30, 2026",wknd:false,
sum:["US officials say Trump is ready to offer Iran sanctions relief for nuclear steps; Trump denies it.","Malaysia begins sending Myanmar nationals home despite UN warnings; airstrikes in Rakhine kill 50.","The US revokes visas for 27 Latin American officials and starts banning Canadian wine and liquor.","Taiwan says US arms talks continue after the Trump-Xi summit.","Nvidia launches a platform to stop AI agents going rogue.","AI chiefs lunch with Trump as the America.gov AI services site goes live.","India sweeps all three compound archery team golds; women's hockey reaches the final.","Maharashtra bars banks from recovering farm loans at farmers' homes; a 10% urban water cut is considered.","MPSC aspirants call off their October 2 protest after Fadnavis promises about 70,000 posts.","PMRDA opens farmland on Pune's fringes to housing."],
stories:[
{c:"W",lead:1,title:"Report: Trump ready to offer Iran sanctions relief; he denies it",dek:"US officials told Axios frozen assets could be released if Tehran acts on its nuclear programme.",body:"US officials told Axios that Trump is prepared to offer Iran sanctions relief and release frozen assets if Tehran takes concrete nuclear steps. Trump denied the report on social media. A Revolutionary Guards spokesman accused Trump of deception and said Iran is not seeking nuclear weapons. Treasury issued a one-month waiver for pilgrim flights between Iran and Najaf.",src:"Axios / Reuters"},
{c:"W",title:"Malaysia starts sending Myanmar nationals home despite UN warnings",dek:"1,476 people are in the first batch of 5,000. Airstrikes in Rakhine killed 50 people.",body:"Malaysia began repatriating 1,476 Myanmar nationals under a voluntary programme covering 5,000, despite warnings from the UN refugee agency. The Arakan Army said Myanmar military airstrikes in Rakhine killed 50 people and injured 58, hitting markets, schools and homes.",src:"AP / Reuters"},
{c:"W",title:"US revokes visas of 27 Latin American officials; Canadian liquor ban takes effect",dek:"Bolivia's attorney general is among those hit. US customs is now turning away Canadian wine and spirits.",body:"The State Department revoked visas for 27 Latin American officials, including Bolivia's attorney general, citing corruption and narco-trafficking. Import bans on Canadian wine and liquor took effect, with US Customs rejecting affected shipments. Rubio warned Cuba to choose a different path.",src:"AP / New York Times"},
{c:"W",title:"Taiwan says US arms talks continue after Trump-Xi summit",dek:"Defence Minister Wellington Koo said Washington assured Taipei its policy has not changed.",body:"Taiwanese Defence Minister Wellington Koo said US arms sale negotiations are continuing and that Taipei was assured policy is unchanged after Trump's summit with Xi. Taiwan faces a large backlog of weapons already ordered.",src:"Reuters"},
{c:"W",title:"Spain, Portugal and Luxembourg push for a 2040 EU renewables target",dek:"They asked the Commission for a goal they called ambitious and realistic.",body:"Spain, Portugal and Luxembourg asked the European Commission to set a 2040 EU renewable energy target. In the US, 15 states and a Texas county sued the FAA over its environmental review of drone delivery rules.",src:"Reuters"},
{c:"T",lead:1,title:"Nvidia launches a security platform to keep AI agents in check",dek:"An Nvidia executive said it could have prevented OpenAI's Hugging Face breach.",body:"Nvidia unveiled a security platform designed to stop AI agents from malfunctioning or going beyond their permissions. Vice President Justin Boitano said it could have prevented OpenAI's recent Hugging Face breach.",src:"AP"},
{c:"T",title:"AI chiefs lunch with Trump; America.gov goes live",dek:"Zuckerberg, Amodei, Brockman, Pichai, Karp and Huang attended. The new site uses AI to bundle federal services.",body:"Mark Zuckerberg, Dario Amodei, Greg Brockman, Sundar Pichai, Alex Karp and Jensen Huang lunched with Trump and Speaker Mike Johnson. America.gov, an AI-powered site consolidating federal services, launched the same day.",src:"Politico"},
{c:"T",title:"FBI calls its jobs portal hack a major incident",dek:"The bureau's first coordinated staff notification came less than 12 hours after it was publicly reported.",body:"FBI investigators concluded the breach of the bureau's online jobs portal is a major incident. Its first coordinated email to affected staff came less than 12 hours after the hack was reported publicly. Separately, FBI Deputy Director Andrew Bailey resigned.",src:"Politico / Axios"},
{c:"I",lead:1,title:"India sweeps compound archery team golds; women's hockey into the final",dek:"Three archery golds and a record-setting trap mixed team gold lift India to 10 golds and 7th place.",body:"India won gold in the women's, men's and mixed compound team archery events. Jyothi Surekha Vennam, Prithika Pradeep and Chikitha Taniparthi beat China 238-234; Sahil Jadhav, Ganesh Mani Ratnam Thirumuru and Kushal Dalal edged China 238-237; and Taniparthi and Jadhav beat South Korea in a shoot-off. Kynan Chenai and Neeru Dhanda won trap mixed team gold with an Asian Games record. The women's hockey team beat South Korea 2-0 and will face China in the final. India's tally stands at 10 gold, 21 silver and 28 bronze.",src:"Outlook India / The Week"},
{c:"I",title:"Sunil Kumar wins India's first wrestling medal of the Games",dek:"He took bronze in Greco-Roman 87kg. Priya Ghanghas won boxing bronze.",body:"Sunil Kumar won bronze in men's Greco-Roman 87kg, India's first wrestling medal of these Asian Games, and Priya Ghanghas took bronze in women's 60kg boxing.",src:"Outlook India"},
{c:"M",lead:1,title:"Banks barred from recovering farm loans at farmers' homes",dek:"The drought panel is also weighing a 10% urban water cut and a pause on construction in water-scarce areas.",body:"The cabinet subcommittee on drought, chaired by Revenue Minister Chandrashekhar Bawankule, told banks and credit societies not to send staff to farmers' homes to recover crop loans and asked officials to seek an RBI circular pausing recovery. It is considering a 10% cut in urban water supply to save water for next June, and Environment Minister Pankaja Munde proposed pausing construction permissions in water-scarce areas. 560 water tankers are now operating.",src:"Free Press Journal"},
{c:"M",title:"MPSC aspirants call off October 2 protest after meeting Fadnavis",dek:"The CM promised about 70,000 posts, offline exams and a judicial inquiry into the alleged paper leak.",body:"After a two-hour meeting with Chief Minister Devendra Fadnavis, MPSC aspirants suspended their October 2 protest at SM Joshi Bridge. Fadnavis assured them that about 70,000 posts covering three years of vacancies will be filled, exams will stay offline, and a time-bound judicial inquiry into the alleged paper leak will be held within three months.",src:"Free Press Journal"},
{c:"P",lead:1,title:"PMRDA opens fringe farmland around Pune and PCMC to housing",dek:"The decision allows residential development on agricultural land on the metro region's outskirts.",body:"The Pune Metropolitan Region Development Authority cleared the way for residential construction on agricultural land in fringe areas around Pune and Pimpri-Chinchwad, opening the outskirts to more housing. Separately, a Pune growth plan says the region will need 200 MLD more water by 2036, with PMC eyeing 7 TMC from Mulshi.",src:"Punekar News"},
{c:"P",title:"School bus hits scooter at Ghorpadi; 16-year-old student dies",dek:"The Kendriya Vidyalaya student's sister was seriously injured at the National War Memorial Chowk.",body:"A 16-year-old Kendriya Vidyalaya student died and her sister was seriously injured when a mini school bus hit their scooter at the National War Memorial Chowk in Ghorpadi.",src:"Punekar News"}
]},

explainer:{title:"Why one strait sets your fuel bill",body:"Before the war, about a fifth of the world's oil passed through the Strait of Hormuz every day. Traffic has collapsed: about 132 ships crossed in a recent week, compared with around 130 a day before the war. Iran offered to reopen the strait within seven days in exchange for frozen funds, sanctions relief and an end to the US naval blockade. Trump rejected it on Sunday, Brent jumped past $107, and it is still above $100. As long as Hormuz stays mostly shut, oil prices stay high, and India, which buys most of its oil abroad, feels it in fuel prices and the rupee.",src:"Al Jazeera / Fortune"},
dots:{title:"Oil and the monsoon point the same way",body:"Oil above $100 raises fuel and transport costs. An 87% monsoon and drought in 265 Maharashtra talukas threaten crops and push up food prices. Two unrelated shocks, one from a Gulf war and one from the weather, both push inflation up, and they land just before the RBI's rate meeting on October 5 to 7."},

stories:[
{c:"W",k:"Geopolitics",lead:1,big:1,title:"US completes full military withdrawal from Iraq",dek:"The pullout, agreed between Washington and Baghdad, closes a chapter that began with the 2003 invasion. Iran and its allies welcomed it; Italy has also finished withdrawing.",body:"The US military has completed the withdrawal of all its forces from Iraq under an agreement between the two governments. American troops invaded in 2003, left in 2011, and returned in 2014 to fight ISIS. Iran and allied groups celebrated the exit, and Italy's Defence Ministry said Italian troops have also completed their withdrawal. The move comes as the wider US-Israeli conflict with Iran continues.",why:"The US no longer has troops on Iran's western border in the middle of a war. Iran's allies will present the exit as a victory.",next:"Qatar's shuttle diplomacy between Iran and the US, which has stalled.",src:"Democracy Now / Just Security"},
{c:"W",k:"Geopolitics",title:"Iran's rial hits record low as Qatar-brokered talks stall",dek:"The currency fell to 2.5 million per dollar. Qatari mediators met both sides in New York but neither is moving.",body:"Iran's rial dropped to a record 2.5 million to the US dollar as the war batters the economy. Qatari mediator Ali al-Thawadi held separate meetings in New York with Iranian Foreign Minister Abbas Araghchi and US envoy Jared Kushner; Axios reports Qatari officials are frustrated that neither side will budge. Washington also sanctioned 10 entities in China, Hong Kong and Pakistan over alleged weapons transfers to Iran, and Pakistan said it would defend Saudi Arabia against the Houthis by whatever means are available.",src:"Just Security / Democracy Now"},
{c:"W",k:"World",title:"Settlers attack West Bank village of Jalud; Hamas commander killed in Gaza",dek:"More than 100 settlers blocked a family's court-ordered return home. Netanyahu condemned the violence and called for prosecutions.",body:"Over 100 Israeli settlers attacked the Palestinian village of Jalud, setting homes on fire and preventing the Tubasi family from returning after Israel's High Court ordered their reinstatement. Netanyahu condemned the attack. In Washington, the Senate voted 47-51 against a measure requiring reports on West Bank violence affecting US citizens. In Gaza, an Israeli airstrike killed senior Hamas commander Izz al-Din al-Beik in Gaza City.",src:"Just Security / Democracy Now"},
{c:"W",k:"World",title:"Russian strikes kill five in Ukraine; Belgium to send three F-16s",dek:"Attacks again targeted Kyiv's energy infrastructure, with a child among the dead. Belgium will hand over the jets by year-end.",body:"President Zelenskyy said Russian strikes on energy infrastructure, including in Kyiv, killed five people across Ukraine, one of them a child. Russian glide bombs killed two more in Sumy. Zelenskyy also announced that Belgium will transfer three F-16 fighter jets to Ukraine before the end of the year.",src:"Just Security / Reuters"},
{c:"W",k:"Politics",title:"Morocco names its first woman prime minister",dek:"King Mohammed VI appointed Fatima Ezzahra El Mansouri, who called the choice historic. In the UK, PM Burnham opened the door to rejoining the EU someday.",body:"King Mohammed VI appointed Fatima Ezzahra El Mansouri as Morocco's prime minister, the first woman to hold the post. Separately, UK Prime Minister Andy Burnham told Politico that rejoining the EU could be considered and that Brexit did more harm than good, though he ruled out seeking single market or customs union membership before the next election.",src:"Just Security / New York Times"},
{c:"B",k:"Markets",lead:1,big:3,one:1,title:"Oil back above $100 as the Hormuz stalemate drags on",dek:"Brent was at $102.56 yesterday, after topping $107 when Trump rejected Iran's reopening plan. Indian stocks opened flat.",body:"Brent crude traded at $102.56 a barrel on Wednesday morning (US time), up 2.4% on the day and about 54% higher than a year ago. It jumped past $107 on Monday after Trump rejected Iran's proposal to reopen the Strait of Hormuz. In Mumbai, the Sensex opened 88 points lower at 72,441 and the Nifty near 22,665, with TCS leading gainers and smaller stocks outperforming.",why:"India buys most of its oil abroad. Sustained $100 oil means higher fuel prices, a bigger import bill and more pressure on the rupee and inflation.",next:"The RBI's rate decision on October 7, and any movement in US-Iran talks.",src:"Fortune / Al Jazeera / India TV News"},
{c:"B",k:"Business",title:"Leaked Anthropic prospectus shows fast growth and heavy losses",dek:"The filing reportedly shows $4.6 billion in 2025 revenue, an operating loss above $8 billion, and $11.5 billion in revenue in Q2 2026 alone.",body:"A leaked draft of Anthropic's IPO prospectus, reported by Reuters and Fortune, shows 2025 revenue of $4.6 billion against an operating loss of more than $8 billion. Revenue reached $11.5 billion in Q2 2026, and the company says it was operationally profitable for two straight quarters. It plans $518 billion in cloud and data centre spending, and about a quarter of revenue comes from two customers. OpenAI is reportedly raising at least $30 billion at a valuation near $1.4 trillion.",why:"It is the first detailed look at the finances of a frontier AI lab heading for a public listing, and how much the AI buildout costs.",src:"Fortune / The Neuron"},
{c:"T",k:"AI",lead:1,big:2,title:"Trump and AI chiefs sign voluntary super intelligence safety accord",dek:"Leaders from OpenAI, Anthropic, Google, Meta, Nvidia, Microsoft and others agreed to layered audits. Trump called it morally binding, not legally binding.",body:"At the White House, President Trump and executives including Elon Musk, Mark Zuckerberg, Dario Amodei, Jensen Huang, Greg Brockman and Sundar Pichai signed a voluntary accord on what Trump now calls super intelligence. The companies committed to four layers of controls and audits, including internal evaluations, outside audits and board reviews, and to meet regularly to set safety standards. Trump likened it to a constitution and signed an order telling agencies to use the term super intelligence instead of artificial intelligence. Senator Mark Warner said voluntary standards are not enough.",why:"Almost every major AI lab is now on record with the same safety commitments, but nothing in the accord can be enforced.",next:"Whether the controls are written into law, and an FTC probe into AI companies' safety claims.",src:"CBS News / Axios"},
{c:"T",k:"Space",title:"SpaceX Crew-13 set to launch to the ISS tonight",dek:"Liftoff is planned for 8:40 PM IST from Cape Canaveral. Forecasters give 60% odds of good weather; Friday is the backup.",body:"NASA's Jessica Watkins and Luke Delaney, Canada's Joshua Kutryk and Russia's Sergey Teteryatnikov are scheduled to launch aboard a Falcon 9 and the Crew Dragon Grace at 11:10 AM EDT (8:40 PM IST) for a six-month stay on the International Space Station. Docking is expected about eight hours after liftoff. Weather is 60% favourable; if the launch is scrubbed, the next attempt is Friday.",src:"Space.com"},
{c:"T",k:"Consumer Tech",title:"Apple's next launch is October 13: a smart home hub and new Apple TV",dek:"Bloomberg reports a square-screen home hub running homeOS, a HomePod mini 2 and a fourth-generation Apple TV 4K, all built around Siri AI.",body:"Apple will launch new products on October 13, according to Bloomberg's Mark Gurman. Expected are an all-new smart home hub with a 6 to 7 inch square display running a new homeOS, available as a tabletop or wall-mounted unit; a HomePod mini 2 with Wi-Fi 7 and new colours; and an Apple TV 4K with an A19-class chip and more memory for Apple Intelligence. It is unclear whether Apple will hold a full event or use press releases.",src:"MacRumors / Bloomberg"},
{c:"I",k:"Personal Finance",lead:1,big:5,title:"New rules from today: LPG biometric check, child Aadhaar fee, bulk FD limit",dek:"Unverified LPG customers lose the subsidy. Updating a child's Aadhaar biometrics now costs Rs 125.",body:"Biometric Aadhaar authentication is now mandatory to get subsidised LPG; about 89.9% of active customers had completed it by mid-September. Free biometric updates for children ended yesterday, and a Rs 125 fee applies from today. Fixed deposits of Rs 3 crore or more now count as bulk deposits, up from Rs 2 crore. Registering births or deaths late now needs magistrate approval, and buyers of property from NRIs no longer need a separate TAN for TDS.",why:"If your LPG connection isn't biometrically verified, your next refill is at market price.",next:"UPI merchant charge changes on October 15.",src:"India TV News"},
{c:"I",k:"Climate",title:"Monsoon ends at 87% of normal, fourth-weakest since 2001",dek:"June was the weakest month at 65%. IMD expects below-normal rain across most of India in October.",body:"India received 759.4 mm of rain in the June-September monsoon, 87% of the long-period average and the fourth-lowest since 2001. Seventeen of 36 subdivisions were deficient and only Odisha saw excess rain. June came in at 65% of normal, July 101%, August 84% and September 92%. IMD forecasts below-normal rainfall and above-normal temperatures for most of the country in October.",src:"The Bridge Chronicle"},
{c:"L",k:"Health",lead:1,big:4,title:"Congo's Ebola outbreak passes 8,000 cases",dek:"Nearly 3,900 people have died. The Bundibugyo strain has no approved vaccine or treatment, and WHO says the outbreak is far from over.",body:"The Democratic Republic of Congo has recorded 8,067 confirmed Ebola cases and 3,901 deaths, its worst outbreak ever. The hotspot is Butembo in North Kivu, with cases also in Ituri and Tshopo. The Bundibugyo strain has no approved vaccine or treatment; experimental options are being trialled, but Tshopo has run out of experimental vaccine. Community mistrust is hampering the response. The US has committed $267 million toward a $2 billion global target.",why:"WHO warns it could surpass the 2014-16 West Africa epidemic, which killed more than 11,000 people.",next:"Whether the $2 billion funding target is met and experimental vaccine supplies reach Tshopo.",src:"Al Jazeera"},
{c:"M",k:"Maharashtra",lead:1,title:"Aadhaar verification now mandatory for property registration in Maharashtra",dek:"Revenue Minister Bawankule said 63 categories of documents, including sales and mortgages, will not be registered without it.",body:"From today, parties to 63 categories of property documents in Maharashtra, including sale deeds, mortgages and partition deeds, must complete Aadhaar-based identity verification before registration. Revenue Minister Chandrashekhar Bawankule said the aim is to curb impersonation, fake identities and fictitious witnesses. People without Aadhaar can submit their enrolment receipt plus another government ID.",why:"Anyone buying, selling or mortgaging property needs every party's Aadhaar verification done before visiting the registrar.",src:"Punekar News"},
{c:"M",k:"Maharashtra",title:"Fadnavis: drought aid even where talukas miss the technical criteria",dek:"265 of the state's 358 talukas are already drought-declared. Inspections will now be done at the revenue-circle level.",body:"Chief Minister Devendra Fadnavis said farmers who suffered real crop losses will not be denied relief because of technicalities. About 20 talukas failed to qualify under the Trigger-1 criteria because heavy rain in some revenue circles skewed taluka averages, so the cabinet moved inspections down to the revenue-circle level. The state also has a Rs 496 crore fodder development policy for livestock.",src:"Deccan Chronicle"},
{c:"P",k:"Pune",lead:1,title:"Pune's monsoon ends at 736.2 mm; 10% phased water cut ordered",dek:"More than half the season's rain fell in a single July week. Dams are nearly 95% full, but Khadakwasla trails last year.",body:"Pune's Shivajinagar observatory recorded 736.2 mm of rain between June 1 and September 30, with about 53% falling between July 3 and 9. The four main dams hold 29.62 TMC, or 94.76% of capacity, though Khadakwasla is notably lower than last year. The state has directed a phased 10% water cut across urban and rural areas so supplies last until August 2027. Expect clear skies with brief drizzle today and a high near 28°C.",why:"The dams look full, but the state wants water to last 10 more months through a dry October, so the cut is coming anyway.",src:"The Bridge Chronicle / LatestLY"},
{c:"P",k:"Pune",title:"HCMT elevated road work to begin on two stretches in November",dek:"Sinhagad Road–Lullanagar and Viman Nagar–Bombay Sappers go first on the 43-km, Rs 3,722 crore corridor.",body:"PMC will start construction in November on two stretches of the long-delayed High Capacity Mass Transit route: about 10 km from Sinhagad Road to Lullanagar via Sarasbaug and Satara Road, and about 12 km from Viman Nagar to Bombay Sappers via New Airport Road, with a flyover at Vishrantwadi Chowk. Commissioner Naval Kishore Ram said work will begin where municipal roads already exist. The detailed project report is due in December.",src:"The Bridge Chronicle"}
]},

explainer:{title:"Why Indian stocks keep falling",body:"The Nifty has dropped for eight weeks straight, its longest run since 2001. Analysts mostly blame outside forces. Brent crude is near $100, which raises India's import bill. Bond yields are at multi-year highs, which makes safer assets more attractive than shares. Foreign investors keep selling. And most economists now expect the RBI to raise interest rates on October 7, which would make borrowing costlier for companies and households. Auto stocks fell hardest yesterday (about 3.5%), while IT stocks rose 2.1%, partly because IT companies earn in dollars and benefit when the rupee is weak.",src:"Business Standard"},
dots:{title:"Strong tax collections, falling stock prices",body:"September GST collections rose 14.7% to Rs 2.04 lakh crore, and domestic collections grew 9.3%, a sign that spending inside India is holding up. On the same day, the Sensex fell for a fourth session. The two are consistent: analysts say the market sell-off is driven mainly by global factors (oil, bond yields, foreign selling), not by a collapse in domestic demand. Part of the GST jump also came from imports, where collections rose 29%."},
