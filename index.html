stories:[
{c:"Pune",lead:1,big:1,one:1,status:"Confirmed",st:"upd",since:"A day after the first Thursday shutdown, the district wants deeper savings.",made:"The weekly no-water day may not be enough.",title:"Pune district orders a 20% cut in Khadakwasla water use",dek:"Collector Jitendra Dudi said the dams are about 80% full when they are usually full by mid-October. The Pavana system stays at a 10% cut.",why:"PMC has to find twice the savings the Thursday shutdown was meant to deliver; irrigation officials have proposed alternate-day supply, but nothing has been decided.",who:"Everyone on PMC water; farmers in drought-hit talukas.",ctx:"Drought has been declared in 10 talukas of Pune district, and tankers are already supplying villages in Baramati, Indapur and Daund.",body:"Collector Jitendra Dudi announced a 20% cut in water use from the Khadakwasla dam system on Thursday, the Free Press Journal and Pune Pulse reported. 'Usually, the dams are 100% full by October 15, but this year the storage is around 80%,' Dudi said. 'If anyone misuses water or uses motors and other machines to draw water improperly, action will be taken.' Joint flying squads of revenue, power, police and water resources officials will seize pumps and motors used to draw water illegally, and power will be cut where theft is found, Pune Pulse reported; the water resources department's Prithviraj Phalke proposed alternate-day supply and said the city may need a 25% cut. Crop-damage surveys are about 80% complete, with a report due on October 20 and aid promised before Diwali. Thursday was Pune's first citywide no-water day; we found no reports yet on how it went.",next:"How PMC turns the 20% target into a supply schedule.",src:"Pune Pulse / Free Press Journal",links:[{o:"Pune Pulse",u:"https://www.mypunepulse.com/pune-district-plans-water-conservation-local-bodies-asked-to-prepare-for-20-cut/"},{o:"Free Press Journal",u:"https://www.freepressjournal.in/pune/pune-district-plans-water-rationing-till-august-2027-khadakwasla-supply-cut-by-20-collector-jitendra-dudi"}],th:"monsoon",loc:[18.45,73.79,"Khadakwasla, Pune"]},
{c:"India",big:2,status:"Confirmed",st:"upd",since:"After two days' delay, the court heard the petition.",made:"The Election Commission must now answer in court.",title:"Supreme Court issues notice to Election Commission on opposition's voter-list petition",dek:"The court did not pause the revision. It asked Sanjay Raut to explain his remarks about judges and issued him a contempt notice.",why:"The Election Commission must defend the revision in court; until the case is decided, the revision continues.",who:"Voters; opposition parties; the Election Commission.",ctx:"'Issuing notice does not mean that we are condemning anything,' Chief Justice Surya Kant said.",body:"A bench of Chief Justice Surya Kant and Justice Joymalya Bagchi issued notice to the Election Commission, Chief Election Commissioner Gyanesh Kumar and the two Election Commissioners, and tagged the petition by Rahul Gandhi, Mallikarjun Kharge and other opposition leaders with pending challenges from several states, LiveLaw and Bar & Bench reported. The court questioned the opposition's October 12 march to the court and wants an explanation at the next hearing, The Week reported; Kapil Sibal appeared for Gandhi. Shiv Sena (UBT) MP Sanjay Raut's petition was entertained 'on a provisional basis, subject to his explaining his conduct', over his claim that judges were seen playing badminton with politicians in London. With the Attorney General's consent, the court issued a criminal contempt show-cause notice to Raut and journalist Nikhil Wagle. It also sought replies from the Centre and Delhi Police on closing Jantar Mantar to protests. No date for the next hearing was reported.",next:"The Election Commission's reply and the next hearing.",src:"LiveLaw / Bar & Bench / The Week",links:[{o:"LiveLaw",u:"https://www.livelaw.in/amp/top-stories/rahul-gandhi-others-v-election-commission-of-india-live-updates-from-supreme-court-554720"},{o:"Bar & Bench",u:"https://www.barandbench.com/news/litigation/supreme-court-issues-notice-to-eci-cec-on-plea-by-rahul-gandhi-india-bloc-leaders-challenging-sir-voter-deletions"},{o:"The Week",u:"https://www.theweek.in/news/india/2026/10/15/sir-row-sc-seeks-answers-from-eci-asks-rahul-gandhi-to-explain-march.html"},{o:"Bar & Bench (contempt)",u:"https://www.barandbench.com/news/supreme-court-issues-contempt-notice-to-sanjay-raut-nikhil-wagle-over-remarks-targeting-cji-kant-judiciary"}],loc:[28.62,77.24,"Supreme Court, New Delhi"]},
{c:"Markets",big:3,status:"Confirmed",st:"upd",since:"Wednesday's dip was more than reversed.",made:"Asia's AI sell-off sent money to India.",title:"Sensex jumps 1,534 points as money moves from Asia's AI stocks to India",dek:"The Sensex closed at 74,315.61 as South Korea's Kospi plunged 7.6%. Wipro's profit fell 1.4%.",why:"Large Indian stocks gained but small and mid-sized ones fell, a sign the rally is narrow.",who:"Investors and SIP holders; IT employees.",ctx:"Foreign investors were still net sellers, selling ₹5,285 crore of shares on Thursday.",body:"The Sensex rose 1,533.72 points, or 2.11%, to 74,315.61 and the Nifty 374.65 points to 22,997.35 on Thursday, Business Standard reported; IT stocks led, while midcap and smallcap indices fell. Analysts said cheaper oil, easing bond yields and a global sell-off in AI stocks pushed money towards Indian large caps. Yes Bank fell about 20% after the Supreme Court upheld the quashing of its ₹8,415-crore AT-1 bond write-off. Wipro's quarterly profit fell 1.4% to ₹3,201 crore, below estimates, and its large deals fell 59% from the previous quarter. The rupee rose for a fifth day, to about 95 to the dollar, PTI reported.",next:"Bank results expected this weekend; Infosys on October 23.",src:"Business Standard / PTI",links:[{o:"Business Standard",u:"https://www.business-standard.com/markets/news/stock-market-live-october-15-bse-sensex-today-nifty50-gift-nifty-crude-oil-prices-q2-results-ipo-today-126101500089_1.html"},{o:"Business Standard (Wipro)",u:"https://www.business-standard.com/amp/companies/quarterly-results/wipro-q2-results-net-profit-falls-1-4-to-3-200-6-cr-revenue-rises-9-126101500857_1.html"},{o:"PTI (via HDFC Sky)",u:"https://hdfcsky.com/news/inr-vs-usd-rate-october-15-2026"}],th:"markets",loc:[18.93,72.83,"Dalal Street, Mumbai"]},
{c:"Geopolitics",big:4,status:"Reported",st:"dev",since:"US strikes on Iran are being discussed again after weeks of relative calm.",made:"Washington is preparing options against Iran.",title:"US draws up plans to use its biggest non-nuclear bomb on Iran; Trump eyes a buried nuclear site",dek:"CBS confirmed CNN's report on plans to use the 30,000-pound bomb. Trump said the US 'may have to' strike Pickaxe Mountain.",why:"A US strike would end the recent lull with Iran and could push oil, and India's fuel bill, higher.",who:"Indians in the Gulf; oil importers; fuel buyers.",ctx:"Trump had earlier pledged not to attack Iran before the November 3 midterms.",body:"The White House and Pentagon have drawn up plans to use the GBU-43/B, known as the 'mother of all bombs', against Iranian military, energy or nuclear sites if Trump orders it, CBS News reported, confirming a CNN report; the White House said it does 'not comment on sensitive military plans that may or may not exist.' Trump told Newsmax: 'We may have to go there. We'll take a shot at that one,' referring to Pickaxe Mountain, a deeply buried site linked to Iran's nuclear programme, Reuters reported. He added: 'I wouldn't use nuclear.' In Yemen, Houthi missiles struck near the presidential palace in Aden; the health ministry said five people were killed, Al Jazeera reported.",next:"Iran's response, and whether Trump orders a strike.",src:"CBS News / Reuters / Al Jazeera",links:[{o:"CBS News",u:"https://www.cbsnews.com/news/iran-trump-administration-mother-of-all-bombs/"},{o:"Reuters (via Al-Monitor)",u:"https://www.al-monitor.com/originals/2026/10/trump-says-us-may-need-strike-irans-pickaxe-mountain"},{o:"Al Jazeera (Aden)",u:"https://www.aljazeera.com/news/2026/10/15/houthis-target-yemens-presidential-palace-in-aden-with-missiles"}],th:"iran",loc:[38.87,-77.06,"The Pentagon, Washington"]},
{c:"World",big:5,status:"Reported",st:"dev",since:"The three-day pause on refinery strikes is over.",made:"Kyiv defies Washington on Russian oil.",title:"Ukraine resumes strikes on Russian refineries; Trump calls it a 'disgrace'",dek:"Zelenskyy said 'We're done' with the pause after Russia kept hitting Ukraine's grid. Drones hit a refinery in Ryazan.",why:"Strikes on Russian refineries affect global fuel supplies and Ukraine's ties with the US.",who:"Ukrainians; fuel importers.",ctx:"The US had reportedly threatened to cut intelligence sharing to stop the refinery strikes.",body:"Ukrainian drones hit a refinery in Ryazan, about 300 km southeast of Moscow, early on Thursday after Zelenskyy told the Financial Times Ukraine was ending its three-day pause on such strikes, AP reported. 'Well, I think that's a disgrace,' Trump told Newsmax, the Kyiv Post reported, adding: 'I find Zelensky to be more difficult to deal with than Putin.' Russian Foreign Minister Sergei Lavrov called the strikes a 'direct and crude challenge to President Trump.' A Russian attack on Kropyvnytskyi killed three people, the Kyiv Independent reported.",next:"Zelenskyy's request for EU funding at today's Brussels summit.",src:"AP / Kyiv Post / Kyiv Independent",links:[{o:"AP (via PBS)",u:"https://www.pbs.org/newshour/world/ukraine-resumes-attacks-on-russian-oil-refineries-as-relations-with-trump-sour"},{o:"Kyiv Post",u:"https://www.kyivpost.com/post/87217"},{o:"Kyiv Independent",u:"https://kyivindependent.com/intense-russian-assault-on-kropyvnytskyi-kills-3-injures-6/"}],th:"ukraine",loc:[54.63,39.74,"Ryazan, Russia"]},
{c:"Pune",status:"Reported",st:"new",made:"A crack in the ruling alliance, in Pune.",title:"Shinde backs an independent against BJP in Pune teachers' council seat",dek:"Deputy CM Eknath Shinde said Shiv Sena will support Sachin Sanap against the BJP's Kaustubh Gawde, calling it a 'friendly contest'.",why:"The split could decide who represents Pune division's teachers in the legislative council.",who:"Teachers and graduates who vote in the council polls.",ctx:"Polling for the Pune graduates' and teachers' seats is on October 23; counting is on October 27.",body:"Speaking at a Navratri event in Pune on Thursday, Shinde said: 'Although we are contesting elections as Mahayuti, a 'friendly contest' may take place in certain places as an exception,' PTI reported. He said the ruling alliance would still win all five council seats. The opposition alliance backs sitting Congress MLC Jayant Asgaonkar. About 62,000 teachers are registered to vote for the seat, the Free Press Journal reported.",next:"Polling on October 23.",src:"PTI / Free Press Journal",links:[{o:"PTI (via Deccan Herald)",u:"https://www.deccanherald.com/india/maharashtra/maharashtra-mlc-polls-mahayuti-will-win-all-5-seats-says-eknath-shinde-slams-oppn-over-farm-issues-4184509"},{o:"Free Press Journal",u:"https://www.freepressjournal.in/pune/maharashtra-mlc-elections-2026-pune-graduates-teachers-polls-on-oct-23-check-candidates-voter-eligibility"}],loc:[18.52,73.86,"Pune"]},
{c:"Tech",status:"Reported",st:"new",made:"The AI boom has its worst day in months.",title:"AI stock sell-off: South Korea's Kospi plunges 7.6%",dek:"SK Hynix fell 11% and Samsung 9.5%; Japan's Nikkei fell 4.9%.",why:"Chip and AI stocks sit in many global funds; Indian large caps gained as money moved away from Asian tech.",who:"Investors in global and tech funds.",ctx:"Investors are worried about high valuations and the cost of borrowing to build AI data centres.",body:"Seoul's Kospi fell 7.6%, triggering a circuit breaker, CNN reported. Worries included a hot US inflation reading, which makes debt-funded AI spending costlier, high valuations and signs of slowing growth at AI companies. Jefferies' Mohit Kumar said 'a slowdown in the AI infrastructure build out would imply a sharp slowdown in US growth expectations.' TSMC fell 2% and ASML nearly 5%.",next:"Whether the sell-off spreads to US markets.",src:"CNN (via Yahoo Finance)",links:[{o:"CNN (via Yahoo Finance)",u:"https://finance.yahoo.com/markets/stocks/articles/global-tech-selloff-deepens-enthusiasm-104622434.html"}],loc:[37.52,126.93,"Seoul, South Korea"]},
{c:"Science",status:"Reported",st:"new",made:"A study links a record storm to climate change.",title:"Climate change did more than El Niño to supercharge Hurricane Polo, study finds",dek:"Scientists say warming made the storm's conditions 23 times more likely, against 14 times for El Niño.",why:"El Niño is also behind this year's weak monsoon and Pune's water cuts.",who:"Coastal communities; anyone affected by El Niño years.",ctx:"The study by World Weather Attribution and Climate Central has not been peer reviewed.",body:"Polo went from a tropical storm to Category 5 in about 24 hours and was the longest-lasting Category 5 storm recorded in the Pacific, at about two and a half days, AP reported. Climate change added about 6 mph to its winds and El Niño about 5 mph, the scientists estimated. 'El Niño comes and goes, but climate change only gets worse,' said Friederike Otto.",next:"Whether El Niño strengthens from December, as India's weather office has forecast.",src:"AP",links:[{o:"AP (via WSLS)",u:"https://www.wsls.com/news/world/2026/10/15/study-says-global-warming-did-more-than-el-nino-to-turbocharge-hurricane-polo/"}],loc:[15.0,-110.0,"Eastern Pacific"]},
{c:"World",status:"Reported",st:"new",made:"An alleged plot against a Hindu temple in the US.",title:"Teen arrested over alleged plot to attack Hindu temple near Chicago",dek:"Police say they found a rifle, body armour and a manifesto. India's foreign ministry said it was 'deeply concerned'.",why:"Many Indian families worship at temples like this one across the US.",who:"Indians and the Indian diaspora in the US.",ctx:"The temple is the Sri Venkateswara (Balaji) Temple in Aurora, Illinois.",body:"Alexandros Paporakis, 19, was arrested over an alleged plan for a mass shooting at the temple, The Week reported. MEA spokesperson Randhir Jaiswal said: 'We are deeply concerned by reports of an alleged plot to carry out a mass shooting targeting a Hindu temple.'",next:"Charges in court.",src:"The Week",links:[{o:"The Week",u:"https://www.theweek.in/news/india/2026/10/15/alexandros-paporakis-hindu-temple-mass-shooting.html"}],loc:[41.76,-88.32,"Aurora, Illinois"]},
{c:"Sports",status:"Confirmed",st:"upd",since:"India lost in Hyderabad on Wednesday.",made:"It all comes down to Bengaluru.",title:"India must win in Bengaluru to avoid first home T20I series loss since 2019",dek:"The series is 2-2. Showers are forecast for Saturday's decider at the Chinnaswamy Stadium.",why:"A loss would be India's first home T20I series defeat since Australia won 2-0 in February 2019.",who:"Cricket fans.",ctx:"Shai Hope has made 539 runs and four hundreds on the tour.",body:"The fifth T20I starts at 7 pm IST on Saturday, The Statesman reported. Arshdeep Singh, injured in Hyderabad, will be assessed before the match, and Bhuvneshwar Kumar has been added as cover. Jasprit Bumrah, Hardik Pandya and Washington Sundar are unavailable.",next:"The match on Saturday.",src:"The Statesman / BCCI",links:[{o:"The Statesman",u:"https://www.thestatesman.com/sports/india-vs-west-indies-5th-t20i-preview-india-aim-to-protect-home-record-as-rain-threatens-bengaluru-clash-1503651844.html"},{o:"BCCI",u:"https://www.bcci.tv/matches/b567f7d4-7455-48b3-8ec2-f76ce4788e70/india-vs-west-indies"}],loc:[12.98,77.60,"Bengaluru"]}

const GKEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GRE=new RegExp("(^|[^A-Za-z0-9])("+GKEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(s?)(?![A-Za-z0-9])","gi");
function gloss(t,used){
  used=used||new Set();
  return String(t).replace(GRE,(all,pre,m,pl)=>{
    const k=GKEYS.find(k=>k.toLowerCase()===m.toLowerCase());
    if(!k||used.has(k)||(k===k.toUpperCase()&&m!==k))return all;
    used.add(k);
    return `${pre}<button type="button" class="gl" data-g="${k}" aria-expanded="false">${m}${pl}</button>`;
  });
}

/* ===== which stories go in each depth ===== */
function five(iss){
  const S=iss.stories;
  let L=S.filter(s=>s.big).sort((a,b)=>a.big-b.big);
  if(!L.length)L=S.filter(s=>s.lead);
  if(!L.length)L=S.slice(0,4);
  const one=S.find(s=>s.one)||L[0];
  return [one,...L.filter(s=>s!==one)].slice(0,5);
}
function fullList(iss){
  const top=five(iss),rest=iss.stories.filter(s=>!top.includes(s));
  const rank=s=>matchInt(s)?0:1;
  rest.sort((a,b)=>rank(a)-rank(b));
  let L=[...top,...rest];
  const E=edOf(ed);if(E.match){const loc=L.filter(E.match);L=[L[0],...loc.filter(s=>s!==L[0]),...L.slice(1).filter(s=>!E.match(s))];}
  return L;
}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

function icsEsc(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsFile(evs){

  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//the-daily-transit//EN","CALSCALE:GREGORIAN"];

function fromHash(){

function doSearch(v){

  const res=[];
  for(let i=ISSUES.length-1;i>=0;i--)ISSUES[i].stories.forEach(s=>{const t=(s.title+" "+s.dek+" "+s.body+" "+(s.k||"")+" "+CATS[s.c]).toLowerCase();if(terms.every(x=>t.includes(x)))res.push(s);});
  const hl=t=>{let r=esc(strip(t));terms.forEach(x=>{r=r.replace(new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");});return r;};
  out.innerHTML=res.length?`<li style="cursor:auto;color:var(--faint);font-size:.75rem">${res.length} result${res.length>1?"s":""}</li>`+res.slice(0,60).map(s=>`<li role="button" tabindex="0" data-open="${s._i}|${esc(s.title)}"><small>Issue ${ISSUES[s._i].num} · ${short(ISSUES[s._i].label)} · ${esc(s.k||CATS[s.c])}</small><b>${hl(s.title)}</b></li>`).join(""):`<li style="cursor:auto" class="empty">Nothing found.</li>`;

  const st=NP_STYLES.map(s=>`<button class="npstyle${npSel.style===s.id?" on":""}" data-st="${s.id}" aria-pressed="${npSel.style===s.id}" onclick="npPick('style','${s.id}')">
    <span class="npmini np-${s.id}"><span class="mm">The Daily Transit</span><span class="mr"></span><span class="ml"><i></i><i></i><i></i></span></span><b>${s.n}</b><span>${s.d}</span></button>`).join("");
  const sz=Object.keys(NP_SIZES).map(k=>`<button class="npsize${npSel.size===k?" on":""}" data-sz="${k}" aria-pressed="${npSel.size===k}" onclick="npPick('size','${k}')"><b>${k}</b><span>${NP_SIZES[k].d}</span></button>`).join("");
  openPanel("Print newspaper",`<p class="crintro">Pick a style and a paper size.</p>
  <div class="lab nplab">Style</div><div class="npstyles">${st}</div>
  <div class="lab nplab">Paper size</div><div class="npsizes">${sz}</div>
  <div class="mact npact"><button class="pbtn" onclick="openPrint()">‹ Back</button><button class="pbtn pri" id="npok" onclick="npConfirm()" ${npSel.style&&npSel.size?"":"disabled"}>Confirm</button></div>`);
}
function npPick(k,v){
  npSel={...npSel,[k]:v};
  const sel=k==="style"?".npstyle":".npsize",at=k==="style"?"data-st":"data-sz";
  document.querySelectorAll(sel).forEach(b=>{const on=b.getAttribute(at)===v;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);});
  $("npok").disabled=!(npSel.style&&npSel.size);
}
function npConfirm(){if(!(npSel.style&&npSel.size))return;LS.set("dl_np",npSel);closeMod();setTimeout(()=>openPaper(npSel.style,npSel.size),260);}

/* ===== newspaper: content helpers ===== */
const npT=t=>esc(strip(t||""));
function npSent(t){return strip(t||"").split(/(?<=[.!?]['"’”)]?)\s+(?=[A-Z0-9'"‘“(₹$])/).filter(Boolean);}
function npKick(s){return esc(s.k&&s.k!==CATS[s.c]?CATS[s.c]+" · "+s.k:(s.k||CATS[s.c]||""));}
function npImgURL(im,w){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(im.f.replace(/^File:/,"").replace(/ /g,"_"))+"?width="+(w||1000);}
function npCredit(im){return `${im.fp?"File photo. ":""}${im.c?npT(im.c)+" ":""}<span class="npcr">Photo: ${npT(im.a||"Unknown")} / Wikimedia Commons, ${npT(im.l)}</span>`;}
function npGlobe(s){
  if(!s.loc)return "";
  const [la,lo,pl]=s.loc,ns=la>=0?"N":"S",ew=lo>=0?"E":"W";
  let g="";for(let i=-60;i<=60;i+=30){const y=50-i*0.75,r=Math.cos(i*Math.PI/180)*40;g+=`<ellipse cx="50" cy="${y}" rx="${r}" ry="${r*0.12}"/>`;}
  for(let i=1;i<6;i++){const rx=40*Math.abs(Math.cos(i*Math.PI/6));g+=`<ellipse cx="50" cy="50" rx="${rx}" ry="40"/>`;}
  return `<figure class="npcard"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" class="gb"/><g class="gl2">${g}</g><circle cx="50" cy="50" r="4.5" class="gd"/><circle cx="50" cy="50" r="9" class="gr"/></svg><figcaption><b>${npT(pl)}</b><span>${Math.abs(la).toFixed(2)}° ${ns}, ${Math.abs(lo).toFixed(2)}° ${ew}</span></figcaption></figure>`;
}
function npFig(s,big){
  if(s.img&&s.img.f)return `<figure class="npfig${big?" big":""}"><img src="${npImgURL(s.img,big?1400:800)}" alt="${npT(s.img.alt||s.title)}" loading="eager" onerror="npImgFail(this)" data-loc="${s._i}|${ISSUES[s._i].stories.indexOf(s)}"><figcaption>${npCredit(s.img)}</figcaption></figure>`;
  return "";
}
function npImgFail(img){const [i,j]=img.dataset.loc.split("|").map(Number),s=ISSUES[i]&&ISSUES[i].stories[j],f=img.closest("figure");if(!f)return;f.remove();}
function npDate(iss){const d=issueDate(iss);return d?d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):iss.label;}
function npMast(iss,style){
  if(style==="1900")return `<div class="npm"><div class="npear l">Read News<br>On The Go</div><div class="npname">The Daily Transit</div><div class="npear r">Issue<br>No. ${iss.num}</div></div>
   <div class="npdl"><span>${esc(npDate(iss).toUpperCase())}</span><span>❦</span><span>${iss.wknd?"WEEKEND EDITION":"MORNING EDITION"}</span></div>`;
  return `<div class="npm"><div class="npear l">${style==="transit"?"<b>Read News-On The Go</b>":"No. "+iss.num}</div><div class="npname">The Daily Transit</div><div class="npear r">${iss.wknd?"Weekend Edition":"Morning Edition"}</div></div>
   <div class="npdl"><span>${esc(npDate(iss))}</span><span>${style==="transit"?"Issue No. "+iss.num:"Read News-On The Go"}</span></div>`;
}
function npHead(iss,p){return `<div class="nprh"><span>The Daily Transit</span><span>${esc(npDate(iss))}</span><span>Page ${p}</span></div>`;}
function npBy(s){const n=srcNames(s);return n.length?`<p class="npsrc">Sources: ${n.map(esc).join(", ")}</p>`:"";}

/* ===== newspaper: layout ===== */
function paperPages(iss,style,size){
  const Z=NP_SIZES[size],S=iss.stories,top=five(iss),lead=top[0];
  const rest=S.filter(s=>s!==lead);
  const sec=top.slice(1).concat(rest.filter(s=>!top.includes(s))).slice(0,Z.sec);
  return {Z,lead,sec,more:rest.filter(s=>!sec.includes(s))};
}
function npFront(iss,style,P,leadN,secN,briefN){
  const {lead,sec,more}=P;
  const ls=npSent(lead.body),ln=Math.min(leadN,ls.length);
  const secHTML=sec.map(s=>{const b=npSent(s.body),n=Math.min(secN,b.length);return `<article class="npsec">${npFig(s)}<div class="npk">${npKick(s)}</div><h2>${npT(s.title)}</h2><p class="npdek">${npT(s.dek)}</p><p>${esc(b.slice(0,n).join(" "))}</p>${n<b.length?`<p class="npcont">Continued on page 2</p>`:npBy(s)}</article>`;}).join("");
  const briefs=more.slice(0,briefN).map(s=>`<li><b>${npT(s.title)}.</b> ${npT(s.dek)} <i>Page 2</i></li>`).join("");
  const rail=`<aside class="nprail"><div class="nprb"><h3>Today in 30 seconds</h3><ol>${(iss.sum||[]).map(t=>`<li>${npT(t)}</li>`).join("")}</ol></div>
   ${iss.number?`<div class="nprb npnum"><h3>The Number</h3><b>${npT(iss.number.v)}</b><p>${npT(iss.number.t)}</p></div>`:""}
   ${iss.talk?`<div class="nprb"><h3>Bring this up today</h3><p>${npT(iss.talk.t)}</p></div>`:""}
   <div class="nprb npidx"><h3>Inside</h3><ul>${npSectionsOf(P).map(g=>`<li>${esc(g)}<span>2</span></li>`).join("")}${iss.explainer?`<li>The Explainer<span>2</span></li>`:""}${iss.next?`<li>What to watch<span>2</span></li>`:""}</ul></div></aside>`;
  return `<section class="nppage front">${npMast(iss,style)}<div class="npfb"><div class="npmain">
   <article class="nplead"><div class="npk">${npKick(lead)}</div><h1>${npT(lead.title)}</h1><p class="npdek">${npT(lead.dek)}</p>
   <div class="npleadg">${npFig(lead,true)}<div class="npleadt"><p>${esc(ls.slice(0,ln).join(" "))}</p>${ln<ls.length?`<p class="npcont">Continued on page 2</p>`:""}${lead.why?`<p class="npwhy"><b>Why it matters:</b> ${npT(lead.why)}</p>`:""}${ln>=ls.length?npBy(lead):""}</div></div></article>
   <div class="npsecs" style="grid-template-columns:repeat(${Math.max(1,sec.length)},1fr)">${secHTML}</div>${briefs?`<div class="npbriefs"><h3>Also in today's paper</h3><ul>${briefs}</ul></div>`:""}
   </div>${rail}</div></section>`;
}
const NP_GROUPS=[["India",s=>s.c==="I"],["World",s=>s.c==="W"],["Money",s=>s.c==="B"],["Pune & Maharashtra",s=>s.c==="P"||s.c==="M"],["Science & Tech",s=>s.c==="T"],["Life",s=>s.c==="L"]];
function npSectionsOf(P){const all=[P.lead,...P.sec,...P.more];return NP_GROUPS.filter(([,f])=>all.some(f)).map(g=>g[0]);}
function npInsideBlocks(iss,P,cut){
  const B=[],placed=new Set();
  const cont=(s,n)=>{const b=npSent(s.body);return n<b.length?`<article class="npart"><div class="npk">Continued from page 1</div><h3>${npT(s.title)}</h3><p>${esc(b.slice(n).join(" "))}</p>${s.why&&s!==P.lead?`<p class="npwhy"><b>Why it matters:</b> ${npT(s.why)}</p>`:""}${npBy(s)}</article>`:"";};
  const c0=cont(P.lead,cut.lead);if(c0)B.push(c0);
  P.sec.forEach(s=>{const c=cont(s,cut.sec);if(c)B.push(c);});
  NP_GROUPS.forEach(([g,f])=>{
    const L=P.more.filter(f);if(!L.length)return;
    B.push(`<h2 class="npsh">${esc(g)}</h2>`);
    L.forEach(s=>B.push(`<article class="npart">${s.img&&s.img.f?npFig(s):""}${s.k&&s.k!==CATS[s.c]&&s.k!==g?`<div class="npk">${esc(s.k)}</div>`:""}<h3>${npT(s.title)}</h3><p class="npdek">${npT(s.dek)}</p><p>${npT(s.body)}</p>${s.why?`<p class="npwhy"><b>Why it matters:</b> ${npT(s.why)}</p>`:""}${npBy(s)}</article>`));
  });
  if(iss.explainer)B.push(`<div class="npbox"><h2 class="npsh">The Explainer</h2><h3>${npT(iss.explainer.title)}</h3><p>${npT(iss.explainer.body)}</p>${iss.explainer.src?`<p class="npsrc">Sources: ${npT(iss.explainer.src)}</p>`:""}</div>`);
  if(iss.dots)B.push(`<div class="npbox"><h2 class="npsh">Connect the dots</h2><h3>${npT(iss.dots.title)}</h3><p>${npT(iss.dots.body)}</p>${iss.dots.chain?`<ol class="npchain">${iss.dots.chain.map(x=>`<li>${npT(x)}</li>`).join("")}</ol>`:""}</div>`);
  if(iss.next){const nx=nextItems(iss).slice(0,8);B.push(`<div class="npbox"><h2 class="npsh">What to watch</h2><ul class="npwatch">${nx.map(x=>`<li>${x.d?`<b>${new Date(x.d+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</b> `:""}${npT(x.t)}</li>`).join("")}</ul></div>`);}
  return B;
}
function npOver(el){return el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1;}
function buildPaper(iss,style,size,host){
  const P=paperPages(iss,style,size),Z=P.Z;
  host.className="np np-"+style+" np-"+size;host.style.setProperty("--pw",Z.w+"mm");host.style.setProperty("--ph",Z.h+"mm");host.style.setProperty("--cols",Z.cols);
  // front page: shrink until it fits
  let leadN=size==="A3"?8:5,secN=size==="A3"?4:3,briefN=6;
  let compact=0;
  const fit=()=>{host.innerHTML=npFront(iss,style,P,leadN,secN,briefN);const m=host.querySelector(".npmain"),r=host.querySelector(".nprail");if(compact)m.classList.add("compact");return {m,r};};
  let {m,r}=fit(),guard=0;
  while(npOver(m)&&guard++<60){
    if(briefN>0)briefN--;else if(secN>1)secN--;else if(leadN>3)leadN--;
    else if(!compact)compact=1;
    else if(leadN>2)leadN--;
    else if(P.sec.length>1){P.more.unshift(P.sec.pop());}
    else break;
    ({m,r}=fit());}
  while(npOver(m)&&P.sec.length){P.more.unshift(P.sec.pop());({m,r}=fit());}
  while(npOver(r)){const li=r.querySelector(".nprb ol li:last-child");if(!li)break;li.remove();}
  if(!briefN){const b=host.querySelector(".npbriefs");if(b)b.remove();}
  const front=host.innerHTML;
  // inside pages: fill columns, start a new page on overflow
  const blocks=npInsideBlocks(iss,P,{lead:leadN,sec:secN});
  host.innerHTML=front;let p=2,page=null,flow=null;
  const newPage=()=>{page=document.createElement("section");page.className="nppage";page.innerHTML=npHead(iss,p++)+`<div class="npflow"></div><p class="npend">Every story's sources are linked at ${esc(location.host?location.host+location.pathname.replace(/index\.html$/,""):"The Daily Transit")} · Issue No. ${iss.num}</p>`;host.appendChild(page);flow=page.querySelector(".npflow");};
  newPage();
  for(let i=0;i<blocks.length;i++){
    flow.insertAdjacentHTML("beforeend",blocks[i]);
    if(npOver(flow)&&flow.children.length>1){
      const last=flow.lastElementChild;last.remove();
      const prev=flow.lastElementChild,carry=prev&&prev.classList.contains("npsh")?prev:null;if(carry)carry.remove();
      newPage();if(carry)flow.appendChild(carry);flow.insertAdjacentHTML("beforeend",blocks[i]);
    }
  }
  const lf=host.querySelector(".nppage:last-child .npflow");if(lf&&host.querySelectorAll(".nppage").length>1){lf.style.columnFill="balance";lf.style.flex="0 1 auto";}
  return host.querySelectorAll(".nppage").length;
}

/* ===== newspaper: preview and print ===== */
function openPaper(style,size){
  npFonts();
  const v=$("paperv");v.innerHTML=`<div class="npbar"><button class="pbtn" onclick="closePaper();setTimeout(openPrint,300)">‹ Change</button><span class="npbt">${esc(NP_STYLES.find(s=>s.id===style).n)} · ${size}</span><button class="pbtn pri" onclick="printPaper()">Print / Save as PDF</button><button class="pbtn npx" onclick="closePaper()" aria-label="Close newspaper">✕</button></div><div class="npstage"><div class="npscale"><div id="npdoc"></div></div></div><div class="npmsg" id="npmsg" hidden></div>`;
  v.classList.add("open");document.body.style.overflow="hidden";requestAnimationFrame(()=>v.classList.add("show"));
  const go=()=>{buildPaper(ISSUES[cur],style,size,$("npdoc"));npScale();};
  (document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(()=>{go();setTimeout(()=>{buildPaper(ISSUES[cur],style,size,$("npdoc"));npScale();},900);});
  go();
}
function npScale(){
  const d=$("npdoc"),sc=document.querySelector("#paperv .npscale");if(!d||!sc)return;
  const w=d.offsetWidth,avail=Math.min(innerWidth-24,1000),k=Math.min(1,avail/w);
  sc.style.transform=`scale(${k})`;sc.style.width=w+"px";sc.style.height=d.offsetHeight+"px";sc.parentNode.style.width=w*k+"px";sc.parentNode.style.height=d.offsetHeight*k+"px";
}
addEventListener("resize",()=>{if($("paperv").classList.contains("open"))npScale();});
function closePaper(){const v=$("paperv");if(!v.classList.contains("open"))return;v.classList.remove("show");setTimeout(()=>{v.classList.remove("open");v.innerHTML="";document.body.style.overflow="";},300);}
function printPaper(){
  const d=$("npdoc");if(!d)return;
  const imgs=[...d.querySelectorAll("img")].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.addEventListener("load",r,{once:true});i.addEventListener("error",r,{once:true});}));
  const ready=Promise.race([Promise.all([...imgs,document.fonts?document.fonts.ready:Promise.resolve()]),new Promise(r=>setTimeout(r,8000))]);
  ready.then(()=>{
    const sz=NP_SIZES[npSel.size]||NP_SIZES.A4;let st=$("nppg");if(!st){st=document.createElement("style");st.id="nppg";document.head.appendChild(st);}
    st.textContent=`@media print{@page{size:${sz.n} portrait;margin:0}}`;
    document.body.classList.add("np-print");
    let fired=false;const on=()=>{fired=true;};addEventListener("beforeprint",on,{once:true});
    const done=()=>{document.body.classList.remove("np-print");st.textContent="";};
    addEventListener("afterprint",done,{once:true});
    try{window.print();}catch(e){}
    setTimeout(()=>{removeEventListener("beforeprint",on);if(!fired){done();const m=$("npmsg");m.hidden=false;m.innerHTML=`<b>Printing is blocked here.</b> This happens in app previews and in-app browsers (for example, links opened from WhatsApp or Instagram). Open the site in Chrome or Safari and try again.`;}},700);
  });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("paperv").classList.contains("open")){e.stopImmediatePropagation();closePaper();}},true);
/* ===== start ===== */
$("corrbtn").textContent="Updates & Corrections ("+CORRECTIONS.length+")";
$("fname").textContent=(BRAND.name?BRAND.name+" · ":"")+ISSUES.length+" issues since "+ISSUES[0].label.replace(/^\w+, /,"");
updThemeBtn();updPlus();
missedToast();
{const lastBefore=LS.get("dl_last",0);if(!fromHash()){LS.set("dl_last",lastBefore);sinceBox();loadIssue(ISSUES.length-1);}}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
